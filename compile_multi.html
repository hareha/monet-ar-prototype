<!DOCTYPE html>
<meta charset="utf-8">
<title>compiling…</title>
<script type="module">
import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
const log = m => { console.log(m); fetch('/log?m=' + encodeURIComponent(m)).catch(()=>{}); };
const SRCS = ['quest_img/merson.jpg','quest_img/bouguereau.jpg','quest_img/fleury.jpg','quest_img/chavannes.jpg','quest_img/monet_sunrise.jpg'];
try {
  log('start multi');
  const imgs = [];
  for (const s of SRCS) {
    const img = new Image();
    img.src = s;
    await img.decode();
    imgs.push(img);
    log('loaded ' + s + ' ' + img.width + 'x' + img.height);
  }
  const compiler = new Compiler();
  await compiler.compileImageTargets(imgs, p => log('progress ' + p.toFixed(1)));
  const buffer = await compiler.exportData();
  log('compiled bytes=' + buffer.byteLength);
  await fetch('/save-mind?f=quest_targets.mind', { method: 'POST', body: buffer });
  log('SAVED');
  document.title = 'DONE';
} catch (e) {
  log('ERROR ' + (e && e.message || e));
  document.title = 'FAIL';
}
</script>
