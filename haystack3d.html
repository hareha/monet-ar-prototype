<style>

  html,body{margin:0;height:100%;background:#070605;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #view{position:fixed;inset:0;}
  a.home{position:fixed;top:max(12px, env(safe-area-inset-top));left:14px;z-index:9;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#f2efe8;text-decoration:none;background:rgba(20,18,14,.55);border:1px solid rgba(242,239,232,.35);padding:9px 15px 9px 12px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.25);}

  .cap{position:fixed;top:14px;right:14px;z-index:6;font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.5);font-weight:700;}

  .row{display:flex;gap:6px;}

    box-shadow:0 1px 3px rgba(28,26,22,.07),0 2px 0 #d8d3c8;}
  .row button:active{transform:translateY(2px);box-shadow:none;}
  .row button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .sliders{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px;}

  .acts button{flex:1;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .acts button:active{transform:translateY(2px);box-shadow:none;}
  .hint{font-size:10px;color:#a89f8d;text-align:center;margin-top:8px;}

  #shotView{position:fixed;inset:0;z-index:20;background:rgba(7,6,5,.92);display:none;align-items:center;justify-content:center;padding:22px;}
  #shotView.on{display:flex;}
  .card{background:#fff;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7);}

  .card a,.card button{flex:1;text-align:center;text-decoration:none;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:11px;cursor:pointer;
    background:#1c1a16;color:#faf9f6;border:0;}
  .card button.ghost{background:#fff;border:1px solid #d8d3c8;color:#6f6a5e;}

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
camera.position.set(.4, 2.4, innerWidth < innerHeight ? 10.4 : 8.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.65, 0);
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 3.4; controls.maxDistance = 11;
// 방이 앞면만 열려 있으므로 좌우 회전 제한 (관람 동선 시점)
controls.minAzimuthAngle = -Math.PI * .42;
controls.maxAzimuthAngle =  Math.PI * .42;
controls.enablePan = false;
controls.enableDamping = true;

// ══════════ 프로시저럴 텍스처 ══════════
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);

// 짚 결
const strawTex = canvasTex(1024, 1024, (x,w,h) => {
  x.fillStyle = '#a3803c'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 4200; i++) {
    const px = Math.random()*w, py = Math.random()*h;
    const len = rnd(26, 90), ang = Math.PI/2 + rnd(-.28,.28);
    x.strokeStyle = `hsla(${rnd(35,48)},${rnd(42,65)}%,${rnd(34,68)}%,${rnd(.25,.6)})`;
    x.lineWidth = rnd(.7, 2.2);
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang+.3)*len*.5, py + Math.sin(ang+.3)*len*.5,
                       px + Math.cos(ang)*len, py + Math.sin(ang)*len);
    x.stroke();
  }
}, [3, 2]);
const strawBump = canvasTex(512, 512, (x,w,h) => {
  x.fillStyle = '#808080'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 2600; i++) {
    const px = Math.random()*w, py = Math.random()*h, len = rnd(14, 50);
    const v = Math.round(rnd(70, 190));
    x.strokeStyle = `rgba(${v},${v},${v},.5)`;
    x.lineWidth = rnd(.6, 1.8);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-6,6), py + len); x.stroke();
  }
}, [3, 2]);

// 서리 낀 짚 (겨울)
const frostTex = canvasTex(1024, 1024, (x,w,h) => {
  x.fillStyle = '#8f7a52'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 3600; i++) {
    const px = Math.random()*w, py = Math.random()*h;
    const len = rnd(26, 80), ang = Math.PI/2 + rnd(-.28,.28);
    x.strokeStyle = `hsla(${rnd(35,48)},${rnd(18,34)}%,${rnd(34,58)}%,${rnd(.25,.55)})`;
    x.lineWidth = rnd(.7, 2.2);
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + Math.cos(ang)*len, py + Math.sin(ang)*len);
    x.stroke();
  }
  // 눈 얹힌 자국
  for (let i = 0; i < 2200; i++) {
    x.strokeStyle = `hsla(${rnd(200,225)},${rnd(12,26)}%,${rnd(82,96)}%,${rnd(.2,.55)})`;
    x.lineWidth = rnd(1, 3.4);
    x.lineCap = 'round';
    const px = Math.random()*w, py = Math.random()*h, len = rnd(6, 26);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-4,4), py + len); x.stroke();
  }
}, [3, 2]);

// 전시장 마루
const woodTex = canvasTex(1024, 1024, (x,w,h) => {
  const plank = 128;
  for (let r = 0; r < h/plank; r++) {
    const base = rnd(30, 38);
    const g = x.createLinearGradient(0, r*plank, 0, r*plank+plank);
    g.addColorStop(0, `hsl(30,22%,${base}%)`);
    g.addColorStop(.5, `hsl(32,20%,${base+3}%)`);
    g.addColorStop(1, `hsl(29,22%,${base-2}%)`);
    x.fillStyle = g;
    x.fillRect(0, r*plank, w, plank - 2);
    for (let i = 0; i < 24; i++) {
      x.strokeStyle = `hsla(28,26%,${rnd(18,28)}%,${rnd(.05,.16)})`;
      x.lineWidth = rnd(.5, 1.4);
      const yy = r*plank + rnd(4, plank-4);
      x.beginPath(); x.moveTo(0, yy);
      for (let px = 0; px <= w; px += 64) x.lineTo(px, yy + rnd(-3,3));
      x.stroke();
    }
    // 판재 이음새
    for (let sx = (r%2)*w/3; sx < w; sx += w/2) {
      x.strokeStyle = 'hsla(28,20%,14%,.5)'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(sx, r*plank); x.lineTo(sx, r*plank+plank-2); x.stroke();
    }
  }
}, [4, 4]);

// 건초 깔개 (더미 아래 흩어진 짚)
const strawPadTex = canvasTex(512, 512, (x,w,h) => {
  x.fillStyle = 'rgba(0,0,0,0)'; x.clearRect(0,0,w,h);
  for (let i = 0; i < 3800; i++) {
    const cxp = w/2, cyp = h/2;
    const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .6) * w*.48;
    const px = cxp + Math.cos(a)*rr, py = cyp + Math.sin(a)*rr;
    const alpha = .75 * (1 - rr/(w*.5));
    x.strokeStyle = `hsla(${rnd(36,50)},${rnd(40,60)}%,${rnd(35,62)}%,${alpha})`;
    x.lineWidth = rnd(.6, 1.6);
    const la = Math.random()*Math.PI*2, ll = rnd(4, 14);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(la)*ll, py + Math.sin(la)*ll); x.stroke();
  }
});

// 눈 깔개 (겨울, 더미 주변)
const snowPadTex = canvasTex(512, 512, (x,w,h) => {
  x.clearRect(0,0,w,h);
  const cxp = w/2, cyp = h/2;
  const g = x.createRadialGradient(cxp, cyp, 20, cxp, cyp, w*.5);
  g.addColorStop(0, 'rgba(238,242,248,.95)');
  g.addColorStop(.75, 'rgba(224,231,240,.75)');
  g.addColorStop(1, 'rgba(214,223,236,0)');
  x.fillStyle = g;
  x.beginPath(); x.arc(cxp, cyp, w*.5, 0, Math.PI*2); x.fill();
  for (let i = 0; i < 900; i++) {
    const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .7) * w*.46;
    x.strokeStyle = `hsla(${rnd(205,230)},${rnd(14,30)}%,${rnd(70,88)}%,${rnd(.15,.4)})`;
    x.lineWidth = rnd(2, 5);
    x.lineCap = 'round';
    const px = cxp + Math.cos(a)*rr, py = cyp + Math.sin(a)*rr;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-10,10), py + rnd(-4,4)); x.stroke();
  }
});

// 벽화: 모네 색감의 들판 — 계절별 팔레트 (여름 · 가을 · 겨울눈)
const SEASON_PAL = {
  '여름': { sky:['#aecfe8','#d5e4ea','#e4eede'], skyDab:[195,240,60,88], hill:'hsla(215,20%,60%,.9)',
           fld:['#7fae5a','#5f9348','#3f6b34'], dab:[62,135,25,55,26,58], treeMode:'lush',
           stackFar:'hsla(42,45%,42%,.85)' },
  '가을': { sky:['#cfd8e8','#dfd9d2','#e8dcc8'], skyDab:[200,260,72,90], hill:'hsla(230,18%,58%,.9)',
           fld:['#b6a95c','#96934e','#6d7038'], dab:[45,95,25,55,28,62], treeMode:'lush',
           stackFar:'hsla(38,42%,38%,.85)' },
  '겨울': { sky:['#c3c9d6','#dfdedd','#ece6de'], skyDab:[205,235,74,92], hill:'hsla(230,14%,66%,.9)',
           fld:['#e8ecf2','#d8dfe8','#bcc7d6'], dab:[200,230,14,32,68,90], treeMode:'bare',
           stackFar:'hsla(35,20%,48%,.85)' },
};
const muralCache = {};
function makeMural(season){
  if (muralCache[season]) return muralCache[season];
  const P = SEASON_PAL[season];
  const t = canvasTex(3072, 768, (x,w,h) => {
    const sky = x.createLinearGradient(0, 0, 0, h*.62);
    sky.addColorStop(0, P.sky[0]); sky.addColorStop(.55, P.sky[1]); sky.addColorStop(1, P.sky[2]);
    x.fillStyle = sky; x.fillRect(0, 0, w, h*.62);
    for (let i = 0; i < 1300; i++) {
      const py = Math.pow(Math.random(), 1.4) * h*.6;
      x.strokeStyle = `hsla(${rnd(P.skyDab[0],P.skyDab[1])},${rnd(12,30)}%,${rnd(P.skyDab[2],P.skyDab[3])}%,${rnd(.08,.22)})`;
      x.lineWidth = rnd(3, 9);
      const px = Math.random()*w, len = rnd(30, 110);
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-4,4)); x.stroke();
    }
    x.fillStyle = P.hill;
    x.beginPath(); x.moveTo(0, h*.56);
    for (let px = 0; px <= w; px += 64) x.lineTo(px, h*.56 + Math.sin(px*.003)*14 + rnd(-5,5));
    x.lineTo(w, h*.62); x.lineTo(0, h*.62); x.fill();
    // 나무: 여름·가을 = 무성한 수관 / 겨울 = 헐벗은 줄기
    if (P.treeMode === 'lush') {
      for (let i = 0; i < 38; i++) {
        const px = Math.random()*w, base = h*.60 + rnd(-6, 4), tw = rnd(10, 26), th = rnd(24, 60);
        x.fillStyle = `hsla(${rnd(P.dab[0],P.dab[1])},${rnd(22,36)}%,${rnd(28,42)}%,${rnd(.5,.85)})`;
        x.beginPath(); x.ellipse(px, base - th/2, tw/2, th/2, 0, 0, Math.PI*2); x.fill();
      }
    } else {
      for (let i = 0; i < 46; i++) {
        const px = Math.random()*w, base = h*.615, th = rnd(26, 58);
        x.strokeStyle = `hsla(25,18%,${rnd(22,34)}%,${rnd(.5,.8)})`;
        x.lineWidth = rnd(1.5, 3.5);
        x.beginPath(); x.moveTo(px, base);
        x.lineTo(px + rnd(-4,4), base - th);
        x.stroke();
        for (let b = 0; b < 4; b++) {
          const by = base - th*rnd(.4, .95);
          x.lineWidth = rnd(.8, 1.6);
          x.beginPath(); x.moveTo(px + rnd(-2,2), by);
          x.lineTo(px + rnd(-14, 14), by - rnd(4, 14));
          x.stroke();
        }
      }
    }
    const fld = x.createLinearGradient(0, h*.6, 0, h);
    fld.addColorStop(0, P.fld[0]); fld.addColorStop(.5, P.fld[1]); fld.addColorStop(1, P.fld[2]);
    x.fillStyle = fld; x.fillRect(0, h*.6, w, h*.4);
    for (let i = 0; i < 3600; i++) {
      const py = h*.62 + Math.pow(Math.random(), .8) * h*.38;
      x.strokeStyle = `hsla(${rnd(P.dab[0],P.dab[1])},${rnd(P.dab[2],P.dab[3])}%,${rnd(P.dab[4],P.dab[5])}%,${rnd(.15,.4)})`;
      x.lineWidth = rnd(2, 6);
      const px = Math.random()*w, len = rnd(14, 60);
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-2,2)); x.stroke();
    }
    for (const [fx, fy, sz] of [[w*.14, h*.66, 26], [w*.55, h*.645, 16], [w*.86, h*.66, 22]]) {
      x.fillStyle = P.stackFar;
      x.beginPath(); x.moveTo(fx-sz, fy); x.quadraticCurveTo(fx-sz*.9, fy-sz*.75, fx, fy-sz*1.15);
      x.quadraticCurveTo(fx+sz*.9, fy-sz*.75, fx+sz, fy); x.fill();
      if (season === '겨울') {   // 원경 더미에도 눈 모자
        x.fillStyle = 'rgba(238,242,248,.9)';
        x.beginPath(); x.moveTo(fx-sz*.72, fy-sz*.62);
        x.quadraticCurveTo(fx, fy-sz*1.28, fx+sz*.72, fy-sz*.62);
        x.quadraticCurveTo(fx, fy-sz*.86, fx-sz*.72, fy-sz*.62); x.fill();
      }
    }
  });
  muralCache[season] = t;
  return t;
}

// ══════════ 공간: 사각 전시실 (기획안 — 벽 3면 들판 벽화 + 마루) ══════════
const ROOM = { w: 15, d: 11, h: 5.6 };   // 폭 · 깊이 · 높이

// 바닥
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d),
  new THREE.MeshStandardMaterial({ map: woodTex, roughness: .82 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

// 벽 3면 — 연속 벽화 (좌 → 뒤 → 우로 u좌표 이어짐)
const total = ROOM.d + ROOM.w + ROOM.d;   // 벽 전개 길이
const walls = [];
function muralWall(width, height, x, z, ry, u0, u1){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, height),
    new THREE.MeshStandardMaterial({ roughness: .95 }));
  m.position.set(x, height/2, z);
  m.rotation.y = ry;
  m.receiveShadow = true;
  scene.add(m);
  walls.push({ m, u0, u1 });
  return m;
}
let uAcc = 0;
muralWall(ROOM.d, ROOM.h, -ROOM.w/2, 0, Math.PI/2, uAcc/total, (uAcc+=ROOM.d)/total);          // 좌측 벽
muralWall(ROOM.w, ROOM.h, 0, -ROOM.d/2, 0, uAcc/total, (uAcc+=ROOM.w)/total);                   // 뒷 벽
muralWall(ROOM.d, ROOM.h, ROOM.w/2, 0, -Math.PI/2, uAcc/total, (uAcc+=ROOM.d)/total);           // 우측 벽
function setWallSeason(season){
  const base = makeMural(season);
  for (const w of walls) {
    const tex = base.clone();
    tex.needsUpdate = true;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.repeat.set(w.u1 - w.u0, 1);
    tex.offset.set(w.u0, 0);
    w.m.material.map = tex;
    w.m.material.needsUpdate = true;
  }
}

// 천장 (어두운 전시장 천장)
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d),
  new THREE.MeshStandardMaterial({ color: 0x121110, roughness: 1 }));
ceil.rotation.x = Math.PI/2; ceil.position.y = ROOM.h;

// 짚 깔개 (더미 주변)
const pad = new THREE.Mesh(new THREE.CircleGeometry(2.9, 48),

// ══════════ 건초더미 (두꺼운 몸통 + 원뿔 지붕, 단일) ══════════
const stackMat = new THREE.MeshStandardMaterial({ map: strawTex, bumpMap: strawBump, bumpScale: .045, roughness: .93 });
const tuftMat = new THREE.MeshStandardMaterial({ color: 0xb08d45, roughness: 1 });
function makeStack(scale, px, pz, seed){
  const g = new THREE.Group();
  const pts = [];
  const BODY = .5;
  for (let i = 0; i <= 34; i++) {
    const t = i/34;
    let r;
    if (t < BODY) {
      r = 1.85 + .05*Math.sin(Math.PI*t/BODY);
    } else {
      const k = (t - BODY) / (1 - BODY);
      r = (1.85*(1 - k) + .03) * (1 + .04*(1-k)*(1-k));
    }
    pts.push(new THREE.Vector2(Math.max(r, .02), t*3.45));
  }
  const geo = new THREE.LatheGeometry(pts, 96);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x0 = pos.getX(i), y0 = pos.getY(i), z0 = pos.getZ(i);
    const a = Math.atan2(z0, x0);
    const n = Math.sin(a*9 + y0*4 + seed)*.04 + Math.sin(a*23 - y0*9)*.028 + Math.sin(a*3 + seed*2)*.045;
    const len = Math.hypot(x0, z0) || 1;
    pos.setX(i, x0 + (x0/len)*n);
    pos.setZ(i, z0 + (z0/len)*n);
  }
  geo.computeVertexNormals();
  const body = new THREE.Mesh(geo, stackMat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  for (let i = 0; i < 60; i++) {
    const t = Math.random();
    const yy = t*3.45;
    let rr;
    if (t < BODY) rr = 1.85 + .05*Math.sin(Math.PI*t/BODY);
    else { const kk = (t-BODY)/(1-BODY); rr = Math.max(.02, (1.85*(1-kk)+.03)*(1+.04*(1-kk)*(1-kk))); }
    const a = Math.random()*Math.PI*2;
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(.008, rnd(.07,.18), 4), tuftMat);
    tuft.position.set(Math.cos(a)*(rr+.02), yy, Math.sin(a)*(rr+.02));
    tuft.rotation.z = Math.PI/2 + rnd(-.7,.7);
    tuft.rotation.y = -a + rnd(-.4,.4);
    g.add(tuft);
  }
  g.scale.setScalar(scale);
  g.position.set(px, 0, pz);
  g.rotation.y = seed;
  return g;
}
scene.add(makeStack(1, 0, 0, 1.7));
// 겨울: 눈 모자 + 발치 눈
const snowMat = new THREE.MeshStandardMaterial({ color: 0xe9eef6, roughness: .95 });
const snowGrp = new THREE.Group();
// 꼭대기 얇은 눈 모자 (원뿔 상단에 밀착)
const capPts = [];
for (let i = 0; i <= 12; i++) {
  const t = i/12;
  const rr = .58 * (1 - t) * (1 + .1*Math.sin(t*7));
  capPts.push(new THREE.Vector2(Math.max(rr, .01), t * .58));
}
const cap = new THREE.Mesh(new THREE.LatheGeometry(capPts, 48), snowMat);
cap.position.y = 2.94;
snowGrp.add(cap);
// 발치에 쌓인 눈 (납작한 불규칙 링)
const base = new THREE.Mesh(new THREE.TorusGeometry(2.02, .16, 10, 56), snowMat);
base.rotation.x = Math.PI/2;
base.position.y = .05;

// ══════════ 천장 레일 + 조명 6조 ══════════
scene.add(new THREE.HemisphereLight(0x50607a, 0x14110d, .05));
const amb = new THREE.AmbientLight(0xffffff, .04); scene.add(amb);

const TGT = new THREE.Object3D(); TGT.position.set(0, 1.5, 0); scene.add(TGT);

const sun = new THREE.SpotLight(0xffffff, 2.4, 0, .42, .55, 1.35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.target = TGT; scene.add(sun);

const fillA = new THREE.SpotLight(0xffffff, .3, 0, .6, .8, 1.6); fillA.target = TGT; scene.add(fillA);
const fillB = new THREE.SpotLight(0xffffff, .3, 0, .6, .8, 1.6); fillB.target = TGT; scene.add(fillB);
const rim = new THREE.SpotLight(0xffffff, .5, 0, .5, .7, 1.5); rim.target = TGT; scene.add(rim);

const washL = new THREE.SpotLight(0xffffff, .5, 0, 1.05, .9, 1.8);
const washR = new THREE.SpotLight(0xffffff, .5, 0, 1.05, .9, 1.8);
const washTgtL = new THREE.Object3D(); washTgtL.position.set(-ROOM.w*.28, 3.2, -ROOM.d/2); scene.add(washTgtL);
const washTgtR = new THREE.Object3D(); washTgtR.position.set(ROOM.w*.28, 3.2, -ROOM.d/2); scene.add(washTgtR);
washL.target = washTgtL; washR.target = washTgtR;
scene.add(washL); scene.add(washR);

// 조명 레일 2줄 (전시장 트랙)
const railMat = new THREE.MeshStandardMaterial({ color: 0x191714, roughness: .45, metalness: .7 });
for (const rz of [2.6, -2.6]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(ROOM.w - 2.5, .07, .14), railMat);
  rail.position.set(0, ROOM.h - .18, rz);
  scene.add(rail);
}
function makeFixture(){
  const g = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.02, .02, .22, 8), railMat);
  stem.position.y = .22;
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(.09, .14, .3, 14),
    new THREE.MeshStandardMaterial({ color: 0x14120f, roughness: .4, metalness: .7 }));
  const glow = new THREE.Mesh(new THREE.CircleGeometry(.1, 14),
    new THREE.MeshBasicMaterial({ color: 0xfff2cc }));
  glow.position.y = -.16; glow.rotation.x = Math.PI/2;
  g.add(stem); g.add(housing); g.add(glow);
  scene.add(g);
  return { g, glow };
}
const fxSun = makeFixture(), fxFillA = makeFixture(), fxFillB = makeFixture(),
      fxRim = makeFixture(), fxWashL = makeFixture(), fxWashR = makeFixture();

// 레일 위 좌표로 클램프 (x는 레일 범위, z는 두 레일 중 가까운 쪽)
function onRail(x, z){
  const rx = THREE.MathUtils.clamp(x, -(ROOM.w-2.5)/2, (ROOM.w-2.5)/2);
  const rz = Math.abs(z - 2.6) < Math.abs(z + 2.6) ? 2.6 : -2.6;
  return new THREE.Vector3(rx, ROOM.h - .42, rz);
}
function placeFixture(fx, light, tgt){
  fx.g.position.copy(light.position).add(new THREE.Vector3(0, .18, 0));
  fx.g.lookAt(tgt);
  fx.g.rotateX(-Math.PI/2);
  fx.glow.material.color.copy(light.color);
}

const coneMat = new THREE.MeshBasicMaterial({
  color: 0xfff0c8, transparent: true, opacity: .03,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
});
const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 40, 1, true), coneMat);
scene.add(cone);

const DUST = 150;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST*3);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3] = rnd(-2.4, 2.4); dustPos[i*3+1] = rnd(.1, 4.8); dustPos[i*3+2] = rnd(-2.4, 2.4);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xfff4d8, size: .02, transparent: true, opacity: .45,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

// ══════════ 프리셋 ══════════
const PRESETS = [
  { nm:'새벽',    az:60,  el:11, temp:20, int:36, fill:25, rimv:55, wash:65,
    washT:'#5a6b9e', washB:'#2e3a5e', fillC:'#4a5878', rimC:'#8fa3d0' },
  { nm:'아침',    az:120, el:36, temp:60, int:82, fill:45, rimv:40, wash:85,
    washT:'#ffe9c4', washB:'#bcd2e0', fillC:'#d8e4f0', rimC:'#fff4dc' },
  { nm:'정오',    az:180, el:74, temp:48, int:100, fill:55, rimv:30, wash:100,
    washT:'#f4f8ff', washB:'#dfe8ea', fillC:'#eef4f8', rimC:'#ffffff' },
  { nm:'저녁노을', az:140, el:15, temp:96, int:74, fill:35, rimv:75, wash:80,
    washT:'#ff9e5a', washB:'#7a4a6a', fillC:'#8a5a7a', rimC:'#ffb87a' },
  { nm:'달밤',    az:300, el:48, temp:8,  int:20, fill:18, rimv:60, wash:45,
    washT:'#33436a', washB:'#101a30', fillC:'#26314e', rimC:'#7f95c8' },
];
let cur = { ...PRESETS[3] };
const st = { az: cur.az, el: cur.el, temp: cur.temp, int: cur.int, fill: cur.fill, rimv: cur.rimv, wash: cur.wash };
const cold = new THREE.Color(0x9db4e8), warm = new THREE.Color(0xff9e4a);

function apply(){
  const azr = st.az*Math.PI/180, elr = st.el*Math.PI/180;
  // 태양: 천장 레일 마운트 — 높이(el)가 낮을수록 벽 쪽에서 그레이징
  const dHoriz = .8 + 5.4 * Math.cos(elr);
  const sx = Math.cos(azr) * dHoriz, sz = Math.sin(azr) * dHoriz;
  const railPos = onRail(sx, sz);
  sun.position.copy(railPos);
  const c = cold.clone().lerp(warm, st.temp/100);
  sun.color.copy(c);
  sun.intensity = .3 + st.int/100 * 3.4;
  amb.color.copy(c); amb.intensity = .015 + st.int/100 * .04;
  // 필 2조
  for (const [fill, off] of [[fillA, 115], [fillB, -115]]) {
    const a2 = (st.az + off) * Math.PI/180;
    fill.position.copy(onRail(Math.cos(a2)*5.4, Math.sin(a2)*5.4));
    fill.color.set(cur.fillC);
    fill.intensity = st.fill/100 * .9;
  }
  // 림
  const a3 = (st.az + 180) * Math.PI/180;
  rim.position.copy(onRail(Math.cos(a3)*5.4, Math.sin(a3)*5.4));
  rim.color.set(cur.rimC);
  rim.intensity = st.rimv/100 * 1.3;
  // 배경 워시 (뒷벽을 물들임)
  washL.position.copy(onRail(-ROOM.w*.22, 2.6));
  washR.position.copy(onRail(ROOM.w*.22, 2.6));
  washL.color.set(cur.washT); washR.color.set(cur.washB);
  washL.intensity = st.wash/100 * 1.05;
  washR.intensity = st.wash/100 * .9;
  // 콘·먼지·기구
  coneMat.color.copy(c);
  coneMat.opacity = .006 + st.int/100 * .022;
  dust.material.color.copy(c);
  const from = sun.position.clone(), to = TGT.position.clone();
  const dir = to.clone().sub(from), len = dir.length();
  cone.scale.set(len*.22, len, len*.22);
  cone.position.copy(from.clone().add(dir.clone().multiplyScalar(.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
  placeFixture(fxSun, sun, TGT.position);
  placeFixture(fxFillA, fillA, TGT.position);
  placeFixture(fxFillB, fillB, TGT.position);
  placeFixture(fxRim, rim, TGT.position);
  placeFixture(fxWashL, washL, washTgtL.position);
  placeFixture(fxWashR, washR, washTgtR.position);
}
const S = id => document.getElementById(id);
['sAz','sEl','sTemp','sInt','sFill','sRim','sWash'].forEach(id => S(id).addEventListener('input', () => {
  st.az = +S('sAz').value; st.el = +S('sEl').value; st.temp = +S('sTemp').value; st.int = +S('sInt').value;
  st.fill = +S('sFill').value; st.rimv = +S('sRim').value; st.wash = +S('sWash').value;
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  apply();
}));

let anim = null;
function goPreset(p, btn){
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const from = { ...st };
  const fromCur = { ...cur };
  cur = { ...p };
  const t0 = performance.now();
  cancelAnimationFrame(anim);
  const lerpC = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();
  const step = (t) => {
    const k = Math.min(1, (t-t0)/950);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    for (const key of ['az','el','temp','int','fill','rimv','wash']) st[key] = from[key] + (p[key]-from[key])*e;
    cur.washT = lerpC(fromCur.washT, p.washT, e);
    cur.washB = lerpC(fromCur.washB, p.washB, e);
    cur.fillC = lerpC(fromCur.fillC, p.fillC, e);
    cur.rimC  = lerpC(fromCur.rimC,  p.rimC,  e);
    S('sAz').value = st.az; S('sEl').value = st.el; S('sTemp').value = st.temp; S('sInt').value = st.int;
    S('sFill').value = st.fill; S('sRim').value = st.rimv; S('sWash').value = st.wash;
    apply();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
// ── 계절 ──
let season = '가을';
function setSeason(name, btn){
  season = name;
  setWallSeason(name);
  pad.material.map = (name === '겨울') ? snowPadTex : strawPadTex;
  pad.material.needsUpdate = true;
  stackMat.map = (name === '겨울') ? frostTex : strawTex;
  stackMat.needsUpdate = true;
  tuftMat.color.set(name === '겨울' ? 0xcdd6df : 0xb08d45);
  snowGrp.visible = (name === '겨울');
  document.querySelectorAll('#seasons button').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
}
const se = document.getElementById('seasons');
['여름','가을','겨울'].forEach(nm => {
  const b = document.createElement('button');
  b.textContent = nm === '겨울' ? '겨울 (눈)' : nm;
  if (nm === '가을') b.classList.add('on');
  b.onclick = () => setSeason(nm, b);
  se.appendChild(b);
});

const pr = document.getElementById('presets');
PRESETS.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.nm;
  if (p.nm === '저녁노을') b.classList.add('on');
  b.onclick = () => goPreset(p, b);
  pr.appendChild(b);
});
setSeason('가을', se.children[1]);
apply();

// ══════════ 사진 ══════════
document.getElementById('shoot').onclick = () => {
  renderer.render(scene, camera);
  const src = renderer.domElement.toDataURL('image/jpeg', .9);
  const t = new Date();
  const on = document.querySelector('#presets button.on');
  document.getElementById('shotImg').src = src;
  document.getElementById('shotMeta').textContent =
    `${season} · ${on ? on.textContent : '나만의 빛'} · 태양 ${Math.round(st.az)}° / ${Math.round(st.el)}° — ` +
    `${t.getFullYear()}. ${t.getMonth()+1}. ${t.getDate()}. ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} · MONET 100`;
  document.getElementById('shotSave').href = src;
  document.getElementById('shotView').classList.add('on');
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const dp = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) {
    dp.array[i*3+1] += Math.sin(t*.6 + i)*.0007 + .001;
    if (dp.array[i*3+1] > 5.2) dp.array[i*3+1] = .1;
  }
  dp.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
});
