<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>건초더미 — 조명 시뮬레이터</title>
<style>
  :root{--bg:#faf9f6;--ink:#1c1a16;--sub:#6f6a5e;--line:#e2ded6;--cap:#8a8578;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#070605;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #view{position:fixed;inset:0;}
  a.home{position:fixed;top:14px;left:14px;z-index:6;font-size:12.5px;color:#fff;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .cap{position:fixed;top:14px;right:14px;z-index:6;font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.5);font-weight:700;}

  #ui{position:fixed;left:10px;right:10px;bottom:12px;z-index:6;background:rgba(250,249,246,.94);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:500px;margin:0 auto;}
  .row{display:flex;gap:6px;}
  .row button{flex:1;background:#fff;border:1px solid #d8d3c8;border-radius:6px;padding:10px 2px;font-size:11.5px;color:var(--sub);font-family:inherit;font-weight:700;cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,22,.07),0 2px 0 #d8d3c8;}
  .row button:active{transform:translateY(2px);box-shadow:none;}
  .row button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .sliders{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px;}
  .sliders label{font-size:10.5px;color:var(--cap);font-weight:700;white-space:nowrap;letter-spacing:.06em;}
  .sliders input{width:100%;accent-color:var(--ink);}
  .acts{display:flex;gap:8px;margin-top:10px;}
  .acts button{flex:1;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .acts button:active{transform:translateY(2px);box-shadow:none;}
  .hint{font-size:10px;color:#a89f8d;text-align:center;margin-top:8px;}

  #shotView{position:fixed;inset:0;z-index:20;background:rgba(7,6,5,.92);display:none;align-items:center;justify-content:center;padding:22px;}
  #shotView.on{display:flex;}
  .card{background:#fff;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  .card img{width:100%;display:block;}
  .card .lb{padding:14px 16px;}
  .card .t{font-size:15px;font-weight:800;color:#1c1a16;}
  .card .m{font-size:11px;color:#6f6a5e;margin-top:3px;line-height:1.6;}
  .card .row2{display:flex;gap:8px;padding:0 16px 16px;}
  .card a,.card button{flex:1;text-align:center;text-decoration:none;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:11px;cursor:pointer;
    background:#1c1a16;color:#faf9f6;border:0;}
  .card button.ghost{background:#fff;border:1px solid #d8d3c8;color:#6f6a5e;}
</style>
</head>
<body>
<div id="view"></div>
<a class="home" href="index.html">← 홈</a>
<div class="cap">ZONE C · 건초더미 — 조명 시뮬레이션</div>

<div id="ui">
  <div class="row" id="presets"></div>
  <div class="sliders">
    <label>조명 방향</label><input type="range" id="sAz" min="0" max="360" value="255">
    <label>조명 높이</label><input type="range" id="sEl" min="5" max="80" value="14">
    <label>색온도</label><input type="range" id="sTemp" min="0" max="100" value="96">
    <label>밝기</label><input type="range" id="sInt" min="10" max="100" value="66">
  </div>
  <div class="acts"><button id="shoot">📷 이 빛을 사진으로 남기기</button></div>
  <p class="hint">드래그로 둘러보기 · 실제 전시장에선 이 콘솔이 현장 조명(DMX)을 움직입니다</p>
</div>

<div id="shotView">
  <div class="card">
    <img id="shotImg" alt="">
    <div class="lb"><div class="t">〈건초더미, 나의 빛〉</div><div class="m" id="shotMeta"></div></div>
    <div class="row2"><a id="shotSave" download="my_haystack.jpg">저장</a><button class="ghost" onclick="document.getElementById('shotView').classList.remove('on')">닫기</button></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
camera.position.set(.6, 2.1, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 3.2; controls.maxDistance = 11;
controls.enablePan = false;
controls.enableDamping = true;

// ══════════ 프로시저럴 텍스처 ══════════
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);

// 짚: 세로 결 + 색 편차 + 삐져나온 가닥
const strawTex = canvasTex(1024, 1024, (x,w,h) => {
  x.fillStyle = '#8d6a2f'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 4200; i++) {
    const px = Math.random()*w, py = Math.random()*h;
    const len = rnd(26, 90), ang = Math.PI/2 + rnd(-.28,.28);
    const hue = rnd(33, 45), sat = rnd(38, 62), lit = rnd(26, 58);
    x.strokeStyle = `hsla(${hue},${sat}%,${lit}%,${rnd(.25,.6)})`;
    x.lineWidth = rnd(.7, 2.2);
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang+.3)*len*.5, py + Math.sin(ang+.3)*len*.5,
                       px + Math.cos(ang)*len, py + Math.sin(ang)*len);
    x.stroke();
  }
}, [3, 2]);
const strawBump = canvasTex(512, 512, (x,w,h) => {
  x.fillStyle = '#808080'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 2600; i++) {
    const px = Math.random()*w, py = Math.random()*h, len = rnd(14, 50);
    const v = Math.round(rnd(70, 190));
    x.strokeStyle = `rgba(${v},${v},${v},.5)`;
    x.lineWidth = rnd(.6, 1.8);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-6,6), py + len); x.stroke();
  }
}, [3, 2]);

// 나무 바닥 (전시장 마루)
const woodTex = canvasTex(1024, 1024, (x,w,h) => {
  const plank = 128;
  for (let r = 0; r < h/plank; r++) {
    for (let cix = 0; cix < 2; cix++) {
      const y0 = r*plank;
      const base = rnd(26, 34);
      const g = x.createLinearGradient(0, y0, 0, y0+plank);
      g.addColorStop(0, `hsl(28,26%,${base}%)`);
      g.addColorStop(.5, `hsl(30,24%,${base+3}%)`);
      g.addColorStop(1, `hsl(27,26%,${base-2}%)`);
      x.fillStyle = g;
      x.fillRect(cix*w/2 + (r%2)*w/4 - w/4, y0, w/2 + w/4, plank - 2);
    }
    // 나뭇결
    for (let i = 0; i < 26; i++) {
      x.strokeStyle = `hsla(26,30%,${rnd(14,24)}%,${rnd(.06,.2)})`;
      x.lineWidth = rnd(.5, 1.6);
      const yy = r*plank + rnd(4, plank-4);
      x.beginPath(); x.moveTo(0, yy);
      for (let px = 0; px <= w; px += 64) x.lineTo(px, yy + rnd(-3,3));
      x.stroke();
    }
  }
}, [5, 5]);

// 잔디 무대
const grassTex = canvasTex(512, 512, (x,w,h) => {
  x.fillStyle = '#3e4a26'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 5200; i++) {
    x.strokeStyle = `hsla(${rnd(70,105)},${rnd(30,55)}%,${rnd(18,42)}%,${rnd(.3,.8)})`;
    x.lineWidth = rnd(.5, 1.4);
    const px = Math.random()*w, py = Math.random()*h, len = rnd(4, 13);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-3,3), py - len); x.stroke();
  }
}, [4, 4]);

// ══════════ 공간 ══════════
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({ map: woodTex, roughness: .8, metalness: .05 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0x232620, roughness: 1 });
const mkWall = (w,h,x,z,ry) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat);
  m.position.set(x, h/2, z); m.rotation.y = ry; m.receiveShadow = true;
  scene.add(m);
};
mkWall(24, 6.5, 0, -9, 0);
mkWall(20, 6.5, -12, 0, Math.PI/2);
mkWall(20, 6.5, 12, 0, -Math.PI/2);

// 뒷벽: 모네 들판 벽화 (기획안 — 배경은 들판을 모네의 색감으로)
const muralTex = new THREE.TextureLoader().load('quest_img/hay_morning.jpg');
muralTex.encoding = THREE.sRGBEncoding;
const mural = new THREE.Mesh(new THREE.PlaneGeometry(13.2, 8.6),
  new THREE.MeshStandardMaterial({ map: muralTex, roughness: .92 }));
mural.scale.y = 13.2 * (595/900) / 8.6;   // 원본 비율 유지
mural.position.set(0, 13.2*(595/900)/2 + .02, -8.96);
scene.add(mural);

const grass = new THREE.Mesh(new THREE.CircleGeometry(3.4, 56),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
grass.rotation.x = -Math.PI/2; grass.position.y = .012; grass.receiveShadow = true;
scene.add(grass);

// ══════════ 건초더미 ══════════
function makeStack(scale, px, pz, seed){
  const g = new THREE.Group();
  const R = (k) => { const s = Math.sin(seed*91.7 + k*47.3)*.5+.5; return s; };
  // 본체: 종 모양 프로파일
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const t = i/30;
    let r;
    if (t < .55) r = 1.5 + .12*Math.sin(t*7 + seed);           // 원통형 몸통
    else if (t < .8) r = 1.5 - (t-.55)*2.2;                     // 어깨
    else r = Math.max(.05, .95 - (t-.8)*4.4);                   // 뾰족 지붕
    pts.push(new THREE.Vector2(r, t*2.3));
  }
  const geo = new THREE.LatheGeometry(pts, 96);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x0 = pos.getX(i), y0 = pos.getY(i), z0 = pos.getZ(i);
    const a = Math.atan2(z0, x0);
    const n = Math.sin(a*9 + y0*4 + seed)*.045 + Math.sin(a*23 - y0*9)*.03 + Math.sin(a*3 + seed*2)*.05;
    const len = Math.hypot(x0, z0) || 1;
    pos.setX(i, x0 + (x0/len)*n);
    pos.setZ(i, z0 + (z0/len)*n);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    map: strawTex, bumpMap: strawBump, bumpScale: .045, roughness: .93,
  });
  const body = new THREE.Mesh(geo, mat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  // 삐져나온 짚 가닥 (실루엣 거칠게)
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0x9c7a35, roughness: 1 });
  for (let i = 0; i < 90; i++) {
    const t = Math.random();
    const yy = t*2.3;
    let rr;
    if (t < .55) rr = 1.5; else if (t < .8) rr = 1.5-(t-.55)*2.2; else rr = Math.max(.05,.95-(t-.8)*4.4);
    const a = Math.random()*Math.PI*2;
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(.012, rnd(.1,.3), 4), tuftMat);
    tuft.position.set(Math.cos(a)*(rr+.02), yy, Math.sin(a)*(rr+.02));
    tuft.rotation.z = Math.PI/2 + rnd(-.7,.7);
    tuft.rotation.y = -a + rnd(-.4,.4);
    g.add(tuft);
  }
  g.scale.setScalar(scale);
  g.position.set(px, 0, pz);
  g.rotation.y = seed;
  return g;
}
scene.add(makeStack(1, .2, 0, 1.7));
scene.add(makeStack(.58, -2.5, -1.4, 4.1));

// ══════════ 조명 리그 ══════════
scene.add(new THREE.HemisphereLight(0x50607a, 0x14110d, .06));
const amb = new THREE.AmbientLight(0xffffff, .04); scene.add(amb);
const key = new THREE.SpotLight(0xffffff, 2.4, 0, .40, .55, 1.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key); scene.add(key.target);
key.target.position.set(0, .95, 0);
const muralWash = new THREE.SpotLight(0xfff4e0, .5, 0, .9, .8, 1.6);   // 벽화 워시
muralWash.position.set(0, 6.4, -2);
muralWash.target = mural;
scene.add(muralWash);
const fill = new THREE.DirectionalLight(0xffffff, .04);
fill.position.set(4, 5, 6); scene.add(fill);

// 조명 기구 + 광선 콘 + 먼지
const rig = new THREE.Group();
const housing = new THREE.Mesh(new THREE.CylinderGeometry(.1, .16, .34, 16),
  new THREE.MeshStandardMaterial({ color: 0x14120f, roughness: .4, metalness: .7 }));
const glow = new THREE.Mesh(new THREE.CircleGeometry(.11, 16),
  new THREE.MeshBasicMaterial({ color: 0xfff2cc }));
glow.position.y = -.175; glow.rotation.x = Math.PI/2;
rig.add(housing); rig.add(glow);
scene.add(rig);

const coneMat = new THREE.MeshBasicMaterial({
  color: 0xfff0c8, transparent: true, opacity: .05,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
});
const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 40, 1, true), coneMat);
scene.add(cone);

const dustGeo = new THREE.BufferGeometry();
const DUST = 160;
const dustPos = new Float32Array(DUST*3);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3] = rnd(-2.4, 2.4); dustPos[i*3+1] = rnd(.1, 4.6); dustPos[i*3+2] = rnd(-2.4, 2.4);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xfff4d8, size: .022, transparent: true, opacity: .5,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

// ══════════ 상태 → 반영 ══════════
const st = { az: 255, el: 14, temp: 96, int: 66 };
const cold = new THREE.Color(0x9db4e8), warm = new THREE.Color(0xff9e4a);
function apply(){
  const azr = st.az*Math.PI/180, elr = st.el*Math.PI/180, R = 7.5;
  const px = Math.cos(azr)*Math.cos(elr)*R, py = Math.sin(elr)*R + .7, pz = Math.sin(azr)*Math.cos(elr)*R;
  key.position.set(px, py, pz);
  const c = cold.clone().lerp(warm, st.temp/100);
  key.color.copy(c);
  key.intensity = .3 + st.int/100 * 3.6;
  amb.color.copy(c); amb.intensity = .015 + st.int/100 * .045;
  muralWash.color.copy(c); muralWash.intensity = .12 + st.int/100 * .55;
  coneMat.color.copy(c);
  coneMat.opacity = .02 + st.int/100 * .075;
  dust.material.color.copy(c);
  // 기구·콘 배치
  rig.position.set(px, py + .22, pz);
  rig.lookAt(key.target.position);
  rig.rotateX(-Math.PI/2);
  const from = new THREE.Vector3(px, py, pz);
  const to = key.target.position.clone();
  const dir = to.clone().sub(from);
  const len = dir.length();
  cone.scale.set(len*.42, len, len*.42);
  cone.position.copy(from.clone().add(dir.clone().multiplyScalar(.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
  glow.material.color.copy(c);
}
const S = id => document.getElementById(id);
['sAz','sEl','sTemp','sInt'].forEach(id => S(id).addEventListener('input', () => {
  st.az = +S('sAz').value; st.el = +S('sEl').value; st.temp = +S('sTemp').value; st.int = +S('sInt').value;
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  apply();
}));

const PRESETS = [
  { nm:'새벽',    az:100, el:12, temp:20, int:34 },
  { nm:'아침',    az:125, el:36, temp:60, int:82 },
  { nm:'정오',    az:180, el:74, temp:48, int:100 },
  { nm:'저녁노을', az:255, el:14, temp:96, int:66 },
  { nm:'달밤',    az:300, el:48, temp:8,  int:20 },
];
let anim = null;
function goPreset(p, btn){
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const from = { ...st }, t0 = performance.now();
  cancelAnimationFrame(anim);
  const step = (t) => {
    const k = Math.min(1, (t-t0)/900);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    for (const key2 of ['az','el','temp','int']) st[key2] = from[key2] + (p[key2]-from[key2])*e;
    S('sAz').value = st.az; S('sEl').value = st.el; S('sTemp').value = st.temp; S('sInt').value = st.int;
    apply();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
const pr = document.getElementById('presets');
PRESETS.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.nm;
  if (p.nm === '저녁노을') b.classList.add('on');
  b.onclick = () => goPreset(p, b);
  pr.appendChild(b);
});
apply();

// ══════════ 사진 ══════════
document.getElementById('shoot').onclick = () => {
  renderer.render(scene, camera);
  const src = renderer.domElement.toDataURL('image/jpeg', .9);
  const t = new Date();
  const on = document.querySelector('#presets button.on');
  document.getElementById('shotImg').src = src;
  document.getElementById('shotMeta').textContent =
    `${on ? on.textContent : '나만의 빛'} · 방향 ${Math.round(st.az)}° · 높이 ${Math.round(st.el)}° — ` +
    `${t.getFullYear()}. ${t.getMonth()+1}. ${t.getDate()}. ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} · MONET 100`;
  document.getElementById('shotSave').href = src;
  document.getElementById('shotView').classList.add('on');
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  // 먼지 부유
  const dp = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) {
    dp.array[i*3+1] += Math.sin(t*.6 + i)*.0007 + .0011;
    if (dp.array[i*3+1] > 4.8) dp.array[i*3+1] = .1;
  }
  dp.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
