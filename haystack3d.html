<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>건초더미 — 조명 시뮬레이터</title>
<style>
  :root{--bg:#faf9f6;--ink:#1c1a16;--sub:#6f6a5e;--line:#e2ded6;--cap:#8a8578;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#070605;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #view{position:fixed;inset:0;}
  a.home{position:fixed;top:14px;left:14px;z-index:6;font-size:12.5px;color:#fff;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .cap{position:fixed;top:14px;right:14px;z-index:6;font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.5);font-weight:700;}

  #ui{position:fixed;left:10px;right:10px;bottom:12px;z-index:6;background:rgba(250,249,246,.94);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:500px;margin:0 auto;}
  .row{display:flex;gap:6px;}
  .row button{flex:1;background:#fff;border:1px solid #d8d3c8;border-radius:6px;padding:10px 2px;font-size:11.5px;color:var(--sub);font-family:inherit;font-weight:700;cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,22,.07),0 2px 0 #d8d3c8;}
  .row button:active{transform:translateY(2px);box-shadow:none;}
  .row button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .sliders{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:10px;}
  .sliders label{font-size:10.5px;color:var(--cap);font-weight:700;white-space:nowrap;letter-spacing:.06em;}
  .sliders input{width:100%;accent-color:var(--ink);}
  .acts{display:flex;gap:8px;margin-top:10px;}
  .acts button{flex:1;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:12px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 0 rgba(28,26,22,.4);}
  .acts button:active{transform:translateY(2px);box-shadow:none;}
  .hint{font-size:10px;color:#a89f8d;text-align:center;margin-top:8px;}

  #shotView{position:fixed;inset:0;z-index:20;background:rgba(7,6,5,.92);display:none;align-items:center;justify-content:center;padding:22px;}
  #shotView.on{display:flex;}
  .card{background:#fff;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7);}
  .card img{width:100%;display:block;}
  .card .lb{padding:14px 16px;}
  .card .t{font-size:15px;font-weight:800;color:#1c1a16;}
  .card .m{font-size:11px;color:#6f6a5e;margin-top:3px;line-height:1.6;}
  .card .row2{display:flex;gap:8px;padding:0 16px 16px;}
  .card a,.card button{flex:1;text-align:center;text-decoration:none;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:6px;padding:11px;cursor:pointer;
    background:#1c1a16;color:#faf9f6;border:0;}
  .card button.ghost{background:#fff;border:1px solid #d8d3c8;color:#6f6a5e;}
</style>
</head>
<body>
<div id="view"></div>
<a class="home" href="index.html">← 홈</a>
<div class="cap">ZONE C · 건초더미 — 조명 시뮬레이션</div>

<div id="ui">
  <div class="row" id="presets"></div>
  <div class="sliders">
    <label>태양의 방향</label><input type="range" id="sAz" min="0" max="360" value="140">
    <label>태양의 높이</label><input type="range" id="sEl" min="5" max="80" value="16">
    <label>색온도</label><input type="range" id="sTemp" min="0" max="100" value="96">
    <label>밝기</label><input type="range" id="sInt" min="10" max="100" value="72">
    <label>보조광 (필)</label><input type="range" id="sFill" min="0" max="100" value="35">
    <label>윤곽광 (림)</label><input type="range" id="sRim" min="0" max="100" value="75">
    <label>배경 워시</label><input type="range" id="sWash" min="0" max="100" value="80">
  </div>
  <div class="acts"><button id="shoot">📷 이 빛을 사진으로 남기기</button></div>
  <p class="hint">드래그로 둘러보기 · 태양(키) · 보조광(필 2조) · 윤곽광(림) · 배경 워시(2조) 전 채널 콘솔 제어</p>
</div>

<div id="shotView">
  <div class="card">
    <img id="shotImg" alt="">
    <div class="lb"><div class="t">〈건초더미, 나의 빛〉</div><div class="m" id="shotMeta"></div></div>
    <div class="row2"><a id="shotSave" download="my_haystack.jpg">저장</a><button class="ghost" onclick="document.getElementById('shotView').classList.remove('on')">닫기</button></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 100);
camera.position.set(.4, 2.2, innerWidth < innerHeight ? 10.8 : 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 3.4; controls.maxDistance = 10.5;
controls.enablePan = false;
controls.enableDamping = true;

// ══════════ 프로시저럴 텍스처 ══════════
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);

// 짚 결
const strawTex = canvasTex(1024, 1024, (x,w,h) => {
  x.fillStyle = '#a3803c'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 4200; i++) {
    const px = Math.random()*w, py = Math.random()*h;
    const len = rnd(26, 90), ang = Math.PI/2 + rnd(-.28,.28);
    x.strokeStyle = `hsla(${rnd(35,48)},${rnd(42,65)}%,${rnd(34,68)}%,${rnd(.25,.6)})`;
    x.lineWidth = rnd(.7, 2.2);
    x.beginPath();
    x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.cos(ang+.3)*len*.5, py + Math.sin(ang+.3)*len*.5,
                       px + Math.cos(ang)*len, py + Math.sin(ang)*len);
    x.stroke();
  }
}, [3, 2]);
const strawBump = canvasTex(512, 512, (x,w,h) => {
  x.fillStyle = '#808080'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 2600; i++) {
    const px = Math.random()*w, py = Math.random()*h, len = rnd(14, 50);
    const v = Math.round(rnd(70, 190));
    x.strokeStyle = `rgba(${v},${v},${v},.5)`;
    x.lineWidth = rnd(.6, 1.8);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-6,6), py + len); x.stroke();
  }
}, [3, 2]);

// 들판 바닥 (마른 풀)
const fieldTex = canvasTex(1024, 1024, (x,w,h) => {
  x.fillStyle = '#6a6b38'; x.fillRect(0,0,w,h);
  for (let i = 0; i < 7000; i++) {
    x.strokeStyle = `hsla(${rnd(48,90)},${rnd(28,52)}%,${rnd(22,52)}%,${rnd(.3,.75)})`;
    x.lineWidth = rnd(.5, 1.5);
    const px = Math.random()*w, py = Math.random()*h, len = rnd(5, 16);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + rnd(-4,4), py - len); x.stroke();
  }
}, [6, 6]);

// 배경막: 모네 색감의 들판 파노라마 (붓질로 그린 벽화)
const backdropTex = canvasTex(2048, 640, (x,w,h) => {
  // 하늘
  const sky = x.createLinearGradient(0, 0, 0, h*.62);
  sky.addColorStop(0, '#cfd8e8'); sky.addColorStop(.55, '#dfd9d2'); sky.addColorStop(1, '#e8dcc8');
  x.fillStyle = sky; x.fillRect(0, 0, w, h*.62);
  // 하늘 붓질
  for (let i = 0; i < 900; i++) {
    const py = Math.pow(Math.random(), 1.4) * h*.6;
    x.strokeStyle = `hsla(${rnd(200,260)},${rnd(12,30)}%,${rnd(72,90)}%,${rnd(.08,.22)})`;
    x.lineWidth = rnd(3, 9);
    const px = Math.random()*w, len = rnd(30, 110);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-4,4)); x.stroke();
  }
  // 먼 언덕
  x.fillStyle = 'hsla(230,18%,58%,.9)';
  x.beginPath(); x.moveTo(0, h*.56);
  for (let px = 0; px <= w; px += 64) x.lineTo(px, h*.56 + Math.sin(px*.004)*14 + rnd(-5,5));
  x.lineTo(w, h*.62); x.lineTo(0, h*.62); x.fill();
  // 나무들 (포플러 실루엣)
  for (let i = 0; i < 26; i++) {
    const px = Math.random()*w, base = h*.60 + rnd(-6, 4), tw = rnd(10, 26), th = rnd(24, 60);
    x.fillStyle = `hsla(${rnd(90,150)},${rnd(18,32)}%,${rnd(30,44)}%,${rnd(.5,.85)})`;
    x.beginPath(); x.ellipse(px, base - th/2, tw/2, th/2, 0, 0, Math.PI*2); x.fill();
  }
  // 들판
  const fld = x.createLinearGradient(0, h*.6, 0, h);
  fld.addColorStop(0, '#b6a95c'); fld.addColorStop(.5, '#96934e'); fld.addColorStop(1, '#6d7038');
  x.fillStyle = fld; x.fillRect(0, h*.6, w, h*.4);
  for (let i = 0; i < 2400; i++) {
    const py = h*.62 + Math.pow(Math.random(), .8) * h*.38;
    x.strokeStyle = `hsla(${rnd(45,95)},${rnd(25,55)}%,${rnd(28,62)}%,${rnd(.15,.4)})`;
    x.lineWidth = rnd(2, 6);
    const px = Math.random()*w, len = rnd(14, 60);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-2,2)); x.stroke();
  }
  // 멀리 건초더미 두엇 (원경)
  for (const [fx, fy, s] of [[w*.18, h*.66, 26], [w*.72, h*.64, 18]]) {
    x.fillStyle = 'hsla(38,42%,38%,.85)';
    x.beginPath(); x.moveTo(fx-s, fy); x.quadraticCurveTo(fx-s*.9, fy-s*.75, fx, fy-s*1.15);
    x.quadraticCurveTo(fx+s*.9, fy-s*.75, fx+s, fy); x.fill();
  }
});

// ══════════ 공간: 들판 디오라마 ══════════
// 바닥 = 들판
const ground = new THREE.Mesh(new THREE.CircleGeometry(11, 64),
  new THREE.MeshStandardMaterial({ map: fieldTex, roughness: 1 }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

// 배경막: 곡면 파노라마 (전시장 벽화)
const backdrop = new THREE.Mesh(
  new THREE.CylinderGeometry(10.8, 10.8, 7.2, 72, 1, true, 0, Math.PI*2),
  new THREE.MeshStandardMaterial({ map: backdropTex, roughness: 1, side: THREE.BackSide }));
backdrop.position.y = 3.6;
backdropTex.wrapS = THREE.RepeatWrapping;
backdropTex.repeat.set(2, 1);   // 파노라마 2회 반복으로 360° 채움
scene.add(backdrop);

// ══════════ 건초더미 — 짧은 몸통 + 긴 원뿔 지붕 ══════════
function makeStack(scale, px, pz, seed){
  const g = new THREE.Group();
  const pts = [];
  const BODY = .32;   // 몸통 비율 (짧게)
  for (let i = 0; i <= 34; i++) {
    const t = i/34;
    let r;
    if (t < BODY) {
      r = 1.5 - .1*(t/BODY);                                      // 몸통: 위로 갈수록 아주 살짝 좁아짐
    } else {
      const k = (t - BODY) / (1 - BODY);                          // 0..1 원뿔 구간
      r = (1.62*(1 - k) + .03) * (1 + .06*(1-k)*(1-k));           // 처마가 몸통을 덮고 직선(살짝 볼록)으로
    }
    pts.push(new THREE.Vector2(Math.max(r, .02), t*2.9));          // 전체 높이 2.9 (원뿔이 길다)
  }
  const geo = new THREE.LatheGeometry(pts, 96);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x0 = pos.getX(i), y0 = pos.getY(i), z0 = pos.getZ(i);
    const a = Math.atan2(z0, x0);
    const n = Math.sin(a*9 + y0*4 + seed)*.04 + Math.sin(a*23 - y0*9)*.028 + Math.sin(a*3 + seed*2)*.045;
    const len = Math.hypot(x0, z0) || 1;
    pos.setX(i, x0 + (x0/len)*n);
    pos.setZ(i, z0 + (z0/len)*n);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ map: strawTex, bumpMap: strawBump, bumpScale: .045, roughness: .93 });
  const body = new THREE.Mesh(geo, mat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  // 삐져나온 짚
  const tuftMat = new THREE.MeshStandardMaterial({ color: 0xb08d45, roughness: 1 });
  for (let i = 0; i < 60; i++) {
    const t = Math.random();
    const yy = t*2.9;
    let rr;
    if (t < BODY) rr = 1.5 - .1*(t/BODY);
    else { const kk = (t-BODY)/(1-BODY); rr = Math.max(.02, (1.62*(1-kk)+.03)*(1+.06*(1-kk)*(1-kk))); }
    const a = Math.random()*Math.PI*2;
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(.008, rnd(.07,.18), 4), tuftMat);
    tuft.position.set(Math.cos(a)*(rr+.02), yy, Math.sin(a)*(rr+.02));
    tuft.rotation.z = Math.PI/2 + rnd(-.7,.7);
    tuft.rotation.y = -a + rnd(-.4,.4);
    g.add(tuft);
  }
  g.scale.setScalar(scale);
  g.position.set(px, 0, pz);
  g.rotation.y = seed;
  return g;
}
scene.add(makeStack(1, 0, 0, 1.7));   // 단 한 기

// ══════════ 조명 리그: 키 1 + 필 2 + 림 1 + 배경 워시 2 ══════════
scene.add(new THREE.HemisphereLight(0x50607a, 0x14110d, .05));
const amb = new THREE.AmbientLight(0xffffff, .04); scene.add(amb);

const TGT = new THREE.Object3D(); TGT.position.set(0, 1.3, 0); scene.add(TGT);

// 태양 키 (콘솔이 직접 제어)
const sun = new THREE.SpotLight(0xffffff, 2.4, 0, .42, .55, 1.35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.target = TGT; scene.add(sun);

// 필 2조 (태양 반대편 좌우 — 어두운 면을 살짝 들어올림)
const fillA = new THREE.SpotLight(0xffffff, .3, 0, .6, .8, 1.6); fillA.target = TGT; scene.add(fillA);
const fillB = new THREE.SpotLight(0xffffff, .3, 0, .6, .8, 1.6); fillB.target = TGT; scene.add(fillB);

// 림 (실루엣 분리)
const rim = new THREE.SpotLight(0xffffff, .5, 0, .5, .7, 1.5); rim.target = TGT; scene.add(rim);

// 배경 워시 2조 (배경막 파노라마 물들이기)
const washL = new THREE.SpotLight(0xffffff, .5, 0, 1.1, .9, 1.8);
const washR = new THREE.SpotLight(0xffffff, .5, 0, 1.1, .9, 1.8);
const washTgtL = new THREE.Object3D(); washTgtL.position.set(-6, 3.5, -8); scene.add(washTgtL);
const washTgtR = new THREE.Object3D(); washTgtR.position.set(6, 3.5, -8); scene.add(washTgtR);
washL.target = washTgtL; washR.target = washTgtR;
scene.add(washL); scene.add(washR);

// 트러스 링 + 조명 기구
const truss = new THREE.Mesh(new THREE.TorusGeometry(6.6, .05, 10, 80),
  new THREE.MeshStandardMaterial({ color: 0x191714, roughness: .45, metalness: .7 }));
truss.rotation.x = Math.PI/2; truss.position.y = 5.7;
scene.add(truss);
function makeFixture(){
  const g = new THREE.Group();
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(.09, .14, .3, 14),
    new THREE.MeshStandardMaterial({ color: 0x14120f, roughness: .4, metalness: .7 }));
  const glow = new THREE.Mesh(new THREE.CircleGeometry(.1, 14),
    new THREE.MeshBasicMaterial({ color: 0xfff2cc }));
  glow.position.y = -.16; glow.rotation.x = Math.PI/2;
  g.add(housing); g.add(glow);
  scene.add(g);
  return { g, glow };
}
const fxSun = makeFixture(), fxFillA = makeFixture(), fxFillB = makeFixture(),
      fxRim = makeFixture(), fxWashL = makeFixture(), fxWashR = makeFixture();

function placeFixture(fx, light, tgt){
  fx.g.position.copy(light.position);
  fx.g.lookAt(tgt);
  fx.g.rotateX(-Math.PI/2);
  fx.glow.material.color.copy(light.color);
  fx.glow.material.opacity = 1;
}

// 광선 콘 (키 전용, 은은하게)
const coneMat = new THREE.MeshBasicMaterial({
  color: 0xfff0c8, transparent: true, opacity: .04,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false,
});
const cone = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 40, 1, true), coneMat);
scene.add(cone);

// 먼지
const DUST = 150;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST*3);
for (let i = 0; i < DUST; i++) {
  dustPos[i*3] = rnd(-2.4, 2.4); dustPos[i*3+1] = rnd(.1, 4.8); dustPos[i*3+2] = rnd(-2.4, 2.4);
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xfff4d8, size: .02, transparent: true, opacity: .45,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

// ══════════ 프리셋: 6조 조명의 오케스트레이션 ══════════
// washT/washB: 배경 워시 색 (하늘/땅), fill: 필 색, rimC: 림 색
const PRESETS = [
  { nm:'새벽',    az:60,  el:11, temp:20, int:36, fill:25, rimv:55, wash:65,
    washT:'#5a6b9e', washB:'#2e3a5e', fillC:'#4a5878', rimC:'#8fa3d0' },
  { nm:'아침',    az:120, el:36, temp:60, int:82, fill:45, rimv:40, wash:85,
    washT:'#ffe9c4', washB:'#bcd2e0', fillC:'#d8e4f0', rimC:'#fff4dc' },
  { nm:'정오',    az:180, el:74, temp:48, int:100, fill:55, rimv:30, wash:100,
    washT:'#f4f8ff', washB:'#dfe8ea', fillC:'#eef4f8', rimC:'#ffffff' },
  { nm:'저녁노을', az:140, el:15, temp:96, int:74, fill:35, rimv:75, wash:80,
    washT:'#ff9e5a', washB:'#7a4a6a', fillC:'#8a5a7a', rimC:'#ffb87a' },
  { nm:'달밤',    az:300, el:48, temp:8,  int:20, fill:18, rimv:60, wash:45,
    washT:'#33436a', washB:'#101a30', fillC:'#26314e', rimC:'#7f95c8' },
];
let cur = { ...PRESETS[3] };  // 저녁노을로 시작
const st = { az: cur.az, el: cur.el, temp: cur.temp, int: cur.int, fill: cur.fill, rimv: cur.rimv, wash: cur.wash };
const cold = new THREE.Color(0x9db4e8), warm = new THREE.Color(0xff9e4a);

function apply(){
  const azr = st.az*Math.PI/180, elr = st.el*Math.PI/180, R = 7.2;
  // ── 태양 키 ──
  sun.position.set(Math.cos(azr)*Math.cos(elr)*R, Math.max(Math.sin(elr)*R, 1.2) + .5, Math.sin(azr)*Math.cos(elr)*R);
  const c = cold.clone().lerp(warm, st.temp/100);
  sun.color.copy(c);
  sun.intensity = .3 + st.int/100 * 3.4;
  amb.color.copy(c); amb.intensity = .015 + st.int/100 * .04;
  // ── 필 2조: 태양 반대편 ±115°, 슬라이더 직결 ──
  const k = st.int/100;
  for (const [fill, off] of [[fillA, 115], [fillB, -115]]) {
    const a2 = (st.az + off) * Math.PI/180;
    fill.position.set(Math.cos(a2)*6.6, 5.5, Math.sin(a2)*6.6);
    fill.color.set(cur.fillC);
    fill.intensity = st.fill/100 * .9;
  }
  // ── 림: 태양 정반대 + 높게, 슬라이더 직결 ──
  const a3 = (st.az + 180) * Math.PI/180;
  rim.position.set(Math.cos(a3)*6.2, 6.2, Math.sin(a3)*6.2);
  rim.color.set(cur.rimC);
  rim.intensity = st.rimv/100 * 1.3;
  // ── 배경 워시: 슬라이더 직결 ──
  washL.position.set(-4.5, 5.9, 5.5); washR.position.set(4.5, 5.9, 5.5);
  washL.color.set(cur.washT); washR.color.set(cur.washB);
  washL.intensity = st.wash/100 * 1.05;
  washR.intensity = st.wash/100 * .9;
  // ── 콘·먼지·기구 ──
  coneMat.color.copy(c);
  coneMat.opacity = .006 + k * .022;
  dust.material.color.copy(c);
  const from = sun.position.clone(), to = TGT.position.clone();
  const dir = to.clone().sub(from), len = dir.length();
  cone.scale.set(len*.22, len, len*.22);
  cone.position.copy(from.clone().add(dir.clone().multiplyScalar(.5)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), dir.clone().normalize());
  placeFixture(fxSun, sun, TGT.position);
  placeFixture(fxFillA, fillA, TGT.position);
  placeFixture(fxFillB, fillB, TGT.position);
  placeFixture(fxRim, rim, TGT.position);
  placeFixture(fxWashL, washL, washTgtL.position);
  placeFixture(fxWashR, washR, washTgtR.position);
}
const S = id => document.getElementById(id);
['sAz','sEl','sTemp','sInt','sFill','sRim','sWash'].forEach(id => S(id).addEventListener('input', () => {
  st.az = +S('sAz').value; st.el = +S('sEl').value; st.temp = +S('sTemp').value; st.int = +S('sInt').value;
  st.fill = +S('sFill').value; st.rimv = +S('sRim').value; st.wash = +S('sWash').value;
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  apply();
}));

let anim = null;
function goPreset(p, btn){
  document.querySelectorAll('#presets button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const from = { ...st };
  const fromCur = { ...cur };
  cur = { ...p };
  const t0 = performance.now();
  cancelAnimationFrame(anim);
  const lerpC = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();
  const step = (t) => {
    const k = Math.min(1, (t-t0)/950);
    const e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    for (const key of ['az','el','temp','int','fill','rimv','wash']) st[key] = from[key] + (p[key]-from[key])*e;
    cur.washT = lerpC(fromCur.washT, p.washT, e);
    cur.washB = lerpC(fromCur.washB, p.washB, e);
    cur.fillC = lerpC(fromCur.fillC, p.fillC, e);
    cur.rimC  = lerpC(fromCur.rimC,  p.rimC,  e);
    S('sAz').value = st.az; S('sEl').value = st.el; S('sTemp').value = st.temp; S('sInt').value = st.int;
    S('sFill').value = st.fill; S('sRim').value = st.rimv; S('sWash').value = st.wash;
    apply();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
const pr = document.getElementById('presets');
PRESETS.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.nm;
  if (p.nm === '저녁노을') b.classList.add('on');
  b.onclick = () => goPreset(p, b);
  pr.appendChild(b);
});
apply();

// ══════════ 사진 ══════════
document.getElementById('shoot').onclick = () => {
  renderer.render(scene, camera);
  const src = renderer.domElement.toDataURL('image/jpeg', .9);
  const t = new Date();
  const on = document.querySelector('#presets button.on');
  document.getElementById('shotImg').src = src;
  document.getElementById('shotMeta').textContent =
    `${on ? on.textContent : '나만의 빛'} · 태양 ${Math.round(st.az)}° / ${Math.round(st.el)}° — ` +
    `${t.getFullYear()}. ${t.getMonth()+1}. ${t.getDate()}. ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')} · MONET 100`;
  document.getElementById('shotSave').href = src;
  document.getElementById('shotView').classList.add('on');
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const dp = dustGeo.attributes.position;
  for (let i = 0; i < DUST; i++) {
    dp.array[i*3+1] += Math.sin(t*.6 + i)*.0007 + .001;
    if (dp.array[i*3+1] > 5) dp.array[i*3+1] = .1;
  }
  dp.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
});
</script>
