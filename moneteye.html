<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모네의 눈</title>
<style>
  :root{--bg:#faf9f6;--ink:#1c1a16;--sub:#6f6a5e;--line:#e2ded6;--cap:#8a8578;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
  body{max-width:520px;margin:0 auto;padding:22px 18px 50px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
  .top a{font-size:12.5px;color:var(--sub);text-decoration:none;}
  .top .cap{font-size:10.5px;letter-spacing:.28em;color:var(--cap);font-weight:600;}
  h1{font-size:22px;font-weight:800;margin:0 0 16px;letter-spacing:-.01em;}

  .stage-wrap{background:#fff;border:1px solid var(--line);padding:14px;box-shadow:0 10px 34px rgba(28,26,22,.08);}
  .stage{position:relative;width:100%;aspect-ratio:3/4;background:#efece4;overflow:hidden;}
  .stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  #result{display:none;}
  #busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(250,249,246,.7);font-size:13.5px;color:var(--ink);font-weight:700;}
  #busy.on{display:flex;}

  .btn{display:flex;align-items:center;justify-content:center;width:100%;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:15px;font-size:14.5px;font-weight:700;margin-top:14px;font-family:inherit;text-decoration:none;
       box-shadow:0 4px 12px rgba(28,26,22,.16),0 2px 0 rgba(28,26,22,.4);cursor:pointer;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(28,26,22,.2);}
  .btn:disabled{opacity:.35;}
  .btn.ghost{background:#fff;border:1px solid #d8d3c8;color:var(--sub);font-weight:600;box-shadow:0 1px 3px rgba(28,26,22,.07),0 2px 0 #d8d3c8;}
  .btn.ghost:active{transform:translateY(2px);box-shadow:none;}
  .row{display:flex;gap:8px;}
  .row .btn{flex:1;}

  .strength{display:none;align-items:center;gap:10px;margin-top:14px;}
  .strength.on{display:flex;}
  .strength .lbl{font-size:12px;color:var(--cap);white-space:nowrap;}
  .strength input{flex:1;accent-color:var(--ink);}

  #status{display:none;font-size:12.5px;color:#b0392f;margin-top:12px;text-align:center;line-height:1.6;}
  #status.show{display:block;}
  .credit{font-size:11px;color:#a89f8d;margin-top:20px;text-align:center;}
  .credit a{color:#a89f8d;}
</style>
</head>
<body>
  <div class="top"><a href="index.html">← 홈</a><span class="cap">MONET 100 · PROTOTYPE</span></div>
  <h1>모네의 눈</h1>

  <div class="stage-wrap">
    <div class="stage">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="result"></canvas>
      <div id="busy">변환 중…</div>
    </div>
  </div>

  <button class="btn" id="startBtn">카메라 켜기</button>
  <div id="prog" style="display:none;margin-top:14px;">
    <div style="height:6px;background:#eee7d8;border-radius:3px;overflow:hidden;">
      <i id="progFill" style="display:block;height:100%;width:0%;background:#1c1a16;transition:width .2s;"></i>
    </div>
    <div id="progText" style="font-size:11.5px;color:#8a8578;margin-top:6px;text-align:center;">모델 내려받는 중 0%</div>
  </div>
  <button class="btn" id="shootBtn" style="display:none">촬영 — 모네 화풍으로 변환</button>
  <div class="strength" id="strengthRow">
    <span class="lbl">화풍 강도</span>
    <input type="range" id="strength" min="0.2" max="1" step="0.05" value="0.85">
  </div>
  <div class="row" id="afterRow" style="display:none">
    <button class="btn ghost" id="againBtn">다시 촬영</button>
    <a class="btn" id="saveBtn" download="monet_eye.jpg">저장</a>
  </div>
  <div id="status"></div>

  <p class="credit">Style transfer: <a href="https://github.com/reiinakano/arbitrary-image-stylization-tfjs" target="_blank">arbitrary-image-stylization-tfjs</a> (Magenta) · 스타일: 모네 〈인상, 해돋이〉</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script>
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const cam = document.getElementById('cam');
const result = document.getElementById('result');
const busy = document.getElementById('busy');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const shootBtn = document.getElementById('shootBtn');
const bad = t => { statusEl.className = 'show'; statusEl.textContent = t; };

// ── 해상도 자동 강등: 변환 중 탭이 죽으면 다음 시도는 한 단계 낮게 ──
const RES = IOS ? [448, 384, 320, 256] : [640, 512, 448, 384];
let resIdx = Math.min(+localStorage.getItem('me_res') || 0, RES.length - 1);
if (sessionStorage.getItem('me_inflight')) {
  sessionStorage.removeItem('me_inflight');
  resIdx = Math.min(resIdx + 1, RES.length - 1);
  localStorage.setItem('me_res', resIdx);
  bad('이전 변환이 기기에서 중단되어 해상도를 ' + RES[resIdx] + 'px로 낮췄습니다. 다시 시도해 주세요.');
}

const prog = document.getElementById('prog');
const progFill = document.getElementById('progFill');
const progText = document.getElementById('progText');
const setProg = f => {
  const pct = Math.min(100, Math.round(f * 100));
  progFill.style.width = pct + '%';
  progText.textContent = '모델 내려받는 중 ' + pct + '% (최초 1회만)';
};

let stream = null, styleNet = null, transformNet = null, styleVec = null;
let contentCanvas = null, identityVec = null;

async function loadOne(key, url, base, weight) {
  try { return await tf.loadGraphModel('indexeddb://' + key); } catch (e) {}
  const model = await tf.loadGraphModel(url, { onProgress: f => setProg(base + f * weight) });
  try { await model.save('indexeddb://' + key); } catch (e) {}
  return model;
}
const loadStyleNet = () => loadOne('monet-style-hq', 'models/style_hq/model.json', 0, 0.82);

async function loadModels() {
  if (transformNet) return;
  await tf.ready();
  if (IOS) { try { tf.env().set('WEBGL_FORCE_F16_TEXTURES', true); } catch (e) {} }
  try { tf.env().set('WEBGL_DELETE_TEXTURE_THRESHOLD', 0); } catch (e) {}
  startBtn.textContent = '모델 준비 중…';
  prog.style.display = 'block';
  styleNet = await loadStyleNet();
  transformNet = await loadOne('monet-transformer-hq', 'models/transformer_hq/model.json', 0.82, 0.18);
  setProg(1);
  const styleImg = new Image();
  styleImg.src = 'quest_img/monet_sunrise.jpg';
  await new Promise(r => { styleImg.onload = r; });
  styleVec = tf.tidy(() =>
    styleNet.predict(tf.browser.fromPixels(styleImg).toFloat().div(tf.scalar(255)).expandDims()));
  prog.style.display = 'none';
}

async function openCam() {
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: {ideal: 1280} }, audio: false });
  cam.srcObject = stream;
  await cam.play();
}
function closeCam() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

startBtn.onclick = async () => {
  startBtn.disabled = true;
  try {
    await loadModels();
    await openCam();
    startBtn.style.display = 'none';
    shootBtn.style.display = 'flex';
  } catch (e) {
    bad('시작 실패 — ' + (e && e.message || e));
    startBtn.disabled = false;
    startBtn.textContent = '카메라 켜기';
  }
};

function grabFrame() {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  const MAX = RES[resIdx];
  const s = Math.min(1, MAX / Math.max(vw, vh));
  const c = document.createElement('canvas');
  c.width = Math.round(vw * s); c.height = Math.round(vh * s);
  c.getContext('2d').drawImage(cam, 0, 0, c.width, c.height);
  return c;
}

async function runTransform() {
  const strength = +document.getElementById('strength').value;
  busy.classList.add('on');
  sessionStorage.setItem('me_inflight', '1');
  await new Promise(r => setTimeout(r, 30));
  try {
    const content = tf.tidy(() =>
      tf.browser.fromPixels(contentCanvas).toFloat().div(tf.scalar(255)).expandDims());
    const blended = tf.tidy(() =>
      styleVec.mul(tf.scalar(strength)).add(identityVec.mul(tf.scalar(1 - strength))));
    const out = tf.tidy(() => transformNet.predict([content, blended]).squeeze());
    content.dispose(); blended.dispose();
    result.width = contentCanvas.width; result.height = contentCanvas.height;
    await tf.browser.toPixels(out, result);
    out.dispose();
    result.style.display = 'block';
    document.getElementById('saveBtn').href = result.toDataURL('image/jpeg', .92);
  } catch (e) {
    bad('변환 실패 — ' + (e && e.message || e));
  }
  sessionStorage.removeItem('me_inflight');
  busy.classList.remove('on');
}

shootBtn.onclick = async () => {
  contentCanvas = grabFrame();
  closeCam();                       // 변환 동안 카메라 메모리 반납
  cam.style.display = 'none';
  shootBtn.style.display = 'none';
  document.getElementById('strengthRow').classList.add('on');
  document.getElementById('afterRow').style.display = 'flex';
  busy.classList.add('on');
  // 이 사진의 identity 벡터(강도 블렌딩용)를 한 번만 계산
  const small = document.createElement('canvas');
  const ss = 256 / Math.max(contentCanvas.width, contentCanvas.height);
  small.width = Math.round(contentCanvas.width * ss);
  small.height = Math.round(contentCanvas.height * ss);
  small.getContext('2d').drawImage(contentCanvas, 0, 0, small.width, small.height);
  if (identityVec) identityVec.dispose();
  identityVec = tf.tidy(() =>
    styleNet.predict(tf.browser.fromPixels(small).toFloat().div(tf.scalar(255)).expandDims()));
  // 36MB Inception을 GPU에서 내림 — 변환기만 남긴다
  styleNet.dispose(); styleNet = null;
  await runTransform();
};

let debounce = null;
document.getElementById('strength').oninput = () => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { if (contentCanvas) runTransform(); }, 350);
};

document.getElementById('againBtn').onclick = async () => {
  result.style.display = 'none';
  cam.style.display = '';
  contentCanvas = null;
  shootBtn.style.display = 'flex';
  document.getElementById('strengthRow').classList.remove('on');
  document.getElementById('afterRow').style.display = 'none';
  if (!styleNet) styleNet = await loadStyleNet();   // IndexedDB에서 즉시 재로드
  await openCam();
};
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
