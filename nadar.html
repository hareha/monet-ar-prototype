<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나다르 사진관 — 초상 촬영</title>
<style>
  :root{--bg:#faf9f6;--ink:#1c1a16;--sub:#6f6a5e;--line:#e2ded6;--cap:#8a8578;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
  body{max-width:520px;margin:0 auto;padding:22px 18px 50px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
  .top a{font-size:12.5px;color:var(--sub);text-decoration:none;}
  .top .cap{font-size:10.5px;letter-spacing:.28em;color:var(--cap);font-weight:600;}
  .eyebrow{font-size:11px;letter-spacing:.3em;color:var(--cap);font-weight:600;}
  h1{font-size:22px;font-weight:800;margin:6px 0 8px;letter-spacing:-.01em;}
  .lede{font-size:13.5px;color:var(--sub);line-height:1.8;margin:0 0 20px;}

  .studio{background:#fff;border:1px solid var(--line);padding:18px;box-shadow:0 10px 34px rgba(28,26,22,.08);text-align:center;}
  .oval{width:78%;aspect-ratio:3/4;margin:6px auto 0;position:relative;overflow:hidden;border-radius:50% / 42%;background:#efece4;border:1px solid var(--line);}
  .oval video,.oval canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .oval.mirror video,.oval.mirror canvas{transform:scaleX(-1);}
  #shot{display:none;}
  #shot.developing{display:block;filter:blur(9px) brightness(2.4) sepia(.4);transition:filter 2.4s ease;}
  #shot.developed{display:block;filter:none;}
  .count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:64px;font-weight:200;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.5);}
  .count.on{display:flex;}
  .plate{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;}
  .plate .a{font-size:11px;letter-spacing:.34em;color:var(--cap);font-weight:600;}
  .plate .b{font-size:12px;color:var(--sub);margin-top:4px;}

  .btn{display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:15px;font-size:14.5px;font-weight:700;margin-top:16px;font-family:inherit;letter-spacing:.02em;
       box-shadow:0 4px 12px rgba(28,26,22,.16),0 2px 0 rgba(28,26,22,.4);cursor:pointer;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(28,26,22,.2);}
  .btn:disabled{opacity:.35;}
  .btn.ghost{background:#fff;border:1px solid #d8d3c8;color:var(--sub);font-weight:600;box-shadow:0 1px 3px rgba(28,26,22,.07),0 2px 0 #d8d3c8;}
  .btn.ghost:active{transform:translateY(2px);box-shadow:none;}
  .row{display:flex;gap:8px;}
  .row .btn{flex:1;}
  #status{display:none;font-size:12.5px;color:#b0392f;margin-top:12px;text-align:center;line-height:1.6;}
  #status.show{display:block;}
  .quote{border-left:2px solid var(--line);padding:2px 0 2px 14px;font-size:12.5px;color:var(--sub);line-height:1.8;margin:20px 0 0;}
</style>
</head>
<body>
  <div class="top"><a href="index.html">← 홈</a><span class="cap">MONET 100 · PROTOTYPE</span></div>

  <h1>나다르 사진관</h1>

  <div class="studio">
    <div class="oval">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="shot"></canvas>
      <div class="count" id="count"></div>
    </div>
    <div class="plate">
      <div class="a">ATELIER NADAR</div>
      <div class="b">35, Boulevard des Capucines · PARIS · 1874</div>
    </div>
  </div>

  <button class="btn" id="startBtn">카메라 켜기</button>
  <div id="actions" style="display:none">
    <button class="btn" id="shootBtn">셔터</button>
    <button class="btn ghost" id="flipBtn">전·후면 전환</button>
  </div>
  <div class="row" id="afterRow" style="display:none">
    <button class="btn ghost" id="againBtn">다시 촬영</button>
    <a class="btn" id="saveBtn" download="nadar_1874.jpg">저장</a>
  </div>
  <div id="status"></div>

<script>
const cam = document.getElementById('cam');
const shot = document.getElementById('shot');
const countEl = document.getElementById('count');
const statusEl = document.getElementById('status');
let stream = null;
let facing = 'environment';   // 기본: 후면

async function openCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: {ideal: 960} }, audio: false });
  cam.srcObject = stream;
  await cam.play();
  document.querySelector('.oval').classList.toggle('mirror', facing === 'user');
}

document.getElementById('startBtn').onclick = async () => {
  try {
    await openCam();
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('actions').style.display = 'block';
  } catch (e) {
    statusEl.className = 'show';
    statusEl.textContent = '카메라를 열지 못했습니다 — 권한을 확인해 주세요. (' + (e && e.message || e) + ')';
  }
};

document.getElementById('flipBtn').onclick = async () => {
  facing = (facing === 'user') ? 'environment' : 'user';
  try { await openCam(); } catch (e) {
    statusEl.className = 'show';
    statusEl.textContent = '카메라 전환 실패 — ' + (e && e.message || e);
  }
};

document.getElementById('shootBtn').onclick = async () => {
  const btn = document.getElementById('shootBtn');
  btn.disabled = true;
  for (const n of ['3','2','1']) {
    countEl.textContent = n; countEl.classList.add('on');
    await new Promise(r => setTimeout(r, 700));
  }
  countEl.classList.remove('on');

  const w = cam.videoWidth || 720, h = cam.videoHeight || 960;
  shot.width = w; shot.height = h;
  const x = shot.getContext('2d');
  x.drawImage(cam, 0, 0, w, h);
  shot.style.transform = '';   // 처리 결과는 항상 정방향 (전면일 땐 CSS 미러가 적용됨)

  // ── 1874년 인화 처리: 콘트라스트 → 세피아 톤 → 입자 → 비네트 ──
  const d = x.getImageData(0, 0, w, h);
  const p = d.data;
  const cx = w/2, cy = h/2, maxR = Math.hypot(cx, cy);
  for (let i = 0, px = 0; i < p.length; i += 4, px++) {
    let g = .299*p[i] + .587*p[i+1] + .114*p[i+2];
    g = (g - 128) * 1.18 + 132;                       // 콘트라스트
    g += (Math.random() - .5) * 26;                    // 은염 입자
    const X = px % w, Y = (px / w) | 0;
    const v = 1 - Math.pow(Math.hypot(X-cx, Y-cy) / maxR, 2.6) * .55;  // 비네트
    g *= v;
    p[i]   = Math.min(255, g*1.10 + 24);               // 세피아
    p[i+1] = Math.min(255, g*0.94 + 6);
    p[i+2] = Math.max(0,   g*0.72 - 4);
  }
  x.putImageData(d, 0, 0);

  // 현상 연출
  shot.className = 'developing';
  requestAnimationFrame(() => requestAnimationFrame(() => shot.className = 'developing developed'));
  cam.style.display = 'none';

  document.getElementById('saveBtn').href = shot.toDataURL('image/jpeg', .92);
  btn.disabled = false;
  document.getElementById('actions').style.display = 'none';
  document.getElementById('afterRow').style.display = 'flex';
};

document.getElementById('againBtn').onclick = () => {
  shot.className = ''; shot.style.display = '';
  cam.style.display = '';
  document.getElementById('actions').style.display = 'block';
  document.getElementById('afterRow').style.display = 'none';
};
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
