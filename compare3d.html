<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
body{margin:0;background:#2e3034;font-family:sans-serif}
#cap{position:fixed;top:0;left:0;right:0;display:flex;z-index:9;color:#eee;font-weight:700;font-size:20px;text-align:center}
#cap div{flex:1;padding:12px;background:rgba(0,0,0,.35)}
</style></head><body>
<div id="cap"><div>TripoSR (로컬 무료)</div><div>Meshy 7 (유료 서비스)</div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.147.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.147.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
document.body.appendChild(renderer.domElement);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2e3034);
const cam = new THREE.PerspectiveCamera(38, 16/9, .1, 100);
cam.position.set(0, 1.05, 3.6); cam.lookAt(0, .9, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777264, 1.1));
const key = new THREE.DirectionalLight(0xfff4e0, .9); key.position.set(3, 6, 4); scene.add(key);
const L = new GLTFLoader();
const place = (g, x, zUp) => {
  const obj = g.scene;
  if (zUp) obj.rotation.x = -Math.PI/2;
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const s = 1.75 / size.y;
  obj.scale.setScalar(s);
  const b2 = new THREE.Box3().setFromObject(obj);
  obj.position.x = x - (b2.min.x + b2.max.x)/2;
  obj.position.y = -b2.min.y;
  scene.add(obj);
  window.__objs = (window.__objs || []).concat(obj);
};
L.load('assets/ai/cmp_triposr.glb', g => place(g, -.75, true));
L.load('assets/ai/mporter.glb', g => place(g, .75, false));
const fit = () => { const w = innerWidth||1600, h = innerHeight||900; renderer.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); };
fit(); addEventListener('resize', fit); setTimeout(fit, 400);
renderer.setAnimationLoop(() => renderer.render(scene, cam));
window.__spin = ry => { fit(); (window.__objs||[]).forEach(o => o.rotation.y = ry); renderer.render(scene, cam); return (window.__objs||[]).length; };
</script></body></html>
