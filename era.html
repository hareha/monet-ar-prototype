<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>변화의 복도 — 시대상 AR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #14120e; }
  body { font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  #cam, #backdrop {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #backdrop { display: none; }
  #view { position: fixed; inset: 0; z-index: 1; }
  #grain {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    opacity: .07; mix-blend-mode: overlay;
  }
  #tone {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(24,16,8,.4) 100%);
  }
  #view canvas { display: block; }

  .hud { position: fixed; z-index: 5; color: #f2efe8; }
  #back {
    position:fixed;top:max(12px, env(safe-area-inset-top));left:14px;z-index:9;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#f2efe8;text-decoration:none;background:rgba(20,18,14,.55);border:1px solid rgba(242,239,232,.35);padding:9px 15px 9px 12px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  #back:active { transform:translateY(1px);background:rgba(20,18,14,.75); }
  #back svg { display: block; }
  #zone {
    top: max(12px, env(safe-area-inset-top)); right: 14px;
    font-size: 11px; letter-spacing: .22em; color: rgba(242,239,232,.85);
    text-shadow: 0 1px 8px rgba(0,0,0,.7); font-weight: 600;
  }
  #eras {
    left: 50%; transform: translateX(-50%);
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 104px);
    display: flex; gap: 8px;
  }
  #eras button {
    appearance: none; border: 1px solid rgba(242,239,232,.4);
    background: rgba(20,18,14,.55); color: #f2efe8;
    font: 700 13px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 10px 16px; border-radius: 999px; letter-spacing: .05em;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #eras button.on { background: #f2efe8; color: #1c1a16; border-color: #f2efe8; }
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 64px);
    width: min(92vw, 560px); text-align: center;
    font-size: 13px; line-height: 1.5; color: rgba(242,239,232,.95);
    text-shadow: 0 1px 10px rgba(0,0,0,.8);
  }
  #shot {
    left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom));
    appearance: none; border: 0; border-radius: 999px;
    background: #1c1a16; color: #f5f2ea;
    font: 700 14px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 14px 30px; letter-spacing: .06em;
    box-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 22px rgba(0,0,0,.45);
  }
  #shot:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.55); }
  #hint {
    top: calc(max(12px, env(safe-area-inset-top)) + 34px);
    left: 50%; transform: translateX(-50%);
    background: rgba(20,18,14,.62); border: 1px solid rgba(242,239,232,.3);
    color: #f2efe8; font-size: 12.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; white-space: nowrap;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  #noCam {
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 150px);
    left: 50%; transform: translateX(-50%);
    width: min(92vw, 460px); text-align: center;
    background: rgba(120,42,32,.82); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.5;
    padding: 10px 14px; border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  #noCam button {
    appearance: none; border: 0; margin-top: 7px; display: block; width: 100%;
    background: #fff; color: #1c1a16; border-radius: 8px;
    font: 700 13px/1 "Apple SD Gothic Neo", sans-serif; padding: 9px;
  }
  #xrBtn {
    top: calc(max(12px, env(safe-area-inset-top)) + 30px); right: 14px;
    appearance: none; border: 1px solid rgba(242,239,232,.4);
    background: rgba(20,18,14,.55); color: #f2efe8;
    font: 700 12px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 9px 13px; border-radius: 999px;
    display: none;
  }

  /* 시작 오버레이 — 뮤지엄 카드 */
  #gate {
    position: fixed; inset: 0; z-index: 20;
    background: #faf9f6; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { max-width: 420px; width: 100%; }
  .kicker { font-size: 11px; letter-spacing: .3em; color: #8a8578; font-weight: 700; }
  .card h1 { font-size: 26px; color: #1c1a16; margin: 10px 0 6px; letter-spacing: -.01em; }
  .card p { font-size: 14px; line-height: 1.7; color: #6f6a5e; }
  .rule { height: 1px; background: #e2ded6; margin: 18px 0; }
  #start {
    appearance: none; border: 0; width: 100%;
    background: #1c1a16; color: #f5f2ea; border-radius: 14px;
    font: 700 16px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 17px; letter-spacing: .04em;
    box-shadow: 0 3px 0 #000;
  }
  #start:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  #start:disabled { opacity: .55; }
  .tip { font-size: 12px; color: #8a8578; margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="backdrop"></canvas>
<div id="view"></div>
<div id="grain"></div>
<div id="tone"></div>

<a class="hud" id="back" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>홈으로</a>
<div class="hud" id="zone">ZONE B · 변화의 복도</div>
<div class="hud" id="caption"></div>
<div class="hud" id="hint">바닥을 비추면 흰 링이 나타납니다 — 탭하면 그 자리로 인파가 지나갑니다</div>
<div class="hud" id="noCam">
  카메라가 꺼져 있어 대체 배경으로 보는 중입니다 — AR은 카메라 허용이 필요합니다
  <button id="retryCam">카메라 다시 켜기</button>
</div>
<button class="hud" id="shot">이 시대를 사진으로</button>
<button class="hud" id="xrBtn">실측 AR로 보기</button>

<div id="gate">
  <div class="card">
    <div class="kicker">MONET 100 · THE NEXT IMPRESSION</div>
    <h1>시대상 보기</h1>
    <p>카메라를 허용하고 <b>바닥을 비추면 흰 링</b>이 나타납니다. 탭하면 그 자리로 — 실크해트와 긴 드레스의 — 시대의 인파가 지나가기 시작합니다.</p>
    <div class="rule"></div>
    <button id="start">카메라 켜고 시대로 들어가기</button>
    <div class="tip">카메라를 허용하지 않으면 1889년의 파리 대로가 대신 펼쳐집니다</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const rnd = (a,b) => a + Math.random()*(b-a);

// 필름 그레인 타일
{
  const c = document.createElement('canvas'); c.width = 192; c.height = 192;
  const x = c.getContext('2d');
  const id = x.createImageData(192, 192);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = 110 + Math.random()*90 | 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v;
    id.data[i+3] = 255;
  }
  x.putImageData(id, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
}

// ══════════ 장면 정의 — 시대의 잔상 (실제 그 시절의 사진 속 사람들) ══════════
const SCENE = {
  caption: '시대의 물결 — 실크해트와 긴 드레스의 인파가 지금 이 자리를 지나갑니다',
  filter: 'contrast(1.03) saturate(.92)',
};

// ══════════ three 기본 ══════════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
function viewSize(){
  const r = document.getElementById('view').getBoundingClientRect();
  const pr = renderer ? renderer.getPixelRatio() : 1;
  const cw = renderer && renderer.domElement.width > 4 ? renderer.domElement.width / pr : 0;
  const ch = renderer && renderer.domElement.height > 4 ? renderer.domElement.height / pr : 0;
  return { w: r.width || innerWidth || cw || 1, h: r.height || innerHeight || ch || 1 };
}
{ const { w, h } = viewSize(); renderer.setSize(w, h); }
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
window.__scene = scene;
const camera = new THREE.PerspectiveCamera(64, viewSize().w/viewSize().h, .05, 120);
camera.position.set(0, 1.5, 0);

// 군중 전체가 담기는 그룹 — 탭/히트테스트로 이 그룹째 실제 바닥 위로 옮긴다
const crowd = new THREE.Group();
scene.add(crowd);

// ══════════ 카메라 영상 / 대체 배경 ══════════
const video = document.getElementById('cam');
const backdrop = document.getElementById('backdrop');
let usingCam = false;

function paintBoulevard(){
  const W = 1440, H = 2160;
  backdrop.width = W; backdrop.height = H;
  const x = backdrop.getContext('2d');
  const HZ = H*.55;                    // 지평선
  // 하늘 — 브러시 그라데이션
  const sky = x.createLinearGradient(0, 0, 0, HZ);
  sky.addColorStop(0, '#c3b294'); sky.addColorStop(.55, '#d9cbae'); sky.addColorStop(1, '#eee4ca');
  x.fillStyle = sky; x.fillRect(0, 0, W, HZ);
  for (let i = 0; i < 240; i++) {      // 하늘 붓질
    x.strokeStyle = `rgba(${(226+rnd(0,20))|0},${(214+rnd(0,18))|0},${(184+rnd(0,20))|0},${rnd(.08,.22)})`;
    x.lineWidth = rnd(8, 22); x.lineCap = 'round';
    const px = Math.random()*W, py = rnd(0, HZ*.8), len = rnd(60, 200);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-6,6)); x.stroke();
  }
  // 도로
  const rd = x.createLinearGradient(0, HZ, 0, H);
  rd.addColorStop(0, '#a39781'); rd.addColorStop(1, '#6b6252');
  x.fillStyle = rd; x.fillRect(0, HZ, W, H - HZ);
  for (let i = 0; i < 500; i++) {      // 노면 붓질
    x.strokeStyle = `rgba(${(120+rnd(-30,40))|0},${(110+rnd(-28,36))|0},${(92+rnd(-24,30))|0},${rnd(.12,.3)})`;
    x.lineWidth = rnd(6, 18); x.lineCap = 'round';
    const py = rnd(HZ + 10, H), px = Math.random()*W;
    const len = rnd(40, 160) * (py - HZ)/(H - HZ);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-3,3)); x.stroke();
  }
  // 오스만 건물 — 창문 격자·망사르 지붕
  const bld = (x0, w0, topY, tone, roofTone) => {
    x.fillStyle = roofTone;            // 망사르 지붕
    x.beginPath();
    x.moveTo(x0 - 6, topY + 44); x.lineTo(x0 + w0*.12, topY); x.lineTo(x0 + w0*.88, topY);
    x.lineTo(x0 + w0 + 6, topY + 44); x.closePath(); x.fill();
    x.fillStyle = tone;                // 몸체
    x.fillRect(x0, topY + 44, w0, HZ - topY - 44);
    const rows = Math.max(3, ((HZ - topY - 70) / 78)|0);
    const cols = Math.max(2, (w0 / 34)|0);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const wx = x0 + 14 + c*(w0 - 28)/cols + rnd(-1.5, 1.5);
      const wy = topY + 64 + r*78 + rnd(-2, 2);
      x.fillStyle = Math.random() < .12 ? 'rgba(226,186,120,.75)' : 'rgba(52,44,40,.6)';
      x.fillRect(wx, wy, 13, 26);
      if (r === 0) { x.fillStyle = 'rgba(52,44,40,.25)'; x.fillRect(wx - 2, wy + 30, 17, 3); }
    }
  };
  let cx0 = 0;
  while (cx0 < W*.42) { const w0 = rnd(120, 200); bld(cx0, w0, H*rnd(.15,.23), `rgba(${(150+rnd(-14,16))|0},${(134+rnd(-12,14))|0},${(120+rnd(-10,12))|0},1)`, 'rgba(74,64,60,.95)'); cx0 += w0 + 4; }
  let cx1 = W;
  while (cx1 > W*.58) { const w0 = rnd(120, 200); bld(cx1 - w0, w0, H*rnd(.15,.23), `rgba(${(144+rnd(-14,16))|0},${(130+rnd(-12,14))|0},${(118+rnd(-10,12))|0},1)`, 'rgba(70,60,56,.95)'); cx1 -= w0 + 4; }
  // 대기 원근 안개
  const fogG = x.createLinearGradient(0, H*.28, 0, HZ + 30);
  fogG.addColorStop(0, 'rgba(238,228,205,0)'); fogG.addColorStop(1, 'rgba(238,228,205,.6)');
  x.fillStyle = fogG; x.fillRect(0, H*.28, W, HZ + 30 - H*.28);
  // 가로수 — 점묘 수관
  const tree = (px, sc) => {
    x.strokeStyle = 'rgba(58,50,38,.9)'; x.lineWidth = 9*sc; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, HZ + 20*sc); x.lineTo(px + rnd(-6,6), HZ - 140*sc); x.stroke();
    for (let i = 0; i < 46; i++) {
      const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .6);
      x.fillStyle = `hsla(${rnd(70,110)}, ${rnd(18,32)}%, ${rnd(24,42)}%, ${rnd(.35,.7)})`;
      x.beginPath();
      x.ellipse(px + Math.cos(a)*rr*70*sc, HZ - 190*sc + Math.sin(a)*rr*60*sc, rnd(10,24)*sc, rnd(7,15)*sc, rnd(0,3), 0, Math.PI*2);
      x.fill();
    }
  };
  tree(W*.13, 1.15); tree(W*.3, .8); tree(W*.7, .8); tree(W*.86, 1.15);
  // 가스등
  const lamp = (px, sc) => {
    x.strokeStyle = 'rgba(40,36,32,.9)'; x.lineWidth = 5*sc; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, HZ + 30*sc); x.lineTo(px, HZ - 120*sc); x.stroke();
    x.fillStyle = 'rgba(235,205,140,.9)';
    x.beginPath(); x.ellipse(px, HZ - 128*sc, 8*sc, 12*sc, 0, 0, Math.PI*2); x.fill();
  };
  lamp(W*.22, 1); lamp(W*.78, 1);
}

async function openCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    usingCam = true;
    video.style.display = 'block';
    backdrop.style.display = 'none';
    document.getElementById('noCam').style.display = 'none';
  } catch(e) {
    usingCam = false;
    paintBoulevard();
    video.style.display = 'none';
    backdrop.style.display = 'block';
    document.getElementById('noCam').style.display = 'block';
  }
}
document.getElementById('retryCam').onclick = () => openCamera();

// ══════════ 자이로 + 드래그 룩 ══════════
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
let gyro = null;            // {alpha,beta,gamma}
let dragYaw = 0, dragPitch = 0;
const D2R = Math.PI/180;

addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  gyro = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
});

let pDown = null, pStart = null;
renderer.domElement.addEventListener('pointerdown', e => {
  pDown = { x: e.clientX, y: e.clientY };
  pStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});
addEventListener('pointermove', e => {
  if (!pDown) return;
  dragYaw   -= (e.clientX - pDown.x) * .0042;
  dragPitch -= (e.clientY - pDown.y) * .0042;
  dragPitch = THREE.MathUtils.clamp(dragPitch, -1.2, 1.2);
  pDown = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', e => {
  if (pStart && performance.now() - pStart.t < 500
      && Math.hypot(e.clientX - pStart.x, e.clientY - pStart.y) < 8) {
    placeCrowd(e.clientX, e.clientY);
  }
  pDown = null; pStart = null;
});

// ── 탭 앵커링: 탭한 화면 지점 → 바닥 평면(y=0) 교차점으로 군중을 옮긴다 ──
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const hintEl = document.getElementById('hint');
function placeCrowd(cx, cy){
  if (renderer.xr.isPresenting) return;          // XR에서는 히트테스트 셀렉트로
  const { w: vw, h: vh } = viewSize();
  _ndc.set(THREE.MathUtils.clamp(cx/vw*2 - 1, -1, 1), THREE.MathUtils.clamp(-(cy/vh)*2 + 1, -1, 1));
  camera.updateMatrixWorld(true);
  _ray.setFromCamera(_ndc, camera);
  const d = _ray.ray.direction;
  if (d.y > -.08) return;                        // 바닥을 향해 탭했을 때만
  const t = (0 - _ray.ray.origin.y) / d.y;
  if (t <= 0 || t > 30) return;
  const p = _ray.ray.origin.clone().addScaledVector(d, t);
  crowd.position.set(p.x, 0, p.z);
  placed = true;
  crowd.visible = true;
  revealCrowd();
  hintEl.textContent = '다시 탭하면 그 자리로 옮겨섭니다';
  setTimeout(() => hintEl.style.display = 'none', 2500);
}

// ── WebXR immersive-ar (지원 기기: 실제 평면 인식 + 히트테스트) ──
const xrBtn = document.getElementById('xrBtn');
let hitTestSource = null;
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(.14, .18, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color: 0xf2efe8, transparent: true, opacity: .9 }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (ok) xrBtn.style.display = 'block';
  }).catch(() => {});
}
xrBtn.onclick = async () => {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    });
    renderer.xr.enabled = true;
    reticle.matrixAutoUpdate = false;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    video.style.display = 'none';
    backdrop.style.display = 'none';
    const viewerSpace = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    session.addEventListener('select', () => {
      if (reticle.visible) {
        crowd.position.setFromMatrixPosition(reticle.matrix);
        placed = true;
        crowd.visible = true;
        revealCrowd();
        hintEl.style.display = 'none';
      }
    });
    session.addEventListener('end', () => {
      hitTestSource = null;
      renderer.xr.enabled = false;
      reticle.visible = false;
      if (usingCam) video.style.display = 'block'; else backdrop.style.display = 'block';
    });
    hintEl.textContent = '바닥의 흰 링을 겨누고 탭하면 그 자리에 사람들이 내려섭니다';
    hintEl.style.display = 'block';
  } catch(e) {}
};

const gyroQ = new THREE.Quaternion();
const yawQ = new THREE.Quaternion();
function updateCamera(){
  if (gyro) {
    const orient = (screen.orientation?.angle ?? window.orientation ?? 0) * D2R;
    euler.set(gyro.beta*D2R, gyro.alpha*D2R, -gyro.gamma*D2R, 'YXZ');
    gyroQ.setFromEuler(euler);
    gyroQ.multiply(q1);
    gyroQ.multiply(q0.setFromAxisAngle(zee, -orient));
    yawQ.setFromAxisAngle(new THREE.Vector3(0,1,0), dragYaw);
    camera.quaternion.copy(yawQ).multiply(gyroQ);
  } else {
    camera.rotation.set(0, 0, 0, 'YXZ');
    camera.rotation.y = dragYaw;
    camera.rotation.x = dragPitch;
  }
}

// 팔을 지정한 월드 방향으로 조준 — 메시 실측 방향에 바인드
function poseArmsDirs(byName, dirs){
  const aim = (bn, cn, dir) => {
    const bone = byName[bn], child = byName[cn];
    if (!bone || !child) return;
    bone.updateWorldMatrix(true, false); child.updateWorldMatrix(true, false);
    const bw = bone.getWorldPosition(new THREE.Vector3());
    const cw = child.getWorldPosition(new THREE.Vector3());
    const cur = cw.sub(bw).normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(cur, dir.clone().normalize());
    const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
    bone.quaternion.premultiply(pq.clone().invert().multiply(q).multiply(pq));
    bone.updateWorldMatrix(true, true);
  };
  aim('LeftArm', 'LeftForeArm', dirs.L);
  aim('LeftForeArm', 'LeftHand', dirs.L);
  aim('RightArm', 'RightForeArm', dirs.R);
  aim('RightForeArm', 'RightHand', dirs.R);
}

// 스케일 정렬된 지오메트리에서 실제 팔 방향 실측
function measureArmDirs(geo, byName){
  const out = {};
  for (const side of ['Left', 'Right']) {
    const sh = byName[side + 'Arm'].getWorldPosition(new THREE.Vector3());
    const hand = byName[side + 'Hand'].getWorldPosition(new THREE.Vector3());
    const armLen = sh.distanceTo(hand);
    const sgn = Math.sign(sh.x) || (side === 'Left' ? 1 : -1);
    const pos = geo.attributes.position;
    const cands = [];
    const p = new THREE.Vector3();
    for (let i = 0; i < pos.count; i += 2) {
      p.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      if (Math.sign(p.x) !== sgn) continue;
      if (p.y > sh.y - .05) continue;
      if (Math.abs(p.z - sh.z) > .3) continue;
      const d = p.distanceTo(sh);
      if (d < armLen * .8 || d > armLen * 1.3) continue;
      cands.push({ d, v: p.clone() });
    }
    if (cands.length < 4) {
      out[side === 'Left' ? 'L' : 'R'] = new THREE.Vector3(sgn * .45, -.88, .05).normalize();
      continue;
    }
    cands.sort((a, b) => b.d - a.d);
    const avg = new THREE.Vector3();
    cands.slice(0, 8).forEach(c => avg.add(c.v));
    avg.divideScalar(Math.min(cands.length, 8));
    out[side === 'Left' ? 'L' : 'R'] = avg.sub(sh).normalize();
  }
  return { L: out.L, R: out.R };
}

// 가중치용 본 세그먼트 (포즈드 바인드 월드 좌표)
const SEG_DEF = [
  ['Hips','Spine'], ['Spine','Spine1'], ['Spine1','Spine2'], ['Spine2','Neck'], ['Neck','Head'],
  ['LeftShoulder','LeftArm'], ['LeftArm','LeftForeArm'], ['LeftForeArm','LeftHand'], ['LeftHand','LeftHandMiddle1'],
  ['RightShoulder','RightArm'], ['RightArm','RightForeArm'], ['RightForeArm','RightHand'], ['RightHand','RightHandMiddle1'],
  ['LeftUpLeg','LeftLeg'], ['LeftLeg','LeftFoot'], ['LeftFoot','LeftToeBase'],
  ['RightUpLeg','RightLeg'], ['RightLeg','RightFoot'], ['RightFoot','RightToeBase'],
];
function buildSegments(byName, bones){
  const segs = [];
  for (const [a, b] of SEG_DEF) {
    const A = byName[a], B = byName[b];
    if (!A || !B) continue;
    segs.push({
      idx: bones.indexOf(A),
      p0: A.getWorldPosition(new THREE.Vector3()),
      p1: B.getWorldPosition(new THREE.Vector3()),
    });
  }
  // 머리 상단 가상 세그먼트 (모자 커버)
  const H = byName['Head'];
  const hp = H.getWorldPosition(new THREE.Vector3());
  segs.push({ idx: bones.indexOf(H), p0: hp.clone(), p1: hp.clone().add(new THREE.Vector3(0, .4, 0)) });
  return segs;
}
const _ab = new THREE.Vector3(), _ap = new THREE.Vector3(), _cl = new THREE.Vector3();
function distToSeg(p, s){
  _ab.subVectors(s.p1, s.p0);
  _ap.subVectors(p, s.p0);
  const t = THREE.MathUtils.clamp(_ap.dot(_ab) / _ab.lengthSq(), 0, 1);
  _cl.copy(s.p0).addScaledVector(_ab, t);
  return p.distanceTo(_cl);
}

// ── AI 조각 → 스킨드 워커 지오메트리 ──
// template: 포즈드 바인드 상태의 스켈레톤 루트 (월드 갱신 완료)
function skinStatue(aiScene, byName, bones, opts){
  // 1) 통짜 지오메트리 추출 (Z-up 보정 + 월드 베이크)
  let src = null;
  aiScene.traverse(o => { if (!src && o.isMesh) src = o; });
  opts.material = src.material;
  const geo = src.geometry.clone();
  src.updateWorldMatrix(true, false);
  geo.applyMatrix4(src.matrixWorld);
  if (opts.zUp) geo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  geo.computeBoundingBox();
  // (스케일 정렬은 T포즈 치수 기준 — 팔 포즈와 무관)
  const bb = geo.boundingBox, size = bb.getSize(new THREE.Vector3());
  // 2) 스켈레톤 치수에 맞춤: 발=0, 키=머리끝*1.06, 중심=힙 축
  const headTop = byName['Head'].getWorldPosition(new THREE.Vector3()).y + .22;
  const s = (headTop * (opts.hScale || 1.04)) / size.y;
  const hips = byName['Hips'].getWorldPosition(new THREE.Vector3());
  const cx = (bb.min.x + bb.max.x)/2, cz = (bb.min.z + bb.max.z)/2;
  geo.translate(-cx, -bb.min.y, -cz);
  geo.scale(s, s, s);
  geo.translate(hips.x, 0, hips.z);
  // 3) 메시에서 팔 방향 실측 → 그 방향으로 본을 바인드 포즈
  const armDirs = opts.armDirs || measureArmDirs(geo, byName);
  poseArmsDirs(byName, armDirs);
  opts.armDirs = armDirs;
  // 4) 정점별 가중치 (포즈드 세그먼트 기준)
  const segs = buildSegments(byName, bones);
  const hipsY = hips.y;
  const pos = geo.attributes.position;
  const n = pos.count;
  const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
  const p = new THREE.Vector3();
  const hipsIdx = bones.indexOf(byName['Hips']);
  for (let i = 0; i < n; i++) {
    p.set(pos.getX(i), pos.getY(i), pos.getZ(i));
    if (opts.gown && p.y < hipsY - .04) {   // 가운: 힙 고정 (찢어짐 방지)
      si[i*4] = hipsIdx; sw[i*4] = 1;
      continue;
    }
    let b1 = -1, d1 = 1e9, b2 = -1, d2 = 1e9;
    for (const sg of segs) {
      const d = distToSeg(p, sg);
      if (d < d1) { b2 = b1; d2 = d1; b1 = sg.idx; d1 = d; }
      else if (d < d2) { b2 = sg.idx; d2 = d; }
    }
    if (b2 < 0 || d2 > d1 * 1.7) { si[i*4] = b1; sw[i*4] = 1; }
    else {
      const w1 = 1/Math.pow(d1 + 1e-4, 3), w2 = 1/Math.pow(d2 + 1e-4, 3);
      const t = w1/(w1 + w2);
      si[i*4] = b1; sw[i*4] = t;
      si[i*4+1] = b2; sw[i*4+1] = 1 - t;
    }
  }
  geo.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  geo.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  return geo;
}

function blobTexture(){

function skinAttrs(g, idx){

  g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  return g;
}
function templateBones(root){
  const bones = [];
  root.traverse(o => { if (/^mixamorig/.test(o.name)) bones.push(o); });
  return bones;
}
const SEGS = [
  ['Neck', 'Head', .042],
  ['LeftArm', 'LeftForeArm', .042],
  ['LeftForeArm', 'LeftHand', .036],
  ['LeftHand', 'LeftHandMiddle1', .032],
  ['RightArm', 'RightForeArm', .042],
  ['RightForeArm', 'RightHand', .036],
  ['RightHand', 'RightHandMiddle1', .032],
  ['LeftUpLeg', 'LeftLeg', .066],

];
// 관절 구슬 — 굽힘 때 이음새 메움
const JOINTS = [
  ['LeftArm', .046], ['RightArm', .046],
  ['LeftForeArm', .038], ['RightForeArm', .038],
  ['LeftUpLeg', .068], ['RightUpLeg', .068],
  ['LeftLeg', .054], ['RightLeg', .054],

];

function buildMannequinGeo(kind){
  const bones = templateBones(walkTemplate);
  const byName = {};
  bones.forEach(b => byName[b.name.replace(/^mixamorig/, '')] = b);
  const idxOf = b => bones.indexOf(b);
  const v0 = new THREE.Vector3(), v1 = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  const geos = [];
  const seg = (an, bn, r) => {
    const A = byName[an], B = byName[bn];
    if (!A || !B) return;
    A.getWorldPosition(v0); B.getWorldPosition(v1);
    const d = v1.clone().sub(v0), len = d.length();
    if (len < .015) return;
    const g = new THREE.CapsuleGeometry(r, Math.max(len - r, .02), 3, 10);
    const q = new THREE.Quaternion().setFromUnitVectors(up, d.clone().normalize());
    g.applyMatrix4(new THREE.Matrix4().compose(
      v0.clone().addScaledVector(d, .5), q, new THREE.Vector3(1, 1, 1)));
    geos.push(skinAttrs(g, idxOf(A)));
  };
  const noLegs = kind.includes('noLegs');
  for (const [a, b, r] of SEGS) {
    if (noLegs && /Leg|Foot/.test(a)) continue;
    seg(a, b, r);
  }
  for (const [jn, jr] of JOINTS) {
    if (noLegs && /Leg|Foot/.test(jn)) continue;
    const J = byName[jn];
    if (!J) continue;
    J.getWorldPosition(v0);
    const g = new THREE.SphereGeometry(jr, 10, 8);
    g.translate(v0.x, v0.y, v0.z);
    geos.push(skinAttrs(g, idxOf(J)));
  }
  // 몸통 — 힙에서 어깨까지 하나의 매끈한 셰이프
  {
    const wy = n => { byName[n].getWorldPosition(v0); return v0.y; };
    const yH = wy('Hips'), yS1 = wy('Spine1'), yS2 = wy('Spine2'), yN = wy('Neck');
    const shoulderHalf = (() => {
      byName['LeftArm'].getWorldPosition(v0);
      const t = v0.clone();
      byName['RightArm'].getWorldPosition(v0);
      return t.distanceTo(v0) / 2;
    })();
    const prof = [
      [yH - .1, .002], [yH - .09, .105], [yH - .02, .142], [yH + .04, .128],
      [(yH + yS1)/2 + .02, .114], [yS1, .12], [(yS1 + yS2)/2, .132],
      [yS2, Math.max(.14, shoulderHalf*.92)], [yN - .015, Math.max(.12, shoulderHalf*.8)],
      [yN + .01, .048], [yN + .02, .002],
    ];
    const g = new THREE.LatheGeometry(prof.map(([y, r]) => new THREE.Vector2(r, y)), 18);
    // 몸통 앞뒤 두께 납작하게
    const hipsPos = new THREE.Vector3();
    byName['Hips'].getWorldPosition(hipsPos);
    g.translate(-hipsPos.x, 0, -hipsPos.z);
    g.scale(1, 1, .78);
    g.translate(hipsPos.x, 0, hipsPos.z);
    // 높이에 따라 힙/척추 본에 배분
    const pos = g.attributes.position;
    const n = pos.count;
    const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
    const iH = idxOf(byName['Hips']), iS1 = idxOf(byName['Spine1']), iS2 = idxOf(byName['Spine2']);
    for (let i = 0; i < n; i++) {
      const y = pos.getY(i);
      const idx = y < (yH + yS1)/2 ? iH : (y < (yS1 + yS2)/2 ? iS1 : iS2);
      si[i*4] = idx; sw[i*4] = 1;
    }
    g.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
    g.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
    geos.push(g);
  }
  // 머리
  {
    const H = byName['Head'], HT = byName['HeadTop_End'];
    H.getWorldPosition(v0); (HT || H).getWorldPosition(v1);
    const c = v0.clone().lerp(v1, .45);
    const g = new THREE.SphereGeometry(.093, 14, 12);
    g.scale(1, 1.18, 1.05);
    g.translate(c.x, c.y, c.z);
    geos.push(skinAttrs(g, idxOf(H)));
  }
  const hipsY = (() => { byName['Hips'].getWorldPosition(v0); return v0.y; })();
  const headTop = (() => { (byName['HeadTop_End'] || byName['Head']).getWorldPosition(v0); return v0.y; })();
  if (kind.includes('tophat')) {
    const bIdx = idxOf(byName['Head']);
    const crown = new THREE.CylinderGeometry(.072, .078, .15, 14);
    crown.translate(0, headTop + .085, .012);
    geos.push(skinAttrs(crown, bIdx));
    const brim = new THREE.CylinderGeometry(.125, .125, .014, 16);
    brim.translate(0, headTop + .012, .012);
    geos.push(skinAttrs(brim, bIdx));
  }
  if (kind.includes('brim')) {
    const bIdx = idxOf(byName['Head']);
    const brim = new THREE.CylinderGeometry(.16, .16, .02, 16);
    brim.translate(0, headTop + .01, .01);
    geos.push(skinAttrs(brim, bIdx));
    const crown = new THREE.SphereGeometry(.08, 12, 8);
    crown.scale(1, .6, 1);
    crown.translate(0, headTop + .03, .01);
    geos.push(skinAttrs(crown, bIdx));
  }
  if (kind.includes('bun')) {
    const bIdx = idxOf(byName['Head']);
    const bun = new THREE.SphereGeometry(.05, 10, 8);
    byName['Head'].getWorldPosition(v0);
    bun.translate(v0.x, headTop - .03, v0.z - .09);
    geos.push(skinAttrs(bun, bIdx));
  }
  const merged = BufferGeometryUtils.mergeBufferGeometries(geos, false);
  return merged;
}

function buildSkirtGeo(){
  const bones = templateBones(walkTemplate);
  const byName = {};
  bones.forEach(b => byName[b.name.replace(/^mixamorig/, '')] = b);
  const v = new THREE.Vector3();
  byName['Hips'].getWorldPosition(v);
  const yH = v.y;
  byName['Spine1'].getWorldPosition(v);
  const yS1 = v.y;
  const yWaist = (yH + yS1) / 2;
  // 가운 프로필: 허리 밀착 → 힙 곡선 → 무릎부터 플레어 → 밑단
  const prof = [
    [yWaist + .02, .112],
    [yH + .03, .138],
    [yH - .06, .152],
    [yH - .22, .158],
    [yH - .40, .175],
    [yH - .58, .215],
    [.10, .30],
    [.025, .36],
  ];
  const g = new THREE.LatheGeometry(prof.map(([y, r]) => new THREE.Vector2(r, y)), 26);
  // 밑단 주름 — 아랫부분일수록 각도 따라 물결
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const depth = THREE.MathUtils.clamp((yH - .3 - y) / (yH - .3), 0, 1);
    if (depth <= 0) continue;
    const a = Math.atan2(z, x);
    const k = 1 + Math.sin(a*7 + 1.3) * .035 * depth;
    pos.setX(i, x*k);
    pos.setZ(i, z*k);
  }
  g.computeVertexNormals();
  return g;
}

  sh.rotation.x = -Math.PI/2; sh.position.y = .012;
  root.add(sh);
  const mixer = new THREE.AnimationMixer(inst);
  mixer.clipAction(isMan ? walkClipM : walkClipF).play();
  mixer.update(Math.random()*2);
  const speed = rnd(.72, 1.1);
  const lane = rnd(-4.6, 4.6);
  const dir = (Math.random() < .12 ? -1 : 1) * (lane > 0 ? -1 : 1);
  root.position.set(lane, 0, rnd(-CROWD_L/2, CROWD_L/2));
  root.rotation.y = dir > 0 ? 0 : Math.PI;
  root.scale.setScalar(rnd(.97, 1.03));
  crowd.add(root);
  walkers.push({ root, mesh, mat, shMat, mixer, speed, dir, lane, born: 1e9,
    sway: rnd(-.05, .05), phase: Math.random()*6.28 });
}

function spawnMannequin(){
  const isMan = Math.random() < .54;
  const kind = isMan
    ? (Math.random() < .72 ? 'gentHat' : 'gent')
    : (Math.random() < .5 ? 'ladyBrim' : 'ladyBun');
  const geo = GEO[kind];
  const inst = walkTemplate.clone(true);
  const bones = templateBones(inst);
  const skeleton = new THREE.Skeleton(bones);
  const col = isMan ? MAN_COLS[(Math.random()*MAN_COLS.length)|0] : WOMAN_COLS[(Math.random()*WOMAN_COLS.length)|0];
  const mat = new THREE.MeshStandardMaterial({ color: col, roughness: .92, metalness: 0, transparent: true, opacity: 0, side: THREE.DoubleSide });
  const mesh = new THREE.SkinnedMesh(geo, mat);
  mesh.frustumCulled = false;
  const root = new THREE.Group();
  root.add(inst);
  root.add(mesh);
  mesh.bind(skeleton, new THREE.Matrix4());
  if (!isMan) {
    const skirt = new THREE.Mesh(GEO.skirt, mat);   // 본체와 같은 재질 — 페이드 동기 보장
    skirt.frustumCulled = false;
    root.add(skirt);
  }

  const shMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0 });
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(.85, .5), shMat);
  sh.rotation.x = -Math.PI/2;
  sh.position.y = .012;
  root.add(sh);

  const mixer = new THREE.AnimationMixer(inst);
  mixer.clipAction(isMan ? walkClipM : walkClipF).play();
  mixer.update(Math.random()*2);

  const speed = rnd(.72, 1.22);
  const lane = rnd(-4.6, 4.6);
  const dir = (Math.random() < .12 ? -1 : 1) * (lane > 0 ? -1 : 1);   // 대체로 우측통행
  const z0 = rnd(-CROWD_L/2, CROWD_L/2);
  root.position.set(lane, 0, z0);
  root.rotation.y = dir > 0 ? 0 : Math.PI;
  root.scale.setScalar(rnd(.95, 1.05));
  crowd.add(root);
  walkers.push({ root, mesh, mat, shMat, mixer, speed, dir, lane, born: 1e9,
    sway: rnd(-.06, .06), phase: Math.random()*6.28 });
}

const CROWD_L = 26;
const CROWD_N = /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 27 : 48;

function revealCrowd(){
  const t = clock.elapsedTime;
  walkers.forEach(w => { w.born = t + rnd(0, 1.6); });
}

function updateFigures(dt){
  const t = clock.elapsedTime;
  for (const w of walkers) {
    w.mixer.update(dt * w.speed / 1.15);
    // 이동 + 순환
    w.root.position.z += w.dir * w.speed * dt;
    if (Math.abs(w.root.position.z) > CROWD_L/2) {
      w.root.position.z = -Math.sign(w.root.position.z) * CROWD_L/2;
      w.lane = rnd(-4.6, 4.6);
      w.root.position.x = w.lane;
    }
    w.root.rotation.y = (w.dir > 0 ? 0 : Math.PI) + Math.sin(t*.7 + w.phase)*w.sway;
    // 등장 페이드 × 가장자리 페이드
    const appear = THREE.MathUtils.clamp((t - w.born) / 1.4, 0, 1);
    const edge = THREE.MathUtils.clamp((CROWD_L/2 - Math.abs(w.root.position.z)) / 2.2, 0, 1);
    const o = appear * edge;
    w.mat.opacity = o * .98;
    w.shMat.opacity = o * .5;
  }
}

function clearWalkers(){
  for (const w of walkers) crowd.remove(w.root);
  walkers.length = 0;
}

let placed = false;
function buildCast(){
  clearWalkers();
  if (MESHY) {
    const kinds = MESHY.porter ? ['gent', 'lady', 'porter'] : ['gent', 'lady'];
    for (let i = 0; i < CROWD_N; i++) spawnMeshy(kinds[i % kinds.length]);
  } else {
    for (let i = 0; i < CROWD_N; i++) spawnMannequin();   // 폴백
  }
  crowd.visible = placed;
}

// 인파 조명 — 매트 마네킹용
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.0));
const key = new THREE.DirectionalLight(0xfff4e0, .75);
key.position.set(3, 8, 2);
scene.add(key);

// ══════════ 장면 적용 ══════════
const capEl = document.getElementById('caption');
function applyScene(){
  capEl.textContent = SCENE.caption;
  video.style.filter = SCENE.filter;
  backdrop.style.filter = SCENE.filter;
  buildCast();
}
capEl.textContent = SCENE.caption;

// ══════════ 사진 ══════════
document.getElementById('shot').onclick = () => {
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.filter = SCENE.filter;
  const src = usingCam ? video : backdrop;
  const sw = usingCam ? video.videoWidth : backdrop.width;
  const sh = usingCam ? video.videoHeight : backdrop.height;
  if (sw && sh) {
    const sc = Math.max(W/sw, H/sh);
    x.drawImage(src, (W - sw*sc)/2, (H - sh*sc)/2, sw*sc, sh*sc);
  } else { x.fillStyle = '#111'; x.fillRect(0,0,W,H); }
  x.filter = 'none';
  x.drawImage(renderer.domElement, 0, 0);
  // 메타 스트립
  const pad = Math.round(W*.03);
  x.fillStyle = 'rgba(20,18,14,.72)';
  x.fillRect(0, H - pad*2.6, W, pad*2.6);
  x.fillStyle = '#f2efe8';
  x.font = `700 ${pad*.78}px "Apple SD Gothic Neo"`;
  x.fillText('변화의 복도 · 시대의 물결', pad, H - pad*1.5);
  x.fillStyle = 'rgba(242,239,232,.7)';
  x.font = `600 ${pad*.55}px "Apple SD Gothic Neo"`;
  x.fillText('MONET 100 · THE NEXT IMPRESSION', pad, H - pad*.7);
  const a = document.createElement('a');
  a.download = 'monet100_era.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

// ══════════ 시작 ══════════
document.getElementById('start').onclick = async () => {
  startBtn.disabled = true;
  // iOS 자이로 권한 (사용자 제스처 필요)
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e) {}
  await openCamera();
  try {
    await loadCrowdAssets();
  } catch(e) {
    startBtn.textContent = '인파를 준비하지 못했습니다 — 다시 시도';
    startBtn.disabled = false;
    return;
  }
  applyScene();
  document.getElementById('gate').style.display = 'none';
  hintEl.style.display = 'block';
};

function fitView(){
  const { w, h } = viewSize();
  if (w < 2 || h < 2) return;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener('resize', fitView);

let _fitTick = 0;
renderer.setAnimationLoop((time, frame) => {
  if ((_fitTick++ & 15) === 0 && !renderer.xr.isPresenting) {
    const { w } = viewSize();
    if (w > 2 && Math.abs(renderer.domElement.clientWidth - w) > 2) fitView();
    else if (isNaN(camera.projectionMatrix.elements[0])) fitView();
  }
  const dt = Math.min(clock.getDelta(), .1);
  updateFigures(dt);
  if (renderer.xr.isPresenting) {
    if (frame && hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        reticle.matrix.fromArray(pose.transform.matrix);
        reticle.visible = true;
      } else reticle.visible = false;
    }
  } else {
    updateCamera();
    // 화면 중앙 광선 → 바닥 평면: 조준 링 (배치 전 피드백)
    camera.getWorldDirection(_fwd);
    if (_fwd.y < -.12) {
      const t = (0 - camera.position.y) / _fwd.y;
      if (t > .4 && t < 14) {
        reticle.matrixAutoUpdate = true;
        reticle.position.copy(camera.position).addScaledVector(_fwd, t);
        reticle.visible = true;
      } else reticle.visible = false;
    } else reticle.visible = false;
  }
  renderer.render(scene, camera);
});
</script>
