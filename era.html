<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>변화의 복도 — 시대상 AR</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #14120e; }
  body { font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  #cam, #backdrop {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #backdrop { display: none; }
  #view { position: fixed; inset: 0; z-index: 1; }
  #view canvas { display: block; }

  .hud { position: fixed; z-index: 5; color: #f2efe8; }
  #back {
    top: max(12px, env(safe-area-inset-top)); left: 14px;
    font-size: 13px; font-weight: 700; color: #f2efe8; text-decoration: none;
    text-shadow: 0 1px 8px rgba(0,0,0,.7); letter-spacing: .04em;
  }
  #zone {
    top: max(12px, env(safe-area-inset-top)); right: 14px;
    font-size: 11px; letter-spacing: .22em; color: rgba(242,239,232,.85);
    text-shadow: 0 1px 8px rgba(0,0,0,.7); font-weight: 600;
  }
  #eras {
    left: 50%; transform: translateX(-50%);
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 104px);
    display: flex; gap: 8px;
  }
  #eras button {
    appearance: none; border: 1px solid rgba(242,239,232,.4);
    background: rgba(20,18,14,.55); color: #f2efe8;
    font: 700 13px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 10px 16px; border-radius: 999px; letter-spacing: .05em;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #eras button.on { background: #f2efe8; color: #1c1a16; border-color: #f2efe8; }
  #caption {
    left: 50%; transform: translateX(-50%);
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 64px);
    width: min(92vw, 560px); text-align: center;
    font-size: 13px; line-height: 1.5; color: rgba(242,239,232,.95);
    text-shadow: 0 1px 10px rgba(0,0,0,.8);
  }
  #shot {
    left: 50%; transform: translateX(-50%);
    bottom: max(14px, env(safe-area-inset-bottom));
    appearance: none; border: 0; border-radius: 999px;
    background: #1c1a16; color: #f5f2ea;
    font: 700 14px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 14px 30px; letter-spacing: .06em;
    box-shadow: 0 3px 0 rgba(0,0,0,.55), 0 8px 22px rgba(0,0,0,.45);
  }
  #shot:active { transform: translateX(-50%) translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.55); }
  #hint {
    top: calc(max(12px, env(safe-area-inset-top)) + 34px);
    left: 50%; transform: translateX(-50%);
    background: rgba(20,18,14,.62); border: 1px solid rgba(242,239,232,.3);
    color: #f2efe8; font-size: 12.5px; font-weight: 600;
    padding: 9px 16px; border-radius: 999px; white-space: nowrap;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  #noCam {
    bottom: calc(max(14px, env(safe-area-inset-bottom)) + 150px);
    left: 50%; transform: translateX(-50%);
    width: min(92vw, 460px); text-align: center;
    background: rgba(120,42,32,.82); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 12.5px; font-weight: 600; line-height: 1.5;
    padding: 10px 14px; border-radius: 12px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none;
  }
  #noCam button {
    appearance: none; border: 0; margin-top: 7px; display: block; width: 100%;
    background: #fff; color: #1c1a16; border-radius: 8px;
    font: 700 13px/1 "Apple SD Gothic Neo", sans-serif; padding: 9px;
  }
  #xrBtn {
    top: calc(max(12px, env(safe-area-inset-top)) + 30px); right: 14px;
    appearance: none; border: 1px solid rgba(242,239,232,.4);
    background: rgba(20,18,14,.55); color: #f2efe8;
    font: 700 12px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 9px 13px; border-radius: 999px;
    display: none;
  }

  /* 시작 오버레이 — 뮤지엄 카드 */
  #gate {
    position: fixed; inset: 0; z-index: 20;
    background: #faf9f6; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { max-width: 420px; width: 100%; }
  .kicker { font-size: 11px; letter-spacing: .3em; color: #8a8578; font-weight: 700; }
  .card h1 { font-size: 26px; color: #1c1a16; margin: 10px 0 6px; letter-spacing: -.01em; }
  .card p { font-size: 14px; line-height: 1.7; color: #6f6a5e; }
  .rule { height: 1px; background: #e2ded6; margin: 18px 0; }
  #start {
    appearance: none; border: 0; width: 100%;
    background: #1c1a16; color: #f5f2ea; border-radius: 14px;
    font: 700 16px/1 "Apple SD Gothic Neo", sans-serif;
    padding: 17px; letter-spacing: .04em;
    box-shadow: 0 3px 0 #000;
  }
  #start:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
  #start:disabled { opacity: .55; }
  .tip { font-size: 12px; color: #8a8578; margin-top: 12px; text-align: center; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="backdrop"></canvas>
<div id="view"></div>

<a class="hud" id="back" href="index.html">← 홈</a>
<div class="hud" id="zone">ZONE B · 변화의 복도</div>
<div class="hud" id="caption"></div>
<div class="hud" id="hint">바닥을 비추고 화면을 탭하면 그 자리에 사람들이 내려섭니다</div>
<div class="hud" id="noCam">
  카메라가 꺼져 있어 대체 배경으로 보는 중입니다 — AR은 카메라 허용이 필요합니다
  <button id="retryCam">카메라 다시 켜기</button>
</div>
<button class="hud" id="shot">이 시대를 사진으로</button>
<button class="hud" id="xrBtn">실측 AR로 보기</button>

<div id="gate">
  <div class="card">
    <div class="kicker">MONET 100 · THE NEXT IMPRESSION</div>
    <h1>시대상 보기</h1>
    <p>카메라를 허용한 뒤 <b>바닥을 비추고 화면을 탭</b>하면, 그 자리에 모네가 살았던 시대의 사람들이 내려서 걸어다닙니다. 기기를 천천히 돌려 주변을 둘러보세요.</p>
    <div class="rule"></div>
    <button id="start">카메라 켜고 시대로 들어가기</button>
    <div class="tip">카메라를 허용하지 않으면 1889년의 파리 대로가 대신 펼쳐집니다</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const rnd = (a,b) => a + Math.random()*(b-a);

// ══════════ 장면 정의 — 모네의 시대, 단일 캐스트 ══════════
const SCENE = {
  caption: '모네가 살았던 시대의 파리 — 지금 서 있는 자리를 함께 걷습니다',
  filter: 'sepia(.26) contrast(1.04)',
  cast: ['lucille','alienist','lillian','elder'],
};

// 모델 정의 — mode: walk(걷기)/amble(느린 산책)/stand(서 있음)/dance
// 빅토리안 텍스처 모델 출처(CC-BY, Sketchfab): FragileWife(mikoala), MadCorvin(Nicu.Scarlat),
// Lillian·Lucille(MooKorea), OldMan(Karin.Granlund), Fancy(CharacterZone), CanCan(LasquetiSpice)
const MODEL_DEFS = {
  alienist: { url: 'models/era/alienist.glb', mode: 'stand', clip: /Idle/i, hide: /stand/i },
  elder:    { url: 'models/era/elder.glb',    mode: 'stand', clip: /idle/i },
  lillian:  { url: 'models/era/lillian.glb',  mode: 'stand', clip: /^Idle_g$/i, hide: /sword|weapon|blade/i },
  lucille:  { url: 'models/era/lucille.glb',  clip: /^Walk_g$/i, hide: /sword|sheath|scabbard|blade|weapon/i },
};

// ══════════ three 기본 ══════════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
window.__scene = scene;
const camera = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, .05, 120);
camera.position.set(0, 1.5, 0);

scene.add(new THREE.HemisphereLight(0xfff2dd, 0x8a7f6a, .95));

// 군중 전체가 담기는 그룹 — 탭/히트테스트로 이 그룹째 실제 바닥 위로 옮긴다
const crowd = new THREE.Group();
scene.add(crowd);

const sun = new THREE.DirectionalLight(0xffe8c4, 1.05);
sun.position.set(4, 9, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
crowd.add(sun);
crowd.add(sun.target);

// 바닥 — 그림자만 받는 투명판 (카메라 영상 위에 그림자를 얹음)
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48),
  new THREE.ShadowMaterial({ opacity: .28 }));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
crowd.add(ground);

// ══════════ 카메라 영상 / 대체 배경 ══════════
const video = document.getElementById('cam');
const backdrop = document.getElementById('backdrop');
let usingCam = false;

function paintBoulevard(){
  const W = 1440, H = 2160;
  backdrop.width = W; backdrop.height = H;
  const x = backdrop.getContext('2d');
  const HZ = H*.55;                    // 지평선
  // 하늘 — 브러시 그라데이션
  const sky = x.createLinearGradient(0, 0, 0, HZ);
  sky.addColorStop(0, '#c3b294'); sky.addColorStop(.55, '#d9cbae'); sky.addColorStop(1, '#eee4ca');
  x.fillStyle = sky; x.fillRect(0, 0, W, HZ);
  for (let i = 0; i < 240; i++) {      // 하늘 붓질
    x.strokeStyle = `rgba(${(226+rnd(0,20))|0},${(214+rnd(0,18))|0},${(184+rnd(0,20))|0},${rnd(.08,.22)})`;
    x.lineWidth = rnd(8, 22); x.lineCap = 'round';
    const px = Math.random()*W, py = rnd(0, HZ*.8), len = rnd(60, 200);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-6,6)); x.stroke();
  }
  // 도로
  const rd = x.createLinearGradient(0, HZ, 0, H);
  rd.addColorStop(0, '#a39781'); rd.addColorStop(1, '#6b6252');
  x.fillStyle = rd; x.fillRect(0, HZ, W, H - HZ);
  for (let i = 0; i < 500; i++) {      // 노면 붓질
    x.strokeStyle = `rgba(${(120+rnd(-30,40))|0},${(110+rnd(-28,36))|0},${(92+rnd(-24,30))|0},${rnd(.12,.3)})`;
    x.lineWidth = rnd(6, 18); x.lineCap = 'round';
    const py = rnd(HZ + 10, H), px = Math.random()*W;
    const len = rnd(40, 160) * (py - HZ)/(H - HZ);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-3,3)); x.stroke();
  }
  // 오스만 건물 — 창문 격자·망사르 지붕
  const bld = (x0, w0, topY, tone, roofTone) => {
    x.fillStyle = roofTone;            // 망사르 지붕
    x.beginPath();
    x.moveTo(x0 - 6, topY + 44); x.lineTo(x0 + w0*.12, topY); x.lineTo(x0 + w0*.88, topY);
    x.lineTo(x0 + w0 + 6, topY + 44); x.closePath(); x.fill();
    x.fillStyle = tone;                // 몸체
    x.fillRect(x0, topY + 44, w0, HZ - topY - 44);
    const rows = Math.max(3, ((HZ - topY - 70) / 78)|0);
    const cols = Math.max(2, (w0 / 34)|0);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const wx = x0 + 14 + c*(w0 - 28)/cols + rnd(-1.5, 1.5);
      const wy = topY + 64 + r*78 + rnd(-2, 2);
      x.fillStyle = Math.random() < .12 ? 'rgba(226,186,120,.75)' : 'rgba(52,44,40,.6)';
      x.fillRect(wx, wy, 13, 26);
      if (r === 0) { x.fillStyle = 'rgba(52,44,40,.25)'; x.fillRect(wx - 2, wy + 30, 17, 3); }
    }
  };
  let cx0 = 0;
  while (cx0 < W*.42) { const w0 = rnd(120, 200); bld(cx0, w0, H*rnd(.15,.23), `rgba(${(150+rnd(-14,16))|0},${(134+rnd(-12,14))|0},${(120+rnd(-10,12))|0},1)`, 'rgba(74,64,60,.95)'); cx0 += w0 + 4; }
  let cx1 = W;
  while (cx1 > W*.58) { const w0 = rnd(120, 200); bld(cx1 - w0, w0, H*rnd(.15,.23), `rgba(${(144+rnd(-14,16))|0},${(130+rnd(-12,14))|0},${(118+rnd(-10,12))|0},1)`, 'rgba(70,60,56,.95)'); cx1 -= w0 + 4; }
  // 대기 원근 안개
  const fogG = x.createLinearGradient(0, H*.28, 0, HZ + 30);
  fogG.addColorStop(0, 'rgba(238,228,205,0)'); fogG.addColorStop(1, 'rgba(238,228,205,.6)');
  x.fillStyle = fogG; x.fillRect(0, H*.28, W, HZ + 30 - H*.28);
  // 가로수 — 점묘 수관
  const tree = (px, sc) => {
    x.strokeStyle = 'rgba(58,50,38,.9)'; x.lineWidth = 9*sc; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, HZ + 20*sc); x.lineTo(px + rnd(-6,6), HZ - 140*sc); x.stroke();
    for (let i = 0; i < 46; i++) {
      const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .6);
      x.fillStyle = `hsla(${rnd(70,110)}, ${rnd(18,32)}%, ${rnd(24,42)}%, ${rnd(.35,.7)})`;
      x.beginPath();
      x.ellipse(px + Math.cos(a)*rr*70*sc, HZ - 190*sc + Math.sin(a)*rr*60*sc, rnd(10,24)*sc, rnd(7,15)*sc, rnd(0,3), 0, Math.PI*2);
      x.fill();
    }
  };
  tree(W*.13, 1.15); tree(W*.3, .8); tree(W*.7, .8); tree(W*.86, 1.15);
  // 가스등
  const lamp = (px, sc) => {
    x.strokeStyle = 'rgba(40,36,32,.9)'; x.lineWidth = 5*sc; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, HZ + 30*sc); x.lineTo(px, HZ - 120*sc); x.stroke();
    x.fillStyle = 'rgba(235,205,140,.9)';
    x.beginPath(); x.ellipse(px, HZ - 128*sc, 8*sc, 12*sc, 0, 0, Math.PI*2); x.fill();
  };
  lamp(W*.22, 1); lamp(W*.78, 1);
}

async function openCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    usingCam = true;
    video.style.display = 'block';
    backdrop.style.display = 'none';
    document.getElementById('noCam').style.display = 'none';
  } catch(e) {
    usingCam = false;
    paintBoulevard();
    video.style.display = 'none';
    backdrop.style.display = 'block';
    document.getElementById('noCam').style.display = 'block';
  }
}
document.getElementById('retryCam').onclick = () => openCamera();

// ══════════ 자이로 + 드래그 룩 ══════════
const zee = new THREE.Vector3(0, 0, 1);
const euler = new THREE.Euler();
const q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.sqrt(.5), 0, 0, Math.sqrt(.5));
let gyro = null;            // {alpha,beta,gamma}
let dragYaw = 0, dragPitch = 0;
const D2R = Math.PI/180;

addEventListener('deviceorientation', e => {
  if (e.alpha == null) return;
  gyro = { alpha: e.alpha, beta: e.beta, gamma: e.gamma };
});

let pDown = null, pStart = null;
renderer.domElement.addEventListener('pointerdown', e => {
  pDown = { x: e.clientX, y: e.clientY };
  pStart = { x: e.clientX, y: e.clientY, t: performance.now() };
});
addEventListener('pointermove', e => {
  if (!pDown) return;
  dragYaw   -= (e.clientX - pDown.x) * .0042;
  dragPitch -= (e.clientY - pDown.y) * .0042;
  dragPitch = THREE.MathUtils.clamp(dragPitch, -1.2, 1.2);
  pDown = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', e => {
  if (pStart && performance.now() - pStart.t < 500
      && Math.hypot(e.clientX - pStart.x, e.clientY - pStart.y) < 8) {
    placeCrowd(e.clientX, e.clientY);
  }
  pDown = null; pStart = null;
});

// ── 탭 앵커링: 탭한 화면 지점 → 바닥 평면(y=0) 교차점으로 군중을 옮긴다 ──
const _ray = new THREE.Raycaster();
const _ndc = new THREE.Vector2();
const hintEl = document.getElementById('hint');
function placeCrowd(cx, cy){
  if (renderer.xr.isPresenting) return;          // XR에서는 히트테스트 셀렉트로
  _ndc.set(cx/innerWidth*2 - 1, -(cy/innerHeight)*2 + 1);
  _ray.setFromCamera(_ndc, camera);
  const d = _ray.ray.direction;
  if (d.y > -.04) return;                        // 바닥을 향해 탭했을 때만
  const t = (0 - _ray.ray.origin.y) / d.y;
  if (t <= 0 || t > 40) return;
  const p = _ray.ray.origin.clone().addScaledVector(d, t);
  crowd.position.set(p.x, 0, p.z);
  hintEl.style.display = 'none';
}

// ── WebXR immersive-ar (지원 기기: 실제 평면 인식 + 히트테스트) ──
const xrBtn = document.getElementById('xrBtn');
let hitTestSource = null;
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(.14, .18, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color: 0xf2efe8, transparent: true, opacity: .9 }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (ok) xrBtn.style.display = 'block';
  }).catch(() => {});
}
xrBtn.onclick = async () => {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.body },
    });
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    video.style.display = 'none';
    backdrop.style.display = 'none';
    const viewerSpace = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    session.addEventListener('select', () => {
      if (reticle.visible) {
        crowd.position.setFromMatrixPosition(reticle.matrix);
        hintEl.style.display = 'none';
      }
    });
    session.addEventListener('end', () => {
      hitTestSource = null;
      renderer.xr.enabled = false;
      reticle.visible = false;
      if (usingCam) video.style.display = 'block'; else backdrop.style.display = 'block';
    });
    hintEl.textContent = '바닥의 흰 링을 겨누고 탭하면 그 자리에 사람들이 내려섭니다';
    hintEl.style.display = 'block';
  } catch(e) {}
};

const gyroQ = new THREE.Quaternion();
const yawQ = new THREE.Quaternion();
function updateCamera(){
  if (gyro) {
    const orient = (screen.orientation?.angle ?? window.orientation ?? 0) * D2R;
    euler.set(gyro.beta*D2R, gyro.alpha*D2R, -gyro.gamma*D2R, 'YXZ');
    gyroQ.setFromEuler(euler);
    gyroQ.multiply(q1);
    gyroQ.multiply(q0.setFromAxisAngle(zee, -orient));
    yawQ.setFromAxisAngle(new THREE.Vector3(0,1,0), dragYaw);
    camera.quaternion.copy(yawQ).multiply(gyroQ);
  } else {
    camera.rotation.set(0, 0, 0, 'YXZ');
    camera.rotation.y = dragYaw;
    camera.rotation.x = dragPitch;
  }
}

// ══════════ 모델 로드 ══════════
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://unpkg.com/three@0.147.0/examples/jsm/libs/draco/');
loader.setDRACOLoader(draco);
const startBtn = document.getElementById('start');
const assets = {};      // name → {scene, clips}
let props = {};         // tophat/parasol scenes

function loadGLB(url){
  return new Promise((res, rej) => loader.load(url, res, undefined, rej));
}

async function loadAll(){
  const names = Object.keys(MODEL_DEFS);
  const total = names.length + 2;
  let done = 0;
  const tick = () => { startBtn.textContent = `시대의 사람들을 불러오는 중 · ${++done}/${total}`; };
  for (const n of names) {
    const g = await loadGLB(MODEL_DEFS[n].url);
    assets[n] = { scene: g.scene, clips: g.animations };
    tick();
  }
  props.tophat = (await loadGLB('models/era/tophat.glb')).scene; tick(); tick();
}

function findClip(clips, re){
  return clips.find(c => re.test(c.name));
}
function findBone(root, re){
  let out = null;
  root.traverse(o => { if (!out && o.isBone && re.test(o.name)) out = o; });
  return out;
}
const _ws = new THREE.Vector3();
function attachProp(root, boneRe, propScene, worldSize, dy, dz){
  const bone = findBone(root, boneRe);
  if (!bone) return;
  const prop = propScene.clone(true);
  const box = new THREE.Box3().setFromObject(prop);
  const size = box.getSize(new THREE.Vector3());
  const native = Math.max(size.x, size.z) || 1;
  bone.updateWorldMatrix(true, false);
  bone.getWorldScale(_ws);
  const bs = _ws.x || 1;
  prop.scale.setScalar(worldSize / native / bs);
  prop.position.set(0, dy / bs, (dz || 0) / bs);
  prop.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  bone.add(prop);
}

// 절차 생성 파라솔 — 크림 캐노피 + 프릴 + 나무 폴
function makeParasol(){
  const g = new THREE.Group();
  const cream = new THREE.MeshStandardMaterial({ color: 0xe8ddc8, roughness: .8, side: THREE.DoubleSide });
  const rose  = new THREE.MeshStandardMaterial({ color: 0xc9a29a, roughness: .8 });
  const wood  = new THREE.MeshStandardMaterial({ color: 0x6b4a34, roughness: .9 });
  const canopy = new THREE.Mesh(new THREE.ConeGeometry(.4, .2, 14, 1, true), cream);
  canopy.position.y = .46;
  g.add(canopy);
  const frill = new THREE.Mesh(new THREE.TorusGeometry(.395, .018, 8, 28), rose);
  frill.rotation.x = Math.PI/2; frill.position.y = .375;
  g.add(frill);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.032, 8, 8), wood);
  tip.position.y = .6; g.add(tip);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.013, .013, 1.1, 8), wood);
  g.add(pole);
  return g;   // 폴 축 = +Y (그립 -.55 … 꼭지 +.6)
}
function attachParasol(root){
  const bone = findBone(root, /spine|chest|torso/i) || findBone(root, /neck/i);
  if (!bone) return;
  bone.updateWorldMatrix(true, false);
  bone.getWorldScale(_ws);
  const bs = _ws.x || 1;
  const p = makeParasol();
  p.scale.setScalar(1/bs);
  // 본 축이 리그마다 제각각이므로: 본 월드 회전을 역보정해 파라솔을 월드 수직으로 세운 뒤 살짝 기울임
  const bq = new THREE.Quaternion();
  bone.getWorldQuaternion(bq);
  const tilt = new THREE.Quaternion().setFromEuler(new THREE.Euler(-.22, 0, -.3));
  p.quaternion.copy(bq.invert()).multiply(tilt);
  // 위치도 월드 기준(오른어깨 위·뒤)으로 잡고 본 로컬로 환산
  const wp = new THREE.Vector3();
  bone.getWorldPosition(wp);
  wp.add(new THREE.Vector3(.2, .42, -.08));
  p.position.copy(bone.worldToLocal(wp));
  p.traverse(o => { if (o.isMesh) o.castShadow = true; });
  window.__parasols = (window.__parasols || []).concat(p);
  bone.add(p);
}

// ══════════ 걷는 사람들 ══════════
const walkers = [];
const clock = new THREE.Clock();

function spawnWalker(name){
  const def = MODEL_DEFS[name];
  const src = assets[name];
  const obj = SkeletonUtils.clone(src.scene);
  // 무기·받침대 등 캐릭터 외 메쉬 제거 (bbox 계산 전에)
  {
    const trash = [];
    obj.traverse(o => {
      if (!o.isMesh && !o.isSkinnedMesh) return;
      if (def.hide && def.hide.test(o.name)) { trash.push(o); return; }
      if (!o.isSkinnedMesh) {           // 모델에 딸려온 바닥판 제거
        o.geometry.computeBoundingBox();
        const sz = o.geometry.boundingBox.getSize(new THREE.Vector3());
        if (sz.y < .06 * Math.max(sz.x, sz.z) && Math.max(sz.x, sz.z) > 1.2) trash.push(o);
      }
    });
    trash.forEach(o => o.removeFromParent());
  }
  // 키 정규화 — 스킨드 메쉬는 지오메트리 bbox가 본 스케일을 무시하므로
  // 본(뼈대) 월드 Y 범위로 키를 잰다 (본 없으면 bbox 폴백)
  obj.updateMatrixWorld(true);
  let minY = Infinity, maxY = -Infinity, boneN = 0;
  const _bp = new THREE.Vector3();
  obj.traverse(o => {
    if (o.isBone) {
      o.getWorldPosition(_bp);
      minY = Math.min(minY, _bp.y); maxY = Math.max(maxY, _bp.y);
      boneN++;
    }
  });
  let h;
  if (boneN > 3 && maxY - minY > .01) {
    h = (maxY - minY) * 1.18;          // 관절 밖 머리·발 여유
  } else {
    const box = new THREE.Box3().setFromObject(obj);
    h = box.getSize(new THREE.Vector3()).y || 1;
  }
  const s = rnd(1.6, 1.76) / h;
  const root = new THREE.Group();
  obj.scale.setScalar(s);
  obj.traverse(o => { if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.frustumCulled = false; } });
  root.add(obj);

  if (def.hat) attachProp(obj, /head/i, props.tophat, .34 * s / (s || 1) * 1, .22, .02);
  if (def.parasol) attachParasol(obj);

  const mixer = new THREE.AnimationMixer(obj);
  const clip = (def.clip && findClip(src.clips, def.clip))
    || findClip(src.clips, /walk(?!.*back)/i) || src.clips[0];
  const act = mixer.clipAction(clip);
  act.play();
  mixer.update(Math.random()*2);      // 위상 어긋나게

  const mode = def.mode || 'walk';
  for (let tryN = 0; tryN < 24; tryN++) {
    const a0 = Math.random()*Math.PI*2;
    const d0 = mode === 'walk' ? rnd(2.6, 8.5) : rnd(2.4, 6.5);
    root.position.set(Math.cos(a0)*d0, 0, Math.sin(a0)*d0);
    if (walkers.every(o => o.root.position.distanceTo(root.position) > 1.8)) break;
  }
  if (mode !== 'walk') root.rotation.y = Math.random()*Math.PI*2;
  crowd.add(root);
  const w = {
    root, mixer, mode,
    speed: mode === 'amble' ? rnd(.16, .24) : rnd(.55, .95),
    target: new THREE.Vector3(),
    pause: 0,
  };
  pickTarget(w);
  walkers.push(w);
}

function pickTarget(w){
  const a = Math.random()*Math.PI*2, d = rnd(2.4, 9);
  w.target.set(Math.cos(a)*d, 0, Math.sin(a)*d);
}

const _dir = new THREE.Vector3();
function updateWalkers(dt){
  for (const w of walkers) {
    if (w.mode === 'stand' || w.mode === 'dance') { w.mixer.update(dt); continue; }
    w.mixer.update(w.mode === 'amble' ? dt : dt * w.speed / .75);
    if (w.pause > 0) { w.pause -= dt; continue; }
    _dir.subVectors(w.target, w.root.position); _dir.y = 0;
    const dist = _dir.length();
    if (dist < .35) {
      if (Math.random() < .3) w.pause = rnd(.8, 2.4);
      pickTarget(w);
      continue;
    }
    _dir.normalize();
    const want = Math.atan2(_dir.x, _dir.z);
    let dyaw = want - w.root.rotation.y;
    while (dyaw > Math.PI) dyaw -= Math.PI*2;
    while (dyaw < -Math.PI) dyaw += Math.PI*2;
    w.root.rotation.y += THREE.MathUtils.clamp(dyaw, -2.2*dt, 2.2*dt);
    if (Math.abs(dyaw) < 1.1) {
      w.root.position.x += Math.sin(w.root.rotation.y) * w.speed * dt;
      w.root.position.z += Math.cos(w.root.rotation.y) * w.speed * dt;
    }
  }
}

function clearWalkers(){
  for (const w of walkers) crowd.remove(w.root);
  walkers.length = 0;
}

function buildCast(){
  clearWalkers();
  for (const n of SCENE.cast) spawnWalker(n);
}

// ══════════ 장면 적용 ══════════
const capEl = document.getElementById('caption');
function applyScene(){
  capEl.textContent = SCENE.caption;
  video.style.filter = SCENE.filter;
  backdrop.style.filter = SCENE.filter;
  buildCast();
}
capEl.textContent = SCENE.caption;

// ══════════ 사진 ══════════
document.getElementById('shot').onclick = () => {
  const W = renderer.domElement.width, H = renderer.domElement.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.filter = SCENE.filter;
  const src = usingCam ? video : backdrop;
  const sw = usingCam ? video.videoWidth : backdrop.width;
  const sh = usingCam ? video.videoHeight : backdrop.height;
  if (sw && sh) {
    const sc = Math.max(W/sw, H/sh);
    x.drawImage(src, (W - sw*sc)/2, (H - sh*sc)/2, sw*sc, sh*sc);
  } else { x.fillStyle = '#111'; x.fillRect(0,0,W,H); }
  x.filter = 'none';
  x.drawImage(renderer.domElement, 0, 0);
  // 메타 스트립
  const pad = Math.round(W*.03);
  x.fillStyle = 'rgba(20,18,14,.72)';
  x.fillRect(0, H - pad*2.6, W, pad*2.6);
  x.fillStyle = '#f2efe8';
  x.font = `700 ${pad*.78}px "Apple SD Gothic Neo"`;
  x.fillText('변화의 복도 · 모네의 시대의 파리', pad, H - pad*1.5);
  x.fillStyle = 'rgba(242,239,232,.7)';
  x.font = `600 ${pad*.55}px "Apple SD Gothic Neo"`;
  x.fillText('MONET 100 · THE NEXT IMPRESSION', pad, H - pad*.7);
  const a = document.createElement('a');
  a.download = 'monet100_era.png';
  a.href = c.toDataURL('image/png');
  a.click();
};

// ══════════ 시작 ══════════
document.getElementById('start').onclick = async () => {
  startBtn.disabled = true;
  // iOS 자이로 권한 (사용자 제스처 필요)
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      await DeviceOrientationEvent.requestPermission();
    }
  } catch(e) {}
  await openCamera();
  try {
    await loadAll();
  } catch(e) {
    startBtn.textContent = '모델을 불러오지 못했습니다 — 다시 시도';
    startBtn.disabled = false;
    return;
  }
  applyScene();
  document.getElementById('gate').style.display = 'none';
  hintEl.style.display = 'block';
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), .1);
  updateWalkers(dt);
  if (renderer.xr.isPresenting) {
    if (frame && hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        reticle.matrix.fromArray(pose.transform.matrix);
        reticle.visible = true;
      } else reticle.visible = false;
    }
  } else {
    updateCamera();
  }
  renderer.render(scene, camera);
});
</script>
