<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{margin:0;background:#3a3d42}#log{position:fixed;top:6px;left:8px;color:#9f9;font:12px monospace;white-space:pre;z-index:9}</style></head><body>
<div id="log"></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.147.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.147.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const log = m => document.getElementById('log').textContent += m + '\n';
const renderer = new THREE.WebGLRenderer({antialias:true});
document.body.appendChild(renderer.domElement);
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3d42);
const cam = new THREE.PerspectiveCamera(42, 16/9, .1, 100);
cam.position.set(0, 1.25, 4.8); cam.lookAt(0, .9, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777264, 1.05));
const key = new THREE.DirectionalLight(0xfff4e0, .8); key.position.set(3, 6, 4); scene.add(key);
scene.add(new THREE.GridHelper(8, 8, 0x5a5d63, 0x46494f));

const L = new GLTFLoader();
const load = u => new Promise((res, rej) => L.load(u, res, undefined, rej));

// ── 스켈레톤 유틸 ──
const boneMapOf = root => {
  const m = {};
  root.traverse(o => { if (/^mixamorig/.test(o.name)) m[o.name.replace(/^mixamorig/, '')] = o; });
  return m;
};
const bonesOf = root => {
  const b = [];
  root.traverse(o => { if (/^mixamorig/.test(o.name)) b.push(o); });
  return b;
};

// 팔 내리기 — 조각상 포즈에 맞춤 (월드 방향 조준)
function poseArmsDown(byName, spread){
  const sp = spread ?? .24;
  const aim = (bn, cn, dir) => {
    const bone = byName[bn], child = byName[cn];
    if (!bone || !child) return;
    bone.updateWorldMatrix(true, false); child.updateWorldMatrix(true, false);
    const bw = bone.getWorldPosition(new THREE.Vector3());
    const cw = child.getWorldPosition(new THREE.Vector3());
    const cur = cw.sub(bw).normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(cur, dir.clone().normalize());
    const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
    bone.quaternion.premultiply(pq.clone().invert().multiply(q).multiply(pq));
    bone.updateWorldMatrix(true, true);
  };
  aim('LeftArm', 'LeftForeArm', new THREE.Vector3(sp, -.95, .05));
  aim('LeftForeArm', 'LeftHand', new THREE.Vector3(sp*.7, -.97, .1));
  aim('RightArm', 'RightForeArm', new THREE.Vector3(-sp, -.95, .05));
  aim('RightForeArm', 'RightHand', new THREE.Vector3(-sp*.7, -.97, .1));
}

// 가중치용 본 세그먼트 (포즈드 바인드 월드 좌표)
const SEG_DEF = [
  ['Hips','Spine'], ['Spine','Spine1'], ['Spine1','Spine2'], ['Spine2','Neck'], ['Neck','Head'],
  ['LeftShoulder','LeftArm'], ['LeftArm','LeftForeArm'], ['LeftForeArm','LeftHand'], ['LeftHand','LeftHandMiddle1'],
  ['RightShoulder','RightArm'], ['RightArm','RightForeArm'], ['RightForeArm','RightHand'], ['RightHand','RightHandMiddle1'],
  ['LeftUpLeg','LeftLeg'], ['LeftLeg','LeftFoot'], ['LeftFoot','LeftToeBase'],
  ['RightUpLeg','RightLeg'], ['RightLeg','RightFoot'], ['RightFoot','RightToeBase'],
];
function buildSegments(byName, bones){
  const segs = [];
  for (const [a, b] of SEG_DEF) {
    const A = byName[a], B = byName[b];
    if (!A || !B) continue;
    segs.push({
      idx: bones.indexOf(A),
      p0: A.getWorldPosition(new THREE.Vector3()),
      p1: B.getWorldPosition(new THREE.Vector3()),
    });
  }
  // 머리 상단 가상 세그먼트 (모자 커버)
  const H = byName['Head'];
  const hp = H.getWorldPosition(new THREE.Vector3());
  segs.push({ idx: bones.indexOf(H), p0: hp.clone(), p1: hp.clone().add(new THREE.Vector3(0, .4, 0)) });
  return segs;
}
const _ab = new THREE.Vector3(), _ap = new THREE.Vector3(), _cl = new THREE.Vector3();
function distToSeg(p, s){
  _ab.subVectors(s.p1, s.p0);
  _ap.subVectors(p, s.p0);
  const t = THREE.MathUtils.clamp(_ap.dot(_ab) / _ab.lengthSq(), 0, 1);
  _cl.copy(s.p0).addScaledVector(_ab, t);
  return p.distanceTo(_cl);
}

// ── AI 조각 → 스킨드 워커 지오메트리 ──
// template: 포즈드 바인드 상태의 스켈레톤 루트 (월드 갱신 완료)
function skinStatue(aiScene, byName, bones, opts){
  // 1) 통짜 지오메트리 추출 (Z-up 보정 + 월드 베이크)
  let src = null;
  aiScene.traverse(o => { if (!src && o.isMesh) src = o; });
  opts.material = src.material;
  const geo = src.geometry.clone();
  src.updateWorldMatrix(true, false);
  geo.applyMatrix4(src.matrixWorld);
  if (opts.zUp) geo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  geo.computeBoundingBox();
  const bb = geo.boundingBox, size = bb.getSize(new THREE.Vector3());
  // 2) 스켈레톤 치수에 맞춤: 발=0, 키=머리끝*1.06, 중심=힙 축
  const headTop = byName['Head'].getWorldPosition(new THREE.Vector3()).y + .22;
  const s = (headTop * (opts.hScale || 1.04)) / size.y;
  const hips = byName['Hips'].getWorldPosition(new THREE.Vector3());
  const cx = (bb.min.x + bb.max.x)/2, cz = (bb.min.z + bb.max.z)/2;
  geo.translate(-cx, -bb.min.y, -cz);
  geo.scale(s, s, s);
  geo.translate(hips.x, 0, hips.z);
  // 3) 정점별 가중치
  const segs = buildSegments(byName, bones);
  const hipsY = hips.y;
  const pos = geo.attributes.position;
  const n = pos.count;
  const si = new Uint16Array(n*4), sw = new Float32Array(n*4);
  const p = new THREE.Vector3();
  const hipsIdx = bones.indexOf(byName['Hips']);
  for (let i = 0; i < n; i++) {
    p.set(pos.getX(i), pos.getY(i), pos.getZ(i));
    if (opts.gown && p.y < hipsY - .04) {   // 가운: 힙 고정 (찢어짐 방지)
      si[i*4] = hipsIdx; sw[i*4] = 1;
      continue;
    }
    let b1 = -1, d1 = 1e9, b2 = -1, d2 = 1e9;
    for (const sg of segs) {
      const d = distToSeg(p, sg);
      if (d < d1) { b2 = b1; d2 = d1; b1 = sg.idx; d1 = d; }
      else if (d < d2) { b2 = sg.idx; d2 = d; }
    }
    if (b2 < 0 || d2 > d1 * 1.7) { si[i*4] = b1; sw[i*4] = 1; }
    else {
      const w1 = 1/Math.pow(d1 + 1e-4, 3), w2 = 1/Math.pow(d2 + 1e-4, 3);
      const t = w1/(w1 + w2);
      si[i*4] = b1; sw[i*4] = t;
      si[i*4+1] = b2; sw[i*4+1] = 1 - t;
    }
  }
  geo.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
  geo.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
  return geo;
}

const mixers = [];
const RIGS = [];   // {name, root, inst, byName, bones, mesh, ai}
window.__DIRS = {
  mgent:   { L1:[.45,-.88,.05], L2:[.3,-.95,.1], R1:[-.45,-.88,.05], R2:[-.3,-.95,.1] },
  mlady:   { L1:[.45,-.88,.05], L2:[.3,-.95,.1], R1:[-.45,-.88,.05], R2:[-.3,-.95,.1] },
  mporter: { L1:[.45,-.88,.05], L2:[.3,-.95,.1], R1:[-.45,-.88,.05], R2:[-.3,-.95,.1] },
};
function poseArms4(byName, D){
  const aim = (bn, cn, arr) => {
    const dir = new THREE.Vector3(...arr);
    const bone = byName[bn], child = byName[cn];
    bone.updateWorldMatrix(true, false); child.updateWorldMatrix(true, false);
    const bw = bone.getWorldPosition(new THREE.Vector3());
    const cw = child.getWorldPosition(new THREE.Vector3());
    const cur = cw.sub(bw).normalize();
    const q = new THREE.Quaternion().setFromUnitVectors(cur, dir.clone().normalize());
    const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
    bone.quaternion.premultiply(pq.clone().invert().multiply(q).multiply(pq));
    bone.updateWorldMatrix(true, true);
  };
  aim('LeftArm', 'LeftForeArm', D.L1);
  aim('LeftForeArm', 'LeftHand', D.L2);
  aim('RightArm', 'RightForeArm', D.R1);
  aim('RightForeArm', 'RightHand', D.R2);
}

(async () => {
  try {
    const gm = await load('assets/walk_m.glb');
    const walkM = gm.animations[0];
    const template = gm.scene;
    const NAMES = ['mgent', 'mlady', 'mporter'];
    let x = -1.9;
    for (const name of NAMES) {
      const ai = await load('assets/ai/' + name + '.glb');
      const inst = template.clone(true);
      inst.updateMatrixWorld(true);
      const byName = boneMapOf(inst), bones = bonesOf(inst);
      // 지오메트리를 스켈레톤 치수에 정렬만 (스킨 없이 원본 표시)
      let src = null;
      ai.scene.traverse(o => { if (!src && o.isMesh) src = o; });
      const geo = src.geometry.clone();
      src.updateWorldMatrix(true, false);
      geo.applyMatrix4(src.matrixWorld);
      geo.computeBoundingBox();
      const bb = geo.boundingBox, size = bb.getSize(new THREE.Vector3());
      const headTop = byName['Head'].getWorldPosition(new THREE.Vector3()).y + .22;
      const s = (headTop * 1.04) / size.y;
      const hips = byName['Hips'].getWorldPosition(new THREE.Vector3());
      geo.translate(-(bb.min.x+bb.max.x)/2, -bb.min.y, -(bb.min.z+bb.max.z)/2);
      geo.scale(s, s, s);
      geo.translate(hips.x, 0, hips.z);
      const mat = src.material.clone();
      mat.transparent = true; mat.opacity = .55; mat.depthWrite = false;
      const mesh = new THREE.Mesh(geo, mat);
      const root = new THREE.Group();
      root.add(inst); root.add(mesh);
      const sk = new THREE.SkeletonHelper(inst);
      sk.material.linewidth = 2;
      root.add(sk);
      root.position.x = x; x += 1.9;
      scene.add(root);
      RIGS.push({ name, byName, bones, inst, geo });
      window.__RIGS = RIGS;
      log(name + ' loaded');
    }
    window.__apply = () => {
      for (const r of RIGS) {
        // 리셋: 템플릿 포즈로 복원 후 재조준
        r.inst.traverse(o => { if (o.__q0) o.quaternion.copy(o.__q0); });
        if (!r.inst.__saved) {
          r.inst.traverse(o => { o.__q0 = o.quaternion.clone(); });
          r.inst.__saved = true;
        } else {
          r.inst.traverse(o => { if (o.__q0) o.quaternion.copy(o.__q0); });
        }
        r.inst.updateMatrixWorld(true);
        poseArms4(r.byName, window.__DIRS[r.name]);
      }
      renderer.render(scene, cam);
      return 'applied';
    };
    // 최초 저장 + 적용
    RIGS.forEach(r => { r.inst.traverse(o => { o.__q0 = o.quaternion.clone(); }); r.inst.__saved = true; });
    window.__apply();
    window.__ready = true;
  } catch(e) { log('FAIL ' + e.message); }
})();

const clock = new THREE.Clock();
const fit = () => { const w = innerWidth||1600, h = innerHeight||900; renderer.setSize(w, h); cam.aspect = w/h; cam.updateProjectionMatrix(); };
fit(); addEventListener('resize', fit); setTimeout(fit, 400);
renderer.setAnimationLoop(() => renderer.render(scene, cam));
window.__frame = () => { fit(); renderer.render(scene, cam); return RIGS.length; };
</script></body></html>
