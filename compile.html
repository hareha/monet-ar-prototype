<!DOCTYPE html>
<meta charset="utf-8">
<title>compiling…</title>
<script type="module">
import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';
const log = m => { console.log(m); fetch('/log?m=' + encodeURIComponent(m)).catch(()=>{}); };
try {
  log('start');
  const img = new Image();
  img.src = 'target.jpg';
  await img.decode();
  log('image ' + img.width + 'x' + img.height);
  const compiler = new Compiler();
  await compiler.compileImageTargets([img], p => log('progress ' + p.toFixed(1)));
  const buffer = await compiler.exportData();
  log('compiled bytes=' + buffer.byteLength);
  await fetch('/save-mind', { method: 'POST', body: buffer });
  log('SAVED');
  document.title = 'DONE';
} catch (e) {
  log('ERROR ' + (e && e.message || e));
  document.title = 'FAIL';
}
</script>
