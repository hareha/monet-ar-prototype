<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>다음 시대의 수련 연못</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#04100e;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #view{position:fixed;inset:0;}
  a.home{position:fixed;top:14px;left:14px;z-index:6;font-size:12.5px;color:#cfe0d6;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .cap{position:fixed;top:14px;right:14px;z-index:6;font-size:10px;letter-spacing:.24em;color:rgba(220,235,225,.5);font-weight:700;}
  #q{position:fixed;top:44px;left:0;right:0;z-index:5;text-align:center;color:#e9f2ea;font-size:15px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.02em;}
  #q small{display:block;font-size:11px;color:#9db8a8;font-weight:400;margin-top:4px;}

  #ui{position:fixed;left:12px;right:12px;bottom:14px;z-index:6;max-width:500px;margin:0 auto;
    background:rgba(6,20,17,.85);border:1px solid rgba(160,200,175,.25);border-radius:10px;padding:12px;backdrop-filter:blur(8px);}
  #ui .row{display:flex;gap:8px;}
  #txt{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(160,200,175,.3);border-radius:6px;color:#e9f2ea;
    font-size:14px;font-family:inherit;padding:12px;outline:none;}
  #txt::placeholder{color:#7d9a8a;}
  #send{background:#c9a961;color:#1c1a16;border:0;border-radius:6px;padding:0 20px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;}
  #send:active{transform:translateY(2px);}
  .n{font-size:10px;color:#7d9a8a;text-align:center;margin-top:7px;}
</style>
</head>
<body>
<div id="view"></div>
<a class="home" href="index.html">← 홈</a>
<div class="cap">미시아 살롱 · 출구</div>
<div id="q">당신은 지금, 어디에서 다음 시대를 감각하고 있나요?<small>당신의 한 줄이 수련잎이 되어 연못에 떠오릅니다</small></div>

<div id="ui">
  <div class="row">
    <input id="txt" maxlength="46" placeholder="한 줄로 적어 주세요">
    <button id="send">띄우기</button>
  </div>
  <p class="n" id="count"></p>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04100e);
scene.fog = new THREE.FogExp2(0x04100e, .045);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 5.6, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .6, 0);
controls.maxPolarAngle = Math.PI * .46;
controls.minPolarAngle = Math.PI * .2;
controls.minDistance = 6; controls.maxDistance = 15;
controls.enablePan = false;
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = .25;

// ── 조명 ──
scene.add(new THREE.AmbientLight(0x2a4a3e, .8));
const l1 = new THREE.PointLight(0xc9a961, 1.0, 24, 1.7); l1.position.set(-5, 5, -3); scene.add(l1);
const l2 = new THREE.PointLight(0x7fc8a8, .6, 22, 1.9); l2.position.set(6, 4, 4); scene.add(l2);
const moon = new THREE.DirectionalLight(0x9db4d8, .35); moon.position.set(2, 8, -4); scene.add(moon);

// ── 수면 ──
const waterGeo = new THREE.PlaneGeometry(50, 50, 90, 90);
const water = new THREE.Mesh(waterGeo,
  new THREE.MeshPhongMaterial({ color: 0x0c2f28, specular: 0x88ffd8, shininess: 90, side: THREE.DoubleSide }));
water.rotation.x = -Math.PI/2;
scene.add(water);
const wpos = waterGeo.attributes.position;
const wbase = Float32Array.from(wpos.array);
function waves(t){
  for (let i = 0; i < wpos.count; i++) {
    const x = wbase[i*3], y = wbase[i*3+1];
    wpos.setZ(i, Math.sin(x*.7 + t*.9)*.05 + Math.cos(y*.55 + t*.7)*.05 + Math.sin((x+y)*.3 + t*.4)*.035);
  }
  wpos.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

// ── 수련잎 (민잎 — 글자는 빌보드 카드로 분리) ──
function leafTexture(gold){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(100, 95, 20, 128, 128, 150);
  g.addColorStop(0, gold ? '#5d9a72' : '#3f7a5c');
  g.addColorStop(.75, gold ? '#356b4c' : '#28563f');
  g.addColorStop(1, gold ? '#2a5a3e' : '#1e4632');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = 'rgba(255,255,255,.09)'; x.lineWidth = 2;
  for (let a = 0; a < 14; a++) {
    x.beginPath(); x.moveTo(128, 128);
    x.lineTo(128 + Math.cos(a/14*6.28)*130, 128 + Math.sin(a/14*6.28)*130);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// 문구 카드 (스프라이트 = 항상 정면)
function textSprite(text, gold){
  const c = document.createElement('canvas'); c.width = 640; c.height = 300;
  const x = c.getContext('2d');
  const r = 34, W = 620, H = 0;
  // 줄바꿈
  x.font = '600 44px "Apple SD Gothic Neo", sans-serif';
  const words = text.split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    if (x.measureText((line + ' ' + w).trim()).width > 520) { lines.push(line.trim()); line = w; }
    else line += ' ' + w;
  }
  if (line.trim()) lines.push(line.trim());
  const shown = lines.slice(0, 3);
  const cardH = 60 + shown.length * 58;
  const y0 = (300 - cardH) / 2;
  // 카드
  x.fillStyle = 'rgba(8,26,22,.86)';
  x.strokeStyle = gold ? '#c9a961' : 'rgba(160,200,175,.4)';
  x.lineWidth = gold ? 6 : 3;
  x.beginPath();
  x.roundRect(10, y0, W, cardH, r);
  x.fill(); x.stroke();
  // 텍스트
  x.fillStyle = '#eef6ec';
  x.textAlign = 'center';
  shown.forEach((ln, i) => x.fillText(ln, 320, y0 + 58 + i*58));
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  sp.scale.set(3.0, 3.0 * 300/640, 1);
  return sp;
}

// ── 겹침 없는 배치 ──
const placed = [];
function findSpot(prefAng, prefDist){
  const MIN = 2.7;
  for (let tryN = 0; tryN < 60; tryN++) {
    let ang, dist;
    if (prefAng != null && tryN < 20) {
      ang = prefAng + (Math.random()-.5) * (0.5 + tryN*.12);
      dist = (prefDist ?? 4) + tryN * .28;
    } else {
      ang = Math.random()*Math.PI*2;
      dist = 2.5 + Math.random()*8.5;
    }
    const px = Math.cos(ang)*dist, pz = Math.sin(ang)*dist;
    if (placed.every(q => Math.hypot(q.x-px, q.z-pz) >= MIN)) {
      placed.push({x:px, z:pz});
      return {px, pz};
    }
  }
  const ang = Math.random()*Math.PI*2, dist = 9 + Math.random()*3;
  const px = Math.cos(ang)*dist, pz = Math.sin(ang)*dist;
  placed.push({x:px, z:pz});
  return {px, pz};
}

const leaves = [];
function addLeaf(text, opts = {}){
  const gold = !!opts.gold;
  const r = 1.0 + Math.random()*.3;
  const shape = new THREE.Shape();
  const notch = .5;
  shape.absarc(0, 0, r, notch/2, Math.PI*2 - notch/2, false);
  shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: .05, bevelEnabled: false });
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i)/r + 1)/2, (uv.getY(i)/r + 1)/2);
  const m = new THREE.Mesh(geo, [
    new THREE.MeshStandardMaterial({ map: leafTexture(gold), roughness: .75 }),
    new THREE.MeshStandardMaterial({ color: 0x1e4632, roughness: .9 }),
  ]);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.random()*Math.PI*2;
  const { px, pz } = findSpot(opts.ang, opts.dist);
  m.position.set(px, .07, pz);
  scene.add(m);
  if (gold) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r + .1, .035, 10, 60),
      new THREE.MeshBasicMaterial({ color: 0xc9a961 }));
    ring.position.set(0, 0, .06);
    m.add(ring);
  }
  const sp = textSprite(text, gold);
  sp.position.set(px, 1.15, pz);
  scene.add(sp);
  leaves.push({ m, sp, phase: Math.random()*6.28, spin: (Math.random()-.5)*.001 });
  return { m, sp };
}

// ── 데이터 ──
const SEED = [
  '아이의 그림일기에서',
  '퇴근길, 모두가 이어폰 속 AI와 대화할 때',
  '새벽 편의점을 정리하는 로봇',
  '할머니의 유튜브 프랑스어 수업',
  '내가 만든 게임을 세계에 파는 중학생',
  '전기차 소리 없는 골목',
];
let saved = JSON.parse(localStorage.getItem('m100_pond') || 'null') || SEED;
saved.slice(-18).forEach(t => addLeaf(t));

const countEl = document.getElementById('count');
const updateCount = () => countEl.textContent = saved.length + '번째 잎까지 떠 있습니다 · 90일간 이 연못에 남습니다';
updateCount();

let lastGold = null;
document.getElementById('send').onclick = () => {
  const txt = document.getElementById('txt');
  const v = txt.value.trim();
  if (!v) return;
  saved.push(v);
  localStorage.setItem('m100_pond', JSON.stringify(saved.slice(-100)));
  if (lastGold) {
    const ring = lastGold.m.children[0];
    if (ring) lastGold.m.remove(ring);
    lastGold.sp.material.map = textSprite(lastGold.text, false).material.map;
  }
  const camAng = Math.atan2(camera.position.z, camera.position.x);
  lastGold = addLeaf(v, { gold: true, ang: camAng, dist: 4.2 });
  lastGold.text = v;
  txt.value = '';
  txt.blur();
  updateCount();
};
document.getElementById('txt').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('send').click(); });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  waves(t);
  for (const L of leaves) {
    const y = .07 + Math.sin(t*.8 + L.phase)*.04;
    L.m.position.y = y;
    L.m.rotation.z += L.spin;
    L.sp.position.y = y + 1.05 + Math.sin(t*.8 + L.phase)*.02;
    // 멀수록 카드 살짝 축소·페이드
    const d = camera.position.distanceTo(L.sp.position);
    const s = THREE.MathUtils.clamp(3.4 - d*.09, 1.6, 3.0);
    L.sp.scale.set(s, s*300/640, 1);
    L.sp.material.opacity = THREE.MathUtils.clamp(1.35 - d*.055, .25, 1);
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
