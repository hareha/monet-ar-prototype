<!DOCTYPE html>
<html lang="ko">

<title>다음 시대의 수련 연못</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0a1d18;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #view{position:fixed;inset:0;}
  a.home{position:fixed;top:14px;left:14px;z-index:6;font-size:12.5px;color:#dcebe0;text-decoration:none;text-shadow:0 1px 4px rgba(0,0,0,.8);}
  .cap{position:fixed;top:14px;right:14px;z-index:6;font-size:10px;letter-spacing:.24em;color:rgba(230,240,230,.55);font-weight:700;}
  #q{position:fixed;top:44px;left:0;right:0;z-index:5;text-align:center;color:#f2f6ee;font-size:15px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.7);letter-spacing:.02em;}
  #q small{display:block;font-size:11px;color:#b9cbb4;font-weight:400;margin-top:4px;}

  #ui{position:fixed;left:12px;right:12px;bottom:14px;z-index:6;max-width:500px;margin:0 auto;

  #send{background:#d8b978;color:#231d10;border:0;border-radius:6px;padding:0 20px;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById('view').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1d18);
scene.fog = new THREE.FogExp2(0x0d241d, .028);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 100);
camera.position.set(0, innerWidth < innerHeight ? 8.0 : 5.8, innerWidth < innerHeight ? 13.5 : 10.5);

// 블룸 (등불·수면 하이라이트 번짐)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .28, .6, .88);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .6, 0);
controls.maxPolarAngle = Math.PI * .46;
controls.minPolarAngle = Math.PI * .2;
controls.minDistance = 6; controls.maxDistance = 17;
controls.enablePan = false;
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = .22;

// ── 조명: 등불 + 달 ──
scene.add(new THREE.AmbientLight(0x3a5c4a, .62));
const l3 = new THREE.PointLight(0xd8c890, .5, 16, 1.7); l3.position.set(0, 4.6, -10.5); scene.add(l3);
const l1 = new THREE.PointLight(0xd8b978, .9, 26, 1.6); l1.position.set(-6, 6.5, -4); scene.add(l1);
const l2 = new THREE.PointLight(0x8fd0b0, .55, 24, 1.8); l2.position.set(7, 5.5, 5); scene.add(l2);
const moon = new THREE.DirectionalLight(0xa8bede, .5); moon.position.set(2, 9, -5); scene.add(moon);

const rnd = (a,b) => a + Math.random()*(b-a);

// ══════════ 수면: 모네 팔레트의 붓질 텍스처 ══════════
function paintWater(){
  const c = document.createElement('canvas'); c.width = 2048; c.height = 2048;
  const x = c.getContext('2d');
  x.fillStyle = '#16382e'; x.fillRect(0, 0, 2048, 2048);
  // 하늘 반영 — 큰 파스텔 무리 (장밋빛·연보라·크림·물빛)
  const patches = [
    ['#e3b7c9', .22], ['#c6d3e4', .18], ['#efe6c9', .16], ['#9fb9d8', .16],
    ['#b39ac6', .14], ['#f2d9c9', .13], ['#8fb3a8', .13],
  ];
  const patchPts = [];
  for (let i = 0; i < 42; i++) {
    const [col, al] = patches[i % patches.length];
    const px = Math.random()*2048, py = Math.random()*2048, rr = rnd(130, 460);
    const g = x.createRadialGradient(px, py, rr*.12, px, py, rr);
    g.addColorStop(0, col + Math.round(al*255).toString(16).padStart(2,'0'));
    g.addColorStop(1, col + '00');
    x.fillStyle = g;
    x.fillRect(px-rr, py-rr, rr*2, rr*2);
    patchPts.push([px, py, rr]);
  }
  // 깊은 물 — 어두운 침전 획 (수심의 무게)
  for (let i = 0; i < 900; i++) {
    x.strokeStyle = `rgba(${(10+rnd(0,14))|0}, ${(38+rnd(0,20))|0}, ${(28+rnd(0,14))|0}, ${rnd(.15,.4)})`;
    x.lineWidth = rnd(6, 16);
    x.lineCap = 'round';
    const px = Math.random()*2048, py = Math.random()*2048, len = rnd(30, 110);
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + len, py + rnd(-4, 4)); x.stroke();
  }
  // 수면 붓질 — 수평 단필 (모네의 물결 터치)
  const dabs = ['#2e6b58','#3f7d4f','#1d4a3a','#57906b','#d9aebc','#e8e0c4','#9db8d8','#7f95c8','#8a7fae','#c78e9e','#e3c9d6','#6f9a82'];
  for (let i = 0; i < 6800; i++) {
    const col = dabs[(Math.random()*dabs.length)|0];
    x.strokeStyle = col + Math.round(rnd(28, 110)).toString(16).padStart(2,'0');
    x.lineWidth = rnd(5, 14);
    x.lineCap = 'round';
    const px = Math.random()*2048, py = Math.random()*2048, len = rnd(24, 90);
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + len*.5, py + rnd(-4,4), px + len, py + rnd(-3,3));
    x.stroke();
  }
  // 하늘 조각 위 반짝임 — 밝은 크림 단필
  for (const [cx0, cy0, rr] of patchPts) {
    const n = (rr/24)|0;
    for (let i = 0; i < n; i++) {
      x.strokeStyle = `rgba(246,240,216,${rnd(.16,.45).toFixed(2)})`;
      x.lineWidth = rnd(3, 8);
      x.lineCap = 'round';
      const px = cx0 + rnd(-rr, rr)*.7, py = cy0 + rnd(-rr, rr)*.7, len = rnd(18, 64);
      x.beginPath(); x.moveTo(px, py);
      x.quadraticCurveTo(px + len*.5, py + rnd(-3,3), px + len, py + rnd(-2,2));
      x.stroke();
    }
  }
  // 버드나무 반영 — 세로 긴 획
  for (let i = 0; i < 380; i++) {
    x.strokeStyle = `rgba(${18+((Math.random()*20)|0)}, ${52+((Math.random()*26)|0)}, ${34+((Math.random()*18)|0)}, ${rnd(.12,.3)})`;
    x.lineWidth = rnd(4, 10);
    const px = Math.random()*2048, py = Math.random()*2048, len = rnd(120, 380);
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + rnd(-14,14), py + len*.5, px + rnd(-10,10), py + len);
    x.stroke();
  }
  // 다리 반영 — 초록 아치의 잔영 (다리 z=-13.5 → v .75 → 캔버스 y 512)
  for (let i = 0; i < 300; i++) {
    const px = 1024 + rnd(-285, 285);
    const near = 1 - Math.abs(px - 1024)/300;
    const len = rnd(40, 180 + 260*near);
    x.strokeStyle = `rgba(${(34+rnd(0,26))|0}, ${(86+rnd(0,34))|0}, ${(58+rnd(0,26))|0}, ${rnd(.10,.32)})`;
    x.lineWidth = rnd(5, 13);
    x.lineCap = 'round';
    const py = 500 + rnd(-16, 34);
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + rnd(-12,12), py + len*.5, px + rnd(-16,16), py + len);
    x.stroke();
  }
  // 등꽃 반영 — 연보라 점
  for (let i = 0; i < 120; i++) {
    x.fillStyle = `rgba(${(168+rnd(0,40))|0}, ${(150+rnd(0,30))|0}, ${(200+rnd(0,40))|0}, ${rnd(.06,.18)})`;
    const px = 1024 + rnd(-270, 270), py = 505 + rnd(0, 130);
    x.beginPath(); x.ellipse(px, py, rnd(4,10), rnd(2,5), 0, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
const waterTex = paintWater();
const waterGeo = new THREE.PlaneGeometry(54, 54, 96, 96);
const water = new THREE.Mesh(waterGeo,
  new THREE.MeshPhongMaterial({ map: waterTex, color: 0xcfdccf, specular: 0x1e3a30, shininess: 14 }));
water.rotation.x = -Math.PI/2;
scene.add(water);
const wpos = waterGeo.attributes.position;
const wbase = Float32Array.from(wpos.array);
function waves(t){
  for (let i = 0; i < wpos.count; i++) {
    const x = wbase[i*3], y = wbase[i*3+1];
    wpos.setZ(i, Math.sin(x*.65 + t*.8)*.05 + Math.cos(y*.5 + t*.65)*.05 + Math.sin((x+y)*.28 + t*.4)*.035);
  }
  wpos.needsUpdate = true;
  waterGeo.computeVertexNormals();
}
// 월드 (X,Z)에서의 수면 높이 — waves()와 동일 파형 (평면 로컬 y = -Z)
function waveH(X, Z, t){
  const lx = X, ly = -Z;
  return Math.sin(lx*.65 + t*.8)*.05 + Math.cos(ly*.5 + t*.65)*.05 + Math.sin((lx+ly)*.28 + t*.4)*.035;
}

// ══════════ 일본 다리 (지베르니의 초록 아치 · 등나무 시렁) ══════════
function wisteriaTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const x = c.getContext('2d');
  const cols = ['rgba(203,183,232,', 'rgba(165,143,200,', 'rgba(232,222,244,', 'rgba(140,120,180,'];
  for (let i = 0; i < 120; i++) {
    const t = Math.random();               // 0=위(넓음) 1=아래(뾰족)
    const w = 46 * (1 - t*.85);
    const px = 64 + rnd(-w, w), py = 14 + t*228;
    x.fillStyle = cols[(Math.random()*cols.length)|0] + rnd(.35,.85).toFixed(2) + ')';
    x.beginPath(); x.ellipse(px, py, rnd(4,9), rnd(3,6), rnd(0,3), 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}
const wistTex = wisteriaTexture();

// ── 붓질 빌보드 텍스처 (민무늬 지오메트리 금지 — 전부 점묘/스트로크) ──
const brushMat = tex => new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: .12, depthWrite: true, side: THREE.DoubleSide });
function treeTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const x = c.getContext('2d');
  for (let i = 0; i < 6; i++) {           // 줄기·가지
    x.strokeStyle = `rgba(${(30+rnd(0,14))|0},${(26+rnd(0,10))|0},${(20+rnd(0,8))|0},${rnd(.5,.85)})`;
    x.lineWidth = rnd(6, 14);
    x.lineCap = 'round';
    const bx0 = 256 + rnd(-30, 30);
    x.beginPath(); x.moveTo(bx0, 502);
    x.quadraticCurveTo(bx0 + rnd(-20,20), 380, bx0 + rnd(-55,55), rnd(215, 300));
    x.stroke();
  }
  for (let i = 0; i < 460; i++) {          // 수관 점묘
    const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .6);
    x.fillStyle = `hsla(${rnd(105,145)}, ${rnd(20,36)}%, ${rnd(10,28)}%, ${rnd(.35,.8)})`;
    x.beginPath(); x.ellipse(256 + Math.cos(a)*rr*218, 202 + Math.sin(a)*rr*168, rnd(10,26), rnd(7,16), rnd(0,3), 0, Math.PI*2); x.fill();
  }
  for (let i = 0; i < 70; i++) {           // 빛 받는 자리
    const a = Math.random()*Math.PI*2, rr = Math.pow(Math.random(), .7);
    x.fillStyle = `hsla(${rnd(100,135)}, ${rnd(24,40)}%, ${rnd(30,46)}%, ${rnd(.25,.5)})`;
    x.beginPath(); x.ellipse(256 + Math.cos(a)*rr*196, 182 + Math.sin(a)*rr*146, rnd(6,16), rnd(4,10), rnd(0,3), 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function grassClumpTexture(flowerRGB){
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  for (let i = 0; i < 48; i++) {
    x.strokeStyle = `hsla(${rnd(85,140)}, ${rnd(24,46)}%, ${rnd(16,42)}%, ${rnd(.5,.9)})`;
    x.lineWidth = rnd(2, 4.5);
    x.lineCap = 'round';
    const bx0 = 128 + rnd(-34, 34), tip = 128 + rnd(-95, 95);
    x.beginPath(); x.moveTo(bx0, 252);
    x.quadraticCurveTo(bx0 + (tip-bx0)*.3, 170, tip, rnd(36, 130));
    x.stroke();
  }
  if (flowerRGB) for (let i = 0; i < 9; i++) {
    const px = 128 + rnd(-82, 82), py = rnd(26, 92);
    for (let k = 0; k < 5; k++) {
      const aa = k/5*Math.PI*2 + rnd(-.2,.2);
      x.fillStyle = `rgba(${flowerRGB},${rnd(.55,.95).toFixed(2)})`;
      x.beginPath(); x.ellipse(px + Math.cos(aa)*6.5, py + Math.sin(aa)*6.5, 6.5, 3.8, aa, 0, Math.PI*2); x.fill();
    }
    x.fillStyle = 'rgba(232,194,90,.9)';
    x.beginPath(); x.arc(px, py, 2.6, 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function reedTexture(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const x = c.getContext('2d');
  const tips = [];
  for (let i = 0; i < 15; i++) {
    x.strokeStyle = `hsla(${rnd(65,100)}, ${rnd(24,40)}%, ${rnd(18,38)}%, ${rnd(.55,.9)})`;
    x.lineWidth = rnd(2.5, 5);
    x.lineCap = 'round';
    const bx0 = 128 + rnd(-56, 56), tipx = bx0 + rnd(-40, 40), tipy = rnd(20, 120);
    x.beginPath(); x.moveTo(bx0, 508);
    x.quadraticCurveTo(bx0 + (tipx-bx0)*.4, 300, tipx, tipy);
    x.stroke();
    if (i % 3 === 0) tips.push([tipx, tipy]);
  }
  for (const [tx, ty] of tips) {           // 부들 이삭
    x.fillStyle = `rgba(${(92+rnd(0,20))|0},${(60+rnd(0,14))|0},${(38+rnd(0,10))|0},.92)`;
    x.beginPath(); x.roundRect(tx - 5, ty, 10, rnd(30, 46), 5); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function canopyTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  for (let i = 0; i < 300; i++) {          // 초록 점묘 띠
    const px = rnd(20, 492), py = 118 + rnd(-72, 72);
    const edge = 1 - Math.abs(px - 256)/256;
    x.fillStyle = `hsla(${rnd(100,140)}, ${rnd(22,40)}%, ${rnd(16,34)}%, ${(rnd(.3,.75)*Math.min(1, edge*2.4)).toFixed(2)})`;
    x.beginPath(); x.ellipse(px, py, rnd(9,22), rnd(6,13), rnd(0,3), 0, Math.PI*2); x.fill();
  }
  for (let i = 0; i < 80; i++) {           // 등꽃 라벤더 점
    x.fillStyle = `rgba(${(168+rnd(0,30))|0},${(148+rnd(0,26))|0},${(200+rnd(0,30))|0},${rnd(.3,.6).toFixed(2)})`;
    x.beginPath(); x.ellipse(rnd(30,482), 130 + rnd(-64, 76), rnd(4,9), rnd(3,6), rnd(0,3), 0, Math.PI*2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function barkTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#3a3226'; x.fillRect(0, 0, 128, 256);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(${(40+rnd(0,34))|0},${(34+rnd(0,26))|0},${(24+rnd(0,18))|0},${rnd(.3,.7)})`;
    x.lineWidth = rnd(1.5, 4);
    const px = Math.random()*128, py = Math.random()*256, len = rnd(30, 110);
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + rnd(-5,5), py + len*.5, px + rnd(-4,4), py + len);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 1.5);
  return t;
}
const canopyTexs = [canopyTexture(), canopyTexture(), canopyTexture()];
const treeTexs = [treeTexture(), treeTexture(), treeTexture(), treeTexture()];
const grassClumpTexs = [grassClumpTexture(), grassClumpTexture(), grassClumpTexture()];
const irisTexs = [grassClumpTexture('150,122,190'), grassClumpTexture('166,147,204'), grassClumpTexture('230,224,238')];
const reedTexs = [reedTexture(), reedTexture()];
const barkTex = barkTexture();

function bridge(){
  const g = new THREE.Group();
  const paint  = new THREE.MeshStandardMaterial({ color: 0x2f6b49, roughness: .72 });
  const paintD = new THREE.MeshStandardMaterial({ color: 0x224d36, roughness: .82 });
  const SPAN = 14, RISE = 1.5, W = 1.9;
  const deckY = t => .55 + Math.sin(Math.PI*t)*RISE;

  const arcTube = (dy, r, zs, mat) => {
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const t = i/30;
      pts.push(new THREE.Vector3(-SPAN/2 + SPAN*t, deckY(t) + dy, zs));
    }
    return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 44, r, 8), mat || paint);
  };

  // 상판 — 아치를 따라 걸친 가로 널빤지
  for (let i = 0; i < 46; i++) {
    const t = (i + .5)/46;
    const plank = new THREE.Mesh(new THREE.BoxGeometry(.295, .05, W), paintD);
    plank.position.set(-SPAN/2 + SPAN*t, deckY(t), 0);
    plank.rotation.z = Math.atan(RISE*Math.PI/SPAN*Math.cos(Math.PI*t));
    g.add(plank);
  }
  // 상판 밑 세로 보 2줄
  g.add(arcTube(-.09, .07, -.72, paintD));
  g.add(arcTube(-.09, .07,  .72, paintD));

  // 난간 — 양쪽, 손잡이 + 중간 가로대 + 살
  for (const zs of [-W/2, W/2]) {
    g.add(arcTube(1.02, .05, zs));
    g.add(arcTube(.60, .038, zs));
    for (let i = 0; i <= 20; i++) {
      const t = i/20;
      const b = new THREE.Mesh(new THREE.CylinderGeometry(.026, .026, 1.0, 6), paint);
      b.position.set(-SPAN/2 + SPAN*t, deckY(t) + .52, zs);
      g.add(b);
    }

  for (const zs of [-W/2 - .06, W/2 + .06]) {

  for (let i = 0; i < 30; i++) {

    f.position.set(-SPAN/2 + SPAN*t, deckY(t) + 2.78 + rnd(-.08, .26), rnd(-.9, .9));
    f.rotation.y = rnd(-.6, .6);
    g.add(f);
  }
  // 늘어진 등꽃 송이
  for (let i = 0; i < 30; i++) {

    cl.rotation.y = rnd(0, Math.PI);

  }

  g.position.set(0, 0, -13.5);
  return g;

function padTexture(v){

  t.encoding = THREE.sRGBEncoding;

}
const padTexCache = {};
function getPadTex(v){

function petal(x, ang, len, wid, col){
  x.save(); x.translate(128, 128); x.rotate(ang);
  x.fillStyle = col;
  x.beginPath();
  x.moveTo(14, 0);
  x.quadraticCurveTo(len*.45, -wid, len, 0);
  x.quadraticCurveTo(len*.45, wid, 14, 0);
  x.fill(); x.restore();
}
function flowerTexture(kind){

function makePad(r, v){
  const shape = new THREE.Shape();
  const notch = .5;
  shape.absarc(0, 0, r, notch/2, Math.PI*2 - notch/2, false);
  shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: .04, bevelEnabled: false });
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i)/r + 1)/2, (uv.getY(i)/r + 1)/2);
  const m = new THREE.Mesh(geo, [
    new THREE.MeshStandardMaterial({ map: getPadTex(v), roughness: .7 }),
    new THREE.MeshStandardMaterial({ color: 0x1f4a33, roughness: .9 }),
  ]);
  m.rotation.x = -Math.PI/2;
  m.rotation.z = Math.random()*Math.PI*2;
  m.scale.set(rnd(1.05, 1.35), rnd(.82, 1), 1);   // 타원 (원근 속 모네 패드)
  return m;
}
function makeFlower(s, kind){

}

// 문구 카드 (스프라이트)
function textSprite(text, gold){
  const c = document.createElement('canvas'); c.width = 640; c.height = 300;
  const x = c.getContext('2d');
  x.font = '600 44px "Apple SD Gothic Neo", sans-serif';
  const words = text.split(' ');
  const lines = []; let line = '';
  for (const w of words) {
    if (x.measureText((line + ' ' + w).trim()).width > 520) { lines.push(line.trim()); line = w; }
    else line += ' ' + w;
  }
  if (line.trim()) lines.push(line.trim());
  const shown = lines.slice(0, 3);
  const cardH = 60 + shown.length * 58;
  const y0 = (300 - cardH) / 2;
  x.fillStyle = 'rgba(10,28,22,.84)';
  x.strokeStyle = gold ? '#d8b978' : 'rgba(190,215,185,.45)';
  x.lineWidth = gold ? 6 : 3;
  x.beginPath();
  x.roundRect(10, y0, 620, cardH, 34);
  x.fill(); x.stroke();
  x.fillStyle = '#f2f6ee';
  x.textAlign = 'center';
  shown.forEach((ln, i) => x.fillText(ln, 320, y0 + 58 + i*58));
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
  sp.scale.set(3.0, 3.0 * 300/640, 1);
  return sp;
}

// ── 배치 (겹침 방지) ──
const placed = [];
function findSpot(prefAng, prefDist){
  const MIN = 2.7;
  for (let tryN = 0; tryN < 60; tryN++) {
    let ang, dist;
    if (prefAng != null && tryN < 20) {
      ang = prefAng + (Math.random()-.5) * (0.5 + tryN*.12);
      dist = (prefDist ?? 4) + tryN * .28;
    } else {
      ang = Math.random()*Math.PI*2;
      dist = 2.2 + Math.random()*6.8;
    }
    const px = Math.cos(ang)*dist, pz = Math.sin(ang)*dist;
    if (placed.every(q => Math.hypot(q.x-px, q.z-pz) >= MIN)) {
      placed.push({x:px, z:pz});
      return {px, pz};
    }
  }
  const ang = Math.random()*Math.PI*2, dist = 9 + Math.random()*3;
  const px = Math.cos(ang)*dist, pz = Math.sin(ang)*dist;
  placed.push({x:px, z:pz});
  return {px, pz};
}

const leaves = [];
function addLeaf(text, opts = {}){
  const gold = !!opts.gold;
  const { px, pz } = findSpot(opts.ang, opts.dist);
  const grp = new THREE.Group();
  // 주 패드 + 곁 패드 1~2 + 꽃 (군락)
  const r = 1.0 + Math.random()*.28;
  const main = makePad(r, gold ? 'gold' : 'green');
  grp.add(main);
  const vars = ['green', 'green', 'olive', 'wine', 'rose'];
  const nSide = 3 + (Math.random()*3|0);
  for (let i = 0; i < nSide; i++) {
    const sr = r * rnd(.32, .58);
    const side = makePad(sr, vars[(Math.random()*vars.length)|0]);
    const a = i/nSide*Math.PI*2 + rnd(-.5, .5), d = r + sr*rnd(.55, 1.1);
    side.position.set(Math.cos(a)*d, -.008 - i*.004, Math.sin(a)*d);
    grp.add(side);
  }
  if (gold || Math.random() < .7) {
    const fl = makeFlower(rnd(.5, .8), gold ? 'rose' : FLOWER_KINDS[(Math.random()*FLOWER_KINDS.length)|0]);
    const a = Math.random()*Math.PI*2, d = r*rnd(.4, .75);
    fl.position.set(Math.cos(a)*d, .06, Math.sin(a)*d);
    grp.add(fl);
  }
  if (gold) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r + .12, .035, 10, 60),
      new THREE.MeshBasicMaterial({ color: 0xd8b978 }));
    ring.rotation.x = Math.PI/2;
    ring.position.y = .05;
    grp.add(ring);
  }
  grp.position.set(px, .07, pz);
  scene.add(grp);
  const sp = textSprite(text, gold);
  sp.position.set(px, 1.15, pz);
  scene.add(sp);
  leaves.push({ m: grp, x: px, z: pz, sp, phase: Math.random()*6.28, spin: (Math.random()-.5)*.0008 });
  return { m: grp, sp };
}

let saved = JSON.parse(localStorage.getItem('m100_pond') || 'null') || SEED;
saved.slice(-18).forEach(t => addLeaf(t));

const countEl = document.getElementById('count');
const updateCount = () => countEl.textContent = saved.length + '번째 잎까지 떠 있습니다 · 90일간 이 연못에 남습니다';
updateCount();

let lastGold = null;
document.getElementById('send').onclick = () => {
  const txt = document.getElementById('txt');
  const v = txt.value.trim();
  if (!v) return;
  saved.push(v);
  localStorage.setItem('m100_pond', JSON.stringify(saved.slice(-100)));
  if (lastGold) {
    const ring = lastGold.m.children.find(ch => ch.geometry && ch.geometry.type === 'TorusGeometry');
    if (ring) lastGold.m.remove(ring);
  }
  const camAng = Math.atan2(camera.position.z, camera.position.x);
  lastGold = addLeaf(v, { gold: true, ang: camAng, dist: 4.2 });
  txt.value = '';
  txt.blur();
  updateCount();
};
document.getElementById('txt').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('send').click(); });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  waves(t);
  waterTex.offset.x = Math.sin(t*.05)*.004;
  waterTex.offset.y = Math.cos(t*.04)*.004;
  for (const L of leaves) {
    const y = waveH(L.x, L.z, t) + .06 + Math.sin(t*.8 + L.phase)*.015;
    L.m.position.y = y;
    L.m.rotation.y += L.spin;
    if (L.sp) {
      L.sp.position.y = y + 1.05 + Math.sin(t*.8 + L.phase)*.02;
      const d = camera.position.distanceTo(L.sp.position);
      const s = THREE.MathUtils.clamp(3.4 - d*.09, 1.6, 3.0);
      L.sp.scale.set(s, s*300/640, 1);
      L.sp.material.opacity = THREE.MathUtils.clamp(1.35 - d*.055, .25, 1);
    }
  }
  controls.update();
  composer.render();
});
</script>
</body>
</html>
