<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모네 살아나는 그림 — AR 프로토타입</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;overflow:hidden;}
  #container{width:100%;height:100%;position:relative;}
  #overlay{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center;}
  #overlay img{width:150px;border-radius:8px;border:1px solid #333;}
  h1{font-size:19px;margin:0;font-weight:800;}
  p{font-size:13.5px;color:#aaa;margin:0;max-width:300px;line-height:1.6;}
  button{background:#fff;color:#000;border:0;border-radius:999px;padding:13px 34px;font-size:16px;font-weight:800;margin-top:6px;}
  button:disabled{opacity:.4;}
  #status{font-size:12.5px;color:#7fbf9a;min-height:36px;max-width:320px;word-break:break-all;}
  #status.err{color:#e07a6a;}
  a{color:#8ab4f8;font-size:12.5px;}
  #hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:#fff;text-shadow:0 1px 4px #000;z-index:5;display:none;}
</style>
</head>
<body>
<div id="container"></div>
<div id="dbg" style="position:fixed;top:8px;left:8px;z-index:6;font:11px monospace;color:#7fbf9a;text-shadow:0 1px 2px #000;"></div>
<div id="hint">그림을 화면에 담아보세요 — 그림이 살아납니다</div>

<div id="overlay">
  <img src="target.jpg" alt="타깃 그림">
  <h1>모네 — 살아나는 그림 (프로토타입)</h1>
  <p>이 그림(벽 출력물 또는 다른 화면)에 카메라를 비추면 그림 위에 영상이 붙어 재생됩니다.</p>
  <p><a href="wall.html" target="_blank">다른 기기에 타깃 그림 띄우기 (wall.html)</a></p>
  <div id="status">엔진 로딩 중…</div>
  <button id="startBtn">시작</button>
</div>

<video id="vid" src="living.mp4" playsinline muted loop preload="auto" crossorigin="anonymous" style="display:none"></video>

<!-- 부트가드: 모듈이 죽어도 버튼은 반드시 반응하고 에러를 화면에 띄운다 -->
<script>
  window.__errors = [];
  window.addEventListener('error', function(e){ window.__errors.push(e.message || String(e.error||e)); });
  window.addEventListener('unhandledrejection', function(e){ window.__errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });
  document.getElementById('startBtn').addEventListener('click', function(){
    if (window.__start) { window.__start(); return; }
    var s = document.getElementById('status');
    s.className = 'err';
    s.textContent = 'AR 엔진이 로드되지 않았습니다. ' +
      (window.__errors.length ? '원인: ' + window.__errors.join(' | ') :
       '브라우저가 오래됐을 수 있습니다 (iOS 16.4+ / 최신 Chrome 필요).');
  });
</script>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

const statusEl = document.getElementById('status');
const btn = document.getElementById('startBtn');
const overlay = document.getElementById('overlay');
const hint = document.getElementById('hint');
const video = document.getElementById('vid');

const ok  = t => { statusEl.className='';    statusEl.textContent = t; };
const bad = t => { statusEl.className='err'; statusEl.textContent = t; };

async function start() {
  btn.disabled = true;
  try {
    ok('카메라 시작 중… 권한을 허용해 주세요');
    const mindar = new MindARThree({
      container: document.getElementById('container'),
      imageTargetSrc: 'targets.mind',
      uiScanning: 'no', uiLoading: 'no',
      filterMinCF: 0.0001, filterBeta: 0.003
    });
    const { renderer, scene, camera } = mindar;

    const texture = new THREE.VideoTexture(video);
    texture.encoding = THREE.sRGBEncoding;
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(1.02, (993/800) * 1.02),
      new THREE.MeshBasicMaterial({ map: texture })
    );
    const anchor = mindar.addAnchor(0);
    anchor.group.add(plane);
    anchor.onTargetFound = () => { video.play(); hint.style.display = 'none'; };
    anchor.onTargetLost  = () => { video.pause(); };

    await mindar.start();
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
    overlay.style.display = 'none';
    hint.style.display = 'block';

    // camera watchdog v2: 프레임 밝기 샘플링 + 레이아웃 진단 + 자동 스트림 복구
    const dbg = document.getElementById('dbg');
    const container = document.getElementById('container');
    let camVideo = container.querySelector('video');
    const sc = document.createElement('canvas'); sc.width = 32; sc.height = 32;
    const sctx = sc.getContext('2d', { willReadFrequently: true });
    const lumOf = v => { try { sctx.drawImage(v, 0, 0, 32, 32);
      const d = sctx.getImageData(0, 0, 32, 32).data; let s = 0;
      for (let k = 0; k < d.length; k += 4) s += d[k] + d[k+1] + d[k+2];
      return Math.round(s / (32*32*3)); } catch (e) { return -1; } };
    const rectOf = el => { const r = el.getBoundingClientRect();
      return Math.round(r.width)+'x'+Math.round(r.height)+'@'+Math.round(r.left)+','+Math.round(r.top); };

    // 표시 레이어 강제 고정 (lum 정상인데 검은 화면 대응)
    const forceLayout = () => {
      if (camVideo) camVideo.style.cssText =
        'position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:0;display:block;visibility:visible;opacity:1;';
      const cnv0 = container.querySelector('canvas');
      if (cnv0) cnv0.style.cssText +=
        ';position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;pointer-events:none;';
    };
    forceLayout(); setTimeout(forceLayout, 800); setTimeout(forceLayout, 2000);

    let restarted = false;
    async function restartStream() {
      if (restarted || !camVideo) return; restarted = true;
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        const oldS = camVideo.srcObject;
        camVideo.srcObject = s;
        if (oldS) oldS.getTracks().forEach(t => t.stop());
        await camVideo.play().catch(()=>{});
      } catch (e) { dbg.textContent += ' | 재획득 실패: ' + (e.message || e); }
    }

    setInterval(() => {
      camVideo = camVideo || container.querySelector('video');
      if (!camVideo) { dbg.textContent = 'cam element 없음'; return; }
      const lum = lumOf(camVideo);
      const cnv = container.querySelector('canvas');
      const track = camVideo.srcObject && camVideo.srcObject.getVideoTracks()[0];
      dbg.innerHTML = 'cam ' + camVideo.videoWidth + 'x' + camVideo.videoHeight +
        ' rs' + camVideo.readyState + (camVideo.paused ? ' PAUSED' : ' live') +
        ' lum:' + lum +
        (track ? ' trk:' + track.readyState + (track.muted ? '/muted' : '') : '') +
        '<br>vid ' + rectOf(camVideo) + ' cnv ' + (cnv ? rectOf(cnv) : '없음') + ' glA:' + (renderer.getContext().getContextAttributes().alpha ? 'T' : 'F');
      if (camVideo.paused) camVideo.play().catch(()=>{});
      // 프레임이 사실상 검으면(밝기<6) 스트림 1회 재획득
      if (lum >= 0 && lum < 6 && camVideo.readyState >= 2) restartStream();
    }, 1000);
  } catch (e) {
    bad(e && e.message ? '오류: ' + e.message : '카메라를 시작하지 못했습니다 — 브라우저의 카메라 권한을 확인해 주세요');
    btn.disabled = false;
  }
}
window.__start = start;
ok('준비됨 — 시작을 누르면 바로 카메라가 켜집니다');
</script>
</body>
</html>
