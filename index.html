<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>모네 살아나는 그림 — AR 프로토타입</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
  #overlay{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;padding:24px;text-align:center;}
  #overlay img{width:150px;border-radius:8px;border:1px solid #333;}
  h1{font-size:19px;margin:0;font-weight:800;}
  p{font-size:13.5px;color:#aaa;margin:0;max-width:300px;line-height:1.6;}
  button{background:#fff;color:#000;border:0;border-radius:999px;padding:13px 34px;font-size:16px;font-weight:800;margin-top:6px;}
  button:disabled{opacity:.4;}
  #status{font-size:12.5px;color:#7fbf9a;min-height:36px;max-width:320px;word-break:break-all;}
  #status.err{color:#e07a6a;}
  a{color:#8ab4f8;font-size:12.5px;}
  #dbg{position:fixed;top:8px;left:8px;z-index:6;font:11px monospace;color:#7fbf9a;text-shadow:0 1px 2px #000;}
</style>
</head>
<body>
<div id="dbg"></div>

<div id="overlay">
  <img src="target.jpg" alt="타깃 그림">
  <h1>모네 — 살아나는 그림 (프로토타입)</h1>
  <p>이 그림(벽 출력물 또는 다른 화면)에 카메라를 비추면 그림 위에 영상이 붙어 재생됩니다.</p>
  <p><a href="wall.html" target="_blank">다른 기기에 타깃 그림 띄우기 (wall.html)</a></p>
  <div id="status">엔진 로딩 중…</div>
  <button id="startBtn">시작</button>
</div>

<!-- MindAR 공식 image-tracking 비디오 예제 구조 그대로 -->
<a-scene id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: no; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">
  <a-assets>
    <video id="vid" src="./living.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="anchor" mindar-image-target="targetIndex: 0">
    <a-video src="#vid" width="1.02" height="1.266" position="0 0 0"></a-video>
  </a-entity>
</a-scene>

<script>
  var statusEl = document.getElementById('status');
  var dbg = document.getElementById('dbg');
  var btn = document.getElementById('startBtn');
  var overlay = document.getElementById('overlay');
  window.__errors = [];
  window.addEventListener('error', function(e){ window.__errors.push(e.message || String(e.error||e)); });

  function ok(t){ statusEl.className=''; statusEl.textContent=t; }
  function bad(t){ statusEl.className='err'; statusEl.textContent=t; }

  var sceneEl = document.getElementById('scene');
  var anchorEl = document.getElementById('anchor');
  var video = document.getElementById('vid');
  var tracked = false;

  anchorEl.addEventListener('targetFound', function(){
    tracked = true;
    video.play().catch(function(){});
  });
  anchorEl.addEventListener('targetLost', function(){
    tracked = false;
    video.pause();
  });
  sceneEl.addEventListener('arError', function(){ bad('AR 시작 실패 — 카메라 권한을 확인해 주세요'); btn.disabled = false; });

  setInterval(function(){
    dbg.textContent = (tracked ? '타깃 인식됨' : '타깃 찾는 중') +
      ' | 영상 ' + (video.paused ? '정지' : '▶재생중 ' + video.currentTime.toFixed(1) + 's');
  }, 500);

  btn.addEventListener('click', function(){
    btn.disabled = true;
    // iOS 재생 잠금 해제: 제스처 안에서 재생 시작 (숨김 상태로 계속 재생 — targetLost 때만 pause)
    video.muted = true;
    video.play().catch(function(){});
    var arSystem = sceneEl.systems['mindar-image-system'];
    if (!arSystem) {
      bad('AR 엔진이 로드되지 않았습니다. ' + (window.__errors.join(' | ') || '브라우저 버전을 확인해 주세요'));
      btn.disabled = false;
      return;
    }
    ok('카메라 시작 중… 권한을 허용해 주세요');
    try { arSystem.start(); } catch(e) { bad('오류: ' + (e.message||e)); btn.disabled=false; return; }
    sceneEl.addEventListener('arReady', function(){ overlay.style.display = 'none'; }, { once: true });
  });

  ok('준비됨 — 시작을 누르면 바로 카메라가 켜집니다');
</script>
</body>
</html>
