<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오디오 도슨트 — MONET 100</title>
<style>
  :root{--bg:#faf9f6;--ink:#1c1a16;--sub:#6f6a5e;--line:#e2ded6;--cap:#8a8578;--gold:#b49a5e;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
  body{max-width:520px;margin:0 auto;padding:22px 16px 210px;}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
  .top a{font-size:12.5px;color:var(--sub);text-decoration:none;}
  .top .cap{font-size:10.5px;letter-spacing:.28em;color:var(--cap);font-weight:600;}
  h1{font-size:21px;font-weight:800;margin:0 0 14px;}

  .floor{background:var(--ink);color:var(--bg);border-radius:6px;padding:8px 13px;font-size:11px;letter-spacing:.2em;font-weight:700;margin:18px 0 10px;}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,22,.07),0 3px 0 var(--line);}
  .item:active{transform:translateY(3px);box-shadow:none;}
  .item.cur{border-color:var(--ink);}
  .item .art{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--line);}
  .item .tt{font-size:14px;font-weight:800;line-height:1.4;}
  .item .zz{font-size:10.5px;color:var(--cap);letter-spacing:.06em;margin-top:2px;}
  .item .dur{margin-left:auto;font-size:11px;color:var(--cap);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .item.cur .dur{color:#2e6e4e;font-weight:700;}
  .eq{display:none;gap:2px;align-items:flex-end;height:14px;margin-left:6px;}
  .item.cur.playing .eq{display:flex;}
  .eq i{width:3px;background:#2e6e4e;animation:eq 0.9s infinite ease-in-out;}
  .eq i:nth-child(1){height:60%;animation-delay:0s;}
  .eq i:nth-child(2){height:100%;animation-delay:.2s;}
  .eq i:nth-child(3){height:40%;animation-delay:.4s;}
  @keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  /* ── 플레이어 ── */
  #player{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -12px 34px rgba(28,26,22,.16);padding:14px 18px calc(16px + env(safe-area-inset-bottom));z-index:9;
    transform:translateY(110%);transition:transform .28s;}
  #player.up{transform:none;}
  .phead{display:flex;gap:12px;align-items:center;}
  .phead img{width:52px;height:52px;border-radius:8px;object-fit:cover;border:1px solid var(--line);}
  .phead .t{font-size:14.5px;font-weight:800;line-height:1.35;}
  .phead .z{font-size:11px;color:var(--cap);margin-top:2px;}

  .seekrow{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .seekrow span{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:34px;}
  .seekrow span:last-child{text-align:right;}
  #seek{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:#eee7d8;outline:none;}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);cursor:pointer;}
  #seek::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:0;cursor:pointer;}

  .ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;}
  .ctrl button{background:none;border:0;font-size:20px;color:var(--ink);cursor:pointer;padding:8px;font-family:inherit;}
  .ctrl button:active{transform:scale(.9);}
  #btnPlay{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:22px;
    box-shadow:0 4px 12px rgba(28,26,22,.25),0 2px 0 rgba(28,26,22,.5);display:flex;align-items:center;justify-content:center;}
  #btnPlay:active{transform:translateY(2px) scale(.98);}
  .skip{font-size:11px !important;font-weight:800;color:var(--sub) !important;line-height:1.1;}

  .rates{display:flex;justify-content:center;gap:6px;margin-top:8px;}
  .rates button{background:#fff;border:1px solid #d8d3c8;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--sub);font-family:inherit;cursor:pointer;}
  .rates button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
  .bgnote{font-size:10px;color:#a89f8d;text-align:center;margin:8px 0 0;}
</style>
</head>
<body>
  <div class="top"><a href="index.html">← 홈</a><span class="cap">MONET 100 · 오디오 도슨트</span></div>
  <h1>오디오 도슨트</h1>
  <div id="list"></div>

  <div id="player">
    <div class="phead">
      <img id="pArt" src="quest_img/monet_sunrise.jpg" alt="">
      <div><div class="t" id="pTitle">—</div><div class="z" id="pZone"></div></div>
    </div>
    <div class="seekrow">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <span id="tDur">0:00</span>
    </div>
    <div class="ctrl">
      <button id="btnPrev" title="이전">⏮</button>
      <button id="btnB10" class="skip">−10초</button>
      <button id="btnPlay">▶</button>
      <button id="btnF10" class="skip">+10초</button>
      <button id="btnNext" title="다음">⏭</button>
    </div>
    <div class="rates" id="rates"></div>
    <p class="bgnote">화면을 꺼도 이어서 재생됩니다 · 잠금화면에서 제어 가능 · 현재 임시 음성(성우 녹음으로 교체 예정)</p>
  </div>

<audio id="au" preload="metadata"></audio>

<script>
const TRACKS = [
 {id:'a4', f:'4층', name:'접수 안내 — 전시를 시작하며', zone:'ZONE A', art:'quest_img/monet_sunrise.jpg'},
 {id:'b4', f:'4층', name:'아카데미 살롱 — 권위가 아름다움을 심사하다', zone:'ZONE B', art:'quest_img/merson.jpg'},
 {id:'c4', f:'4층', name:'변화의 복도 — 시대는 이미 변하고 있었다', zone:'ZONE C', art:'quest_img/gare.jpg'},
 {id:'d4', f:'4층', name:'모네 전시관 — 새로운 시대가 시작되다', zone:'ZONE D', art:'quest_img/monet_sunrise.jpg'},
 {id:'e4', f:'4층', name:'미디어 전시 — 헤리티지, 모네의 캔버스가 되다', zone:'ZONE E', art:'quest_img/rouen.jpg'},
 {id:'a3', f:'3층', name:'생라자르역 — 산업혁명의 빛', zone:'ZONE A', art:'quest_img/gare.jpg'},
 {id:'b3', f:'3층', name:'에트르타 — 빛이 부서지는 절벽', zone:'ZONE B', art:'quest_img/etretat.jpg'},
 {id:'c3', f:'3층', name:'건초더미 — 빛으로 완성된 그림', zone:'ZONE C', art:'quest_img/hay_autumn.jpg'},
 {id:'d3', f:'3층', name:'지베르니 — 빛과 물의 실험실', zone:'ZONE D', art:'quest_img/bridge.jpg'},
 {id:'e3', f:'3층', name:'미시아 살롱 — 한 시대가 저물고', zone:'ZONE E', art:'target.jpg'},
];
const au = document.getElementById('au');
const list = document.getElementById('list');
let idx = -1;

const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';

// ── 리스트 ──
let lastFloor = '';
TRACKS.forEach((t, i) => {
  if (t.f !== lastFloor) {
    lastFloor = t.f;
    const h = document.createElement('div'); h.className = 'floor';
    h.textContent = t.f + (t.f === '4층' ? ' — 이해하는 공간' : ' — 체험하는 공간');
    list.appendChild(h);
  }
  const d = document.createElement('div'); d.className = 'item'; d.id = 'it' + i;
  d.innerHTML = `<img class="art" src="${t.art}"><div><div class="tt">${t.name}</div><div class="zz">${t.f} · ${t.zone}</div></div>
    <div class="eq"><i></i><i></i><i></i></div><div class="dur" id="du${i}">—</div>`;
  d.onclick = () => load(i, true);
  list.appendChild(d);
  // 트랙 길이 미리 읽기
  const probe = new Audio();
  probe.preload = 'metadata';
  probe.src = 'audio/' + t.id + '.m4a';
  probe.onloadedmetadata = () => { document.getElementById('du' + i).textContent = fmt(probe.duration); };
});

// ── 플레이어 ──
const player = document.getElementById('player');
const seek = document.getElementById('seek');
let seeking = false;
let rate = 1.0;

function markList(){
  document.querySelectorAll('.item').forEach((el, i) => {
    el.classList.toggle('cur', i === idx);
    el.classList.toggle('playing', i === idx && !au.paused);
  });
  document.getElementById('btnPlay').textContent = au.paused ? '▶' : '⏸';
}

function load(i, autoplay){
  idx = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[idx];
  au.src = 'audio/' + t.id + '.m4a';
  au.playbackRate = rate;
  document.getElementById('pTitle').textContent = t.name;
  document.getElementById('pZone').textContent = t.f + ' · ' + t.zone;
  document.getElementById('pArt').src = t.art;
  player.classList.add('up');
  if (autoplay) au.play();
  mediaSession(t);
  markList();
}

function mediaSession(t){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.name,
    artist: 'MONET 100 오디오 도슨트',
    album: t.f + ' ' + t.zone,
    artwork: [{ src: new URL(t.art, location.href).href, sizes: '512x512', type: 'image/jpeg' }],
  });
  navigator.mediaSession.setActionHandler('play', () => au.play());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => load(idx - 1, true));
  navigator.mediaSession.setActionHandler('nexttrack', () => load(idx + 1, true));
  navigator.mediaSession.setActionHandler('seekbackward', () => { au.currentTime = Math.max(0, au.currentTime - 10); });
  navigator.mediaSession.setActionHandler('seekforward', () => { au.currentTime = Math.min(au.duration || 0, au.currentTime + 10); });
  try {
    navigator.mediaSession.setActionHandler('seekto', e => { if (e.seekTime != null) au.currentTime = e.seekTime; });
  } catch (err) {}
}

au.addEventListener('loadedmetadata', () => { document.getElementById('tDur').textContent = fmt(au.duration); seek.max = au.duration; });
au.addEventListener('timeupdate', () => {
  if (!seeking) { seek.value = au.currentTime; document.getElementById('tCur').textContent = fmt(au.currentTime); }
  if ('mediaSession' in navigator && au.duration) {
    try { navigator.mediaSession.setPositionState({ duration: au.duration, playbackRate: au.playbackRate, position: au.currentTime }); } catch (e) {}
  }
});
au.addEventListener('play', markList);
au.addEventListener('pause', markList);
au.addEventListener('ended', () => load(idx + 1, true));   // 다음 트랙 이어서

seek.addEventListener('input', () => { seeking = true; document.getElementById('tCur').textContent = fmt(+seek.value); });
seek.addEventListener('change', () => { au.currentTime = +seek.value; seeking = false; });

document.getElementById('btnPlay').onclick = () => { if (idx < 0) load(0, true); else au.paused ? au.play() : au.pause(); };
document.getElementById('btnPrev').onclick = () => load(idx <= 0 ? 0 : (au.currentTime > 3 ? idx : idx - 1), true);
document.getElementById('btnNext').onclick = () => load(idx + 1, true);
document.getElementById('btnB10').onclick = () => au.currentTime = Math.max(0, au.currentTime - 10);
document.getElementById('btnF10').onclick = () => au.currentTime = Math.min(au.duration || 0, au.currentTime + 10);

// 배속
const RATES = [0.8, 1.0, 1.25, 1.5];
const ratesEl = document.getElementById('rates');
RATES.forEach(r => {
  const b = document.createElement('button');
  b.textContent = r.toFixed(2).replace(/\.?0+$/,'') + '×';
  if (r === 1) b.classList.add('on');
  b.onclick = () => {
    rate = r; au.playbackRate = r;
    ratesEl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  };
  ratesEl.appendChild(b);
});

// 딥링크 (#b4)
const hash = location.hash.slice(1);
if (hash) {
  const i = TRACKS.findIndex(t => t.id === hash);
  if (i >= 0) setTimeout(() => { document.getElementById('it' + i).scrollIntoView({block:'center'}); load(i, true); }, 300);
}
</script>
</body>
</html>
